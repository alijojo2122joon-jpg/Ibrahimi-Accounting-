<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#e6eaef">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ابراهیمی اکانتینگ</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#e6eaef;--card:#e6eaef;--sd:#c3c9d2;--sl:#ffffff;--tx:#2b3340;--mu:#7d8796;--line:rgba(120,130,145,.18);
 --g:#0f8f78;--g2:#13a389;--g3:rgba(19,163,137,.12);--red:#e5484d;--or:#f08c2e;--gr:#16a37a;--bl:#3b6fd8;--pu:#8b5cf6;
 --acc1:#ffc24b;--acc2:#ff5a4e;--r:22px;
 --up:7px 7px 16px var(--sd),-7px -7px 16px var(--sl);--upS:4px 4px 9px var(--sd),-4px -4px 9px var(--sl);
 --in:inset 4px 4px 9px var(--sd),inset -4px -4px 9px var(--sl);--inS:inset 2px 2px 5px var(--sd),inset -2px -2px 5px var(--sl)}
[data-theme=dark]{--bg:#2a2e35;--card:#2a2e35;--sd:#1b1e22;--sl:#383d46;--tx:#e9ecf1;--mu:#98a1ae;--line:rgba(255,255,255,.07);--g3:rgba(19,163,137,.16)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,sans-serif;font-size:15px}
button,input,select,textarea{font-family:inherit;font-size:15px;color:var(--tx)}
a{color:var(--g2)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
#side{background:var(--bg);position:sticky;top:0;height:100vh;overflow:auto;padding:22px 16px;box-shadow:6px 0 18px var(--sd)}
#side .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;padding:4px 6px}
#side .logo{width:44px;height:44px;border-radius:50%;box-shadow:var(--up);display:grid;place-items:center;color:var(--g2);position:relative;flex:none}
#side .logo:after{content:'';position:absolute;inset:-5px;border-radius:50%;border:2.5px solid transparent;border-top-color:var(--acc1);border-left-color:var(--acc2);transform:rotate(-30deg)}
#side .sub{color:var(--mu);font-size:12px;padding:4px 6px 18px 6px;margin-right:56px;margin-top:-12px}
#side a{display:flex;gap:12px;align-items:center;color:var(--mu);text-decoration:none;padding:11px 14px;border-radius:16px;margin:7px 0;cursor:pointer;transition:.2s}
#side a:hover{color:var(--tx)}
#side a.on{box-shadow:var(--in);color:var(--g2);font-weight:700}
#side a.on:before{content:'';width:6px;height:6px;border-radius:50%;background:var(--g2);order:3;margin-right:auto;box-shadow:0 0 8px var(--g2)}
#side .qa{margin-top:18px;display:grid;gap:10px}
#side .qa button{white-space:nowrap;background:var(--bg);color:var(--tx);border:0;border-radius:16px;padding:11px 14px;cursor:pointer;text-align:right;box-shadow:var(--upS);display:flex;align-items:center;gap:10px}
#side .qa button svg{color:var(--g2)}
#side .qa button:active{box-shadow:var(--inS)}
main{min-width:0}
#top{position:sticky;top:0;z-index:500;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);display:flex;align-items:center;gap:10px;padding:12px 18px}
#top h1{font-size:18px;margin:0;flex:1;font-weight:800}
.chip{display:inline-flex;align-items:center;gap:7px;background:var(--bg);color:var(--tx);border-radius:99px;padding:8px 13px;font-size:13px;font-weight:600;cursor:pointer;border:0;box-shadow:var(--upS)}
.chip:active{box-shadow:var(--inS)}
.chip svg.i{width:17px;height:17px;color:var(--g2)}
.dot{width:8px;height:8px;border-radius:50%;background:#a7afba;display:inline-block}
.dot.ok{background:var(--gr);box-shadow:0 0 8px var(--gr)}.dot.err{background:var(--red);box-shadow:0 0 8px var(--red)}.dot.busy{background:var(--or)}
#view{padding:10px 18px 18px;max-width:1240px;margin:auto;padding-bottom:120px}
#bnav{display:none}
.grid{display:grid;gap:18px}
.k4{grid-template-columns:repeat(4,minmax(0,1fr))}.k3{grid-template-columns:repeat(3,minmax(0,1fr))}.k2{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:var(--up)}
.card .card{box-shadow:var(--in)}
.card h3{margin:0 0 14px;font-size:15px;display:flex;align-items:center;gap:10px;font-weight:800}
.card h3 .sp{flex:1}
.card h3>svg.i{color:var(--g2)}
.kpi{display:flex;gap:14px;align-items:center}
.ic{--c:var(--g2);width:50px;height:50px;border-radius:50%;box-shadow:var(--upS);display:grid;place-items:center;color:var(--c);position:relative;flex:none;margin:5px}
.ic:after{content:'';position:absolute;inset:-6px;border-radius:50%;border:2.5px solid transparent;border-top-color:var(--c);border-right-color:var(--c);opacity:.85;transform:rotate(-25deg)}
.ic svg.i{width:22px;height:22px}
.kt{min-width:0}
.kpi .l{color:var(--mu);font-size:12.5px}.kpi .v{font-size:19px;font-weight:800;margin-top:3px;white-space:nowrap}
.kpi .s{font-size:12px;color:var(--mu);margin-top:2px}
.pos{color:var(--gr)}.neg{color:var(--red)}.warn{color:var(--or)}.mu{color:var(--mu)}
.btn{--c:var(--g2);background:linear-gradient(145deg,color-mix(in srgb,var(--c) 88%,#fff),var(--c));color:#fff;border:0;border-radius:14px;padding:11px 16px;cursor:pointer;font-weight:700;display:inline-flex;align-items:center;gap:7px;justify-content:center;box-shadow:4px 4px 10px var(--sd),-4px -4px 10px var(--sl);text-decoration:none;transition:.15s}
.hm{}
.btn:active{transform:scale(.97);box-shadow:var(--inS)}
.btn.alt,.btn.ghost{background:var(--bg);color:var(--g2)}
.btn.red{--c:var(--red)}.btn.bl{--c:var(--bl)}.btn.or{--c:var(--or)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:12px}
.btn:disabled{opacity:.5}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:right;color:var(--mu);font-weight:600;font-size:12.5px;border-bottom:1px solid var(--line);padding:9px 8px;white-space:nowrap}
.tbl td{border-bottom:1px solid var(--line);padding:10px 8px;vertical-align:top}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:var(--g3)}
.tbl .n{text-align:left;white-space:nowrap;direction:ltr}
.tbl tfoot td{font-weight:800;border-top:2px solid var(--mu)}
.tw{overflow-x:auto}
.badge{--c:#888;display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:4px 10px;font-size:12px;font-weight:700;color:var(--c);white-space:nowrap;background:color-mix(in srgb,var(--c) 14%,transparent)}
.badge:before{content:'';width:7px;height:7px;border-radius:50%;background:var(--c)}
.list .it{display:flex;gap:12px;align-items:center;padding:10px 12px;margin:0 0 10px;border-radius:18px;cursor:pointer;box-shadow:var(--upS);transition:.15s}
.list .it:active{box-shadow:var(--inS)}
.list .it .m{flex:1;min-width:0}.list .it .t{font-weight:700}.list .it .d{font-size:12.5px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .it .a{text-align:left;font-weight:800;white-space:nowrap}
.av{--c:var(--g2);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:var(--c);flex:none;box-shadow:var(--upS);position:relative;margin:3px}
.av:after{content:'';position:absolute;inset:-4px;border-radius:50%;border:2px solid transparent;border-top-color:var(--c);border-left-color:var(--c);transform:rotate(20deg)}
input.in,select.in,textarea.in{width:100%;padding:12px 14px;border:0;border-radius:14px;background:var(--bg);box-shadow:var(--in)}
input.in:focus,select.in:focus,textarea.in:focus{outline:2px solid color-mix(in srgb,var(--g2) 55%,transparent)}
.fl{display:block;margin-bottom:12px}.fl>span{display:block;font-size:12.5px;color:var(--mu);margin-bottom:6px;font-weight:600}
.f2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.tabs{display:flex;gap:10px;overflow-x:auto;margin-bottom:16px;padding:6px 6px 10px}
.tabs button{border:0;background:var(--bg);border-radius:99px;padding:8px 16px;white-space:nowrap;cursor:pointer;box-shadow:var(--upS);color:var(--mu)}
.tabs button.on{box-shadow:var(--inS);color:var(--g2);font-weight:700}
.tabs select.in{padding:8px 12px}
#modal{position:fixed;inset:0;background:rgba(30,36,45,.35);backdrop-filter:blur(3px);z-index:2000;display:flex;align-items:center;justify-content:center}
#modal.hide{display:none}
.sheet{background:var(--bg);border-radius:26px;width:min(700px,96vw);max-height:92vh;display:flex;flex-direction:column;box-shadow:12px 12px 30px rgba(0,0,0,.25)}
.sh-head{display:flex;align-items:center;padding:16px 18px}
.sh-head b{flex:1;font-size:16px}.sh-head button{border:0;background:var(--bg);border-radius:50%;width:38px;height:38px;cursor:pointer;font-size:15px;box-shadow:var(--upS)}
#mBody{padding:6px 18px 20px;overflow:auto}
.irow{display:grid;grid-template-columns:1fr 80px 100px 90px 34px;gap:8px;align-items:center;margin-bottom:10px}
.irow.adj{grid-template-columns:1fr 100px 90px 34px}
.irow select,.irow input{padding:10px;border:0;border-radius:12px;width:100%;min-width:0;background:var(--bg);box-shadow:var(--inS)}
.irow .ilt{font-size:12.5px;text-align:left;font-weight:700;direction:ltr}
.irow .x{border:0;background:var(--bg);color:var(--red);border-radius:50%;height:34px;width:34px;cursor:pointer;box-shadow:var(--upS)}
.sum{border-radius:18px;padding:12px 16px;margin:12px 0;box-shadow:var(--in)}
.sum div{display:flex;justify-content:space-between;padding:3px 0}.sum .big:first-child{border-top:0;margin-top:0;padding-top:3px}.sum .big{font-weight:800;font-size:16px;border-top:1px dashed var(--mu);margin-top:5px;padding-top:7px}
#toast{position:fixed;top:72px;bottom:auto;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:11px 20px;border-radius:16px;z-index:3000;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center;font-weight:600}
#toast.on{opacity:1}
#map{height:62vh;border-radius:var(--r);box-shadow:var(--in);background:var(--bg);z-index:1;border:6px solid var(--bg)}
.mapbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.leaflet-popup-content{font-family:Vazirmatn,Tahoma;direction:rtl;text-align:right;min-width:200px}
.leaflet-popup-content-wrapper{border-radius:18px}
.pop b{font-size:15px}.pop .row{margin-top:8px;gap:6px}.pop .btn{box-shadow:none}
.aging{display:flex;height:12px;border-radius:99px;overflow:hidden;box-shadow:var(--inS);margin:10px 0 6px}
.aging i{display:block;height:100%}
.empty{padding:28px;text-align:center;color:var(--mu)}
.gps{font-size:12.5px;color:var(--mu)}
.hint{font-size:12.5px;color:var(--mu);line-height:1.9}
pre.code{direction:ltr;text-align:left;background:#1e2229;color:#bfe;padding:12px;border-radius:14px;overflow:auto;font-size:12px;white-space:pre}
details summary{cursor:pointer}
/* hero ring */
.hero{display:grid;grid-template-columns:260px 1fr;gap:22px;align-items:center}
.ring{position:relative;width:230px;height:230px;margin:auto;border-radius:50%;box-shadow:var(--up)}
.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring .in{position:absolute;inset:40px;border-radius:50%;box-shadow:var(--up);display:grid;place-items:center;text-align:center;align-content:center}
.ring .in b{font-size:34px;font-weight:800;line-height:1}
.ring .in b small{font-size:18px}
.ring .in span{font-size:12px;color:var(--mu);margin-top:6px;max-width:120px}
.hrows{display:grid;gap:12px}
.hrow{display:flex;align-items:center;gap:14px;padding:10px 14px 10px 18px;border-radius:99px;box-shadow:var(--upS);cursor:pointer}
.hrow:active{box-shadow:var(--inS)}
.hrow .ic{width:42px;height:42px;margin:4px}.hrow .ic:after{inset:-5px}
.hrow .m{flex:1;min-width:0}.hrow .m div{font-size:12.5px;color:var(--mu)}
.hrow .v{font-weight:800;font-size:17px;white-space:nowrap}
.steps{display:flex;align-items:center;gap:0;margin:4px 0 14px;overflow-x:auto;padding:10px 4px}
@media (max-width:860px){
 #app{grid-template-columns:minmax(0,1fr)}
 #side{display:none}
 #top{padding:12px 14px}
 #view{padding:8px 14px;padding-bottom:120px}
 .grid{gap:14px}
 .k4{grid-template-columns:repeat(2,minmax(0,1fr))}.k3{grid-template-columns:repeat(2,minmax(0,1fr))}
 .k2{grid-template-columns:minmax(0,1fr)}
 .card{padding:15px;border-radius:20px}
 .kpi{flex-direction:column;align-items:flex-start;gap:8px}
 .kpi .v{font-size:16px}
 .ic{width:42px;height:42px}
 .hero{grid-template-columns:1fr}
 .ring{width:210px;height:210px}
 #bnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--bg);z-index:900;padding:8px 6px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -6px 16px var(--sd)}
 #bnav a{flex:1;text-align:center;font-size:11px;color:var(--mu);text-decoration:none;cursor:pointer;padding:2px 0;display:flex;flex-direction:column;align-items:center;gap:3px}
 #bnav a b{width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
 #bnav a.on{color:var(--g2);font-weight:700}
 #bnav a.on b{box-shadow:var(--inS)}
 #bnav a.plus b{width:58px;height:58px;margin-top:-30px;color:#fff;background:linear-gradient(145deg,#1bc3a4,#0f8f78);box-shadow:5px 5px 12px var(--sd),-5px -5px 12px var(--sl);position:relative}
 #bnav a.plus b:after{content:'';position:absolute;inset:-7px;border-radius:50%;border:3px solid transparent;border-top-color:var(--acc1);border-left-color:var(--acc2);transform:rotate(-20deg)}
 #bnav a.plus svg.i{width:28px;height:28px;stroke-width:2.4}
 .irow{grid-template-columns:1fr 64px 80px 30px}.irow .ilt{display:none}
 .irow.adj{grid-template-columns:1fr 80px 30px}
 .sheet{width:100vw;max-height:94vh;border-radius:26px 26px 0 0;position:fixed;bottom:0}
 #modal{align-items:flex-end}
 #map{height:62vh}
}
/* v1.2 — forms, POS, customer hero, chart, print */
.sec{margin-bottom:18px}
.sech{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;margin:0 2px 10px;color:var(--tx)}
.sech svg.i{color:var(--g2);width:18px;height:18px}.sech .sp{flex:1}
.sbox{display:flex;align-items:center;gap:8px;border-radius:14px;box-shadow:var(--in);padding:0 12px;margin-bottom:12px}
.sbox svg.i{color:var(--mu);width:18px;height:18px}
.sbox input{flex:1;border:0;background:transparent;padding:12px 0;outline:none;min-width:0}
.psel{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:18px;box-shadow:var(--upS);cursor:pointer}
.psel .m{flex:1;min-width:0}.psel .m b{font-size:16px}.psel .mu{font-size:12.5px}
.psel .pb{text-align:left}.psel .pb b{font-size:16px}
.psel .chg{color:var(--g2);font-size:13px;font-weight:700}
.plist{max-height:300px;overflow:auto;padding:4px 4px 6px;margin:0 -4px}
.pi{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:14px;cursor:pointer;margin-bottom:6px}
.pi:hover{box-shadow:var(--upS)}.pi:active{box-shadow:var(--inS)}
.pi .m{flex:1;min-width:0}.pi .mu{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pi.new{color:var(--g2)}
.gstrip{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:6px 4px 14px;max-height:290px;overflow:auto}
.pc{position:relative;text-align:right;border:0;background:var(--bg);border-radius:16px;padding:11px 12px;box-shadow:var(--upS);display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0}
.pc b{font-size:13px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:40px}
.pc span{color:var(--g2);font-weight:800;font-size:13.5px}
.pc i{font-style:normal;font-size:11.5px;color:var(--mu)}
.pc.on{box-shadow:var(--inS)}
.pc em{position:absolute;top:-7px;left:-7px;background:linear-gradient(145deg,#1bc3a4,#0f8f78);color:#fff;border-radius:99px;min-width:26px;height:26px;font-style:normal;font-size:12.5px;font-weight:800;display:grid;place-items:center;padding:0 7px;box-shadow:0 3px 8px rgba(0,0,0,.25)}
.cart{display:grid;gap:10px}
.cl{display:grid;grid-template-columns:minmax(0,1fr) auto 120px 90px 34px;gap:10px;align-items:center;padding:10px 12px;border-radius:16px;box-shadow:var(--upS)}
.cn b{font-size:14px}.cn .mu{font-size:12px}
.stp{display:flex;align-items:center;border-radius:12px;box-shadow:var(--inS);overflow:hidden}
.stp button{border:0;background:transparent;width:34px;height:38px;font-size:19px;font-weight:700;color:var(--g2);cursor:pointer}
.stp input{width:46px;border:0;background:transparent;text-align:center;font-weight:800;outline:none}
.cp{display:flex;align-items:center;gap:6px;border-radius:12px;box-shadow:var(--inS);padding:0 10px}
.cp input{width:100%;border:0;background:transparent;padding:10px 0;outline:none;font-weight:600;min-width:0}
.cp .mu{font-size:11.5px}
.ct{font-weight:800;text-align:left;direction:ltr;white-space:nowrap}
.cl .x{border:0;background:var(--bg);color:var(--red);border-radius:50%;height:32px;width:32px;cursor:pointer;box-shadow:var(--upS)}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin:-2px 0 14px}
.chips button{border:0;background:var(--bg);border-radius:99px;padding:8px 14px;box-shadow:var(--upS);cursor:pointer;font-size:13px;font-weight:600;color:var(--g2)}
.chips button:active{box-shadow:var(--inS)}
.seg{display:flex;border-radius:14px;box-shadow:var(--in);padding:5px;gap:5px}
.seg button{flex:1;border:0;background:transparent;border-radius:11px;padding:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--mu);font-weight:600}
.seg button.on{background:var(--bg);box-shadow:var(--upS);color:var(--g2)}
.seg svg.i{width:17px;height:17px}
details.more{border-radius:16px;padding:12px 14px;box-shadow:var(--upS);margin-top:4px}
details.more summary{list-style:none;display:flex;align-items:center;gap:8px;color:var(--mu);font-weight:600;font-size:13.5px}
details.more summary::-webkit-details-marker{display:none}
details.more summary svg.i{width:16px;height:16px}
details.more[open] summary{color:var(--g2)}
input.in.big{font-size:26px;font-weight:800;text-align:center;padding:14px;margin-bottom:12px}
.stick{position:sticky;bottom:-20px;margin:18px -18px -20px;padding:12px 18px calc(12px + env(safe-area-inset-bottom));background:var(--bg);display:flex;align-items:center;gap:14px;box-shadow:0 -8px 16px -6px var(--sd);z-index:5}
.stick .ft{flex:1;min-width:0}.stick .ft .mu{font-size:12px;display:block}.stick .ft b{display:block;font-size:22px;font-weight:800;white-space:nowrap}
.stick .btn{padding:14px 26px;font-size:16px}
.sum:empty{display:none}
.etiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.etiles button{border:0;background:var(--bg);border-radius:18px;padding:12px 6px;box-shadow:var(--upS);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--tx)}
.etiles button .ic{width:38px;height:38px;margin:4px}.etiles button .ic:after{inset:-5px}
.etiles button b{font-size:11.5px;font-weight:600;line-height:1.5;text-align:center}
.etiles button.on{box-shadow:var(--inS)}.etiles button.on b{color:var(--g2)}

<!-- ===================== ENGINE (data + accounting) ===================== -->
<script id="engine">
'use strict';
const LS = 'ebrahimi_acc_v1';
const VERSION = '9.12';

/* ---- Chart of accounts (کدینگ حساب‌ها) ----
   nature: A=asset (debit), L=liability (credit), E=equity (credit), E-=contra equity (debit),
           R=revenue (credit), R-=contra revenue (debit), X=expense (debit) */
const ACCOUNTS = [
 ['1010','صندوق نقدی (دخل)','A'],
 ['1020','بانک / حواله / حساب موبایلی','A'],
 ['1100','حسابات دریافتنی — طلب از دکان‌ها','A'],
 ['1200','موجودی جنس (هنگر / گدام)','A'],
 ['1300','پیشکی و قرض نزد اشخاص','A'],
 ['1500','موتر باربری و تجهیزات','A'],
 ['2100','حسابات پرداختنی — قرض به عمده‌فروش‌ها','L'],
 ['2200','سایر قرضه‌ها','L'],
 ['3100','سرمایهٔ مالک','E'],
 ['3200','برداشت مالک (مصارف شخصی/خانه)','E-'],
 ['3900','موجودی‌های افتتاحیه (اول دوره)','E'],
 ['4100','فروش جنس','R'],
 ['4200','تخفیف و مرجوعی فروش','R-'],
 ['4300','تخفیف دریافتی و سایر عواید','R'],
 ['5100','قیمت تمام‌شدهٔ جنس فروخته‌شده','X'],
 ['6100','تیل و مصرف موتر','X'],
 ['6200','ترمیم، پرزه و تایر موتر','X'],
 ['6300','کرایهٔ هنگر / دکان','X'],
 ['6400','معاش و مزد کارگر','X'],
 ['6500','حمالی و بارگیری','X'],
 ['6600','برق، آب، انترنت، کریدت','X'],
 ['6700','محصول، مالیات، جواز و شاروالی','X'],
 ['6800','کسری، ضایعات و تاریخ‌گذشته','X'],
 ['6900','سایر مصارف','X'],
 ['6950','کسری و اضافهٔ صندوق','X'],
];
const ACC = Object.fromEntries(ACCOUNTS.map(a=>[a[0],{code:a[0],name:a[1],nat:a[2]}]));
const CASH = {cash:'1010', bank:'1020'};

const TT = {
 sale:     ['فروش (بل فروش)', 'INV', '#13806b'],
 sreturn:  ['مرجوعی فروش',    'SR',  '#6f8f2f'],
 purchase: ['خرید عمده',      'PUR', '#2c5aa0'],
 preturn:  ['مرجوعی خرید',    'PR',  '#5b6fb0'],
 receipt:  ['دریافت پول از دکان','RCV','#1e8e5a'],
 payment:  ['پرداخت به عمده‌فروش','PAY','#8e44ad'],
 expense:  ['مصرف',           'EXP', '#c0392b'],
 capital:  ['آوردن سرمایه',    'CAP', '#0f5c4d'],
 drawing:  ['برداشت مالک',     'DRW', '#a0522d'],
 transfer: ['انتقال بین صندوق و بانک','TRF','#607d8b'],
 adjust:   ['اصلاح موجودی گدام','ADJ','#d98a00'],
 cashcount:['بستن صندوق','CNT','#0f8f78'],
 wage:     ['معاش کارگر','WG','#3b6fd8'],
 advance:  ['پیشکی / قرض دادن','ADV','#f08c2e'],
 advret:   ['پس گرفتن پیشکی/قرض','ADR','#16a37a'],
 borrow:   ['قرض گرفتن از شخص','BRW','#8b5cf6'],
 repay:    ['پس دادن قرض شخص','RPY','#e5484d'],
 handover: ['تحویل پول بین افراد','HND','#0e7490'],
 dclose:   ['بستن حساب هنگر','DC','#0f8f78'],
 load:     ['بارگیری موتر (صبح)','LOD','#0369a1'],
 unload:   ['تطبیق موتر (شب)','ULD','#0f766e'],
};

let DB, META;
const num = v => { if(v===null||v===undefined) return 0; if(typeof v==='number') return isFinite(v)?v:0;
 const s=String(v).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[,،٬\s]/g,'').replace(/٫/g,'.');
 const n=parseFloat(s); return isFinite(n)?n:0; };
const r2 = n => Math.round(n*100)/100;
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,9);
const nowIso = () => new Date().toISOString();
function today(){ const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); }
function addDays(iso,n){ const d=new Date(iso+'T12:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
function daysBetween(a,b){ return Math.round((new Date(b+'T12:00:00Z')-new Date(a+'T12:00:00Z'))/864e5); }

function defaultDB(){ return {products:[],customers:[],suppliers:[],txns:[],devices:[],persons:[],orders:[],
 settings:{id:'settings',kind:'settings',biz:'ابراهیمی اکانتینگ',users:['ابراهیمی','مهدی','مهیار'],startDate:today(),updatedAt:'1970-01-01T00:00:00.000Z'}}; }
function load(){
 try{ DB=JSON.parse(localStorage.getItem(LS)); }catch(e){ DB=null; }
 if(!DB||typeof DB!=='object') DB=defaultDB();
 ['products','customers','suppliers','txns','devices','persons','orders'].forEach(k=>{ if(!Array.isArray(DB[k])) DB[k]=[]; });
 if(!DB.settings) DB.settings=defaultDB().settings;
 try{ META=JSON.parse(localStorage.getItem(LS+'_meta')); }catch(e){ META=null; }
 const L22='ABCDEFGHJKMNPRSTUVWXYZ', rl=()=>L22[Math.floor(Math.random()*22)];
 if(!META) META={device:rl()+rl(), user:DB.settings.users[0], dirty:[], lastPull:'', sync:{}};
 if(!Array.isArray(META.dirty)) META.dirty=[];
 if(!META.sync) META.sync={};
}
/* storage v2: every record is its own row in IndexedDB, so saving one bill writes one row (fast at any size);
   localStorage keeps a quick copy only while the data is small */
let _idb=null, IDBREADY=false, PMAP=new Map(), PSQ=[], PFULL=false, PTIMER=null, LSBIG=false;
function idbOpen(){ return _idb||(_idb=new Promise((res,rej)=>{ try{ const r=indexedDB.open('ibrahimi-acc',2); r.onupgradeneeded=()=>{ const d=r.result; if(!d.objectStoreNames.contains('kv')) d.createObjectStore('kv'); if(!d.objectStoreNames.contains('rec')) d.createObjectStore('rec',{keyPath:'id'}); }; r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); r.onblocked=()=>rej(new Error('blocked')); }catch(e){ rej(e); } })); }
async function idbGet(k){ const d=await idbOpen(); return new Promise((res,rej)=>{ const q=d.transaction('kv').objectStore('kv').get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); }
async function idbSet(k,v){ const d=await idbOpen(); return new Promise((res,rej)=>{ const tx=d.transaction('kv','readwrite'); tx.objectStore('kv').put(v,k); tx.oncomplete=()=>res(true); tx.onerror=()=>rej(tx.error); }); }
async function idbDel(k){ const d=await idbOpen(); return new Promise((res,rej)=>{ const tx=d.transaction('kv','readwrite'); tx.objectStore('kv').delete(k); tx.oncomplete=()=>res(true); tx.onerror=()=>rej(tx.error); }); }
async function idbAllRecs(){ const d=await idbOpen(); return new Promise((res,rej)=>{ const q=d.transaction('rec').objectStore('rec').getAll(); q.onsuccess=()=>res(q.result||[]); q.onerror=()=>rej(q.error); }); }
async function idbWriteRecs(put,del){ for(let i=0;i<put.length;i+=3000) await idbWriteChunk(put.slice(i,i+3000),[]); if(del.length) await idbWriteChunk([],del); return true; }

 function apply(t){

    if(META.dirty.includes(r.id) && local && local.updatedAt>=r.updatedAt) continue;
    if(!local || (r.updatedAt||'')>(local.updatedAt||'')){
     if(r.kind==='settings') DB.settings=r; else if(KIND[r.kind]){ if(!Array.isArray(DB[KIND[r.kind]])) DB[KIND[r.kind]]=[]; const arr=DB[KIND[r.kind]]; const ex=idxGet(KIND[r.kind],r.id), i=ex?arr.indexOf(ex):-1; if(i>=0) arr[i]=r; else arr.push(r); idxPut(KIND[r.kind],r); noSeen(r.no); noSeen(r.code); }

async function pinHash(user,pin){ const txt='ia|'+user+'|'+pin;
 try{ const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(txt)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
 catch(e){ let h=5381; for(const ch of txt) h=((h<<5)+h+ch.charCodeAt(0))|0; return 'x'+(h>>>0).toString(16); } }

function drawLock(){ const el=$('#lock'); el.classList.remove('hide'); const users=DB.settings.users||[];
 const title=LK.mode==='set'?(LK.first?'رمز را دوباره بزنید':'رمز جدید برای «'+LK.target+'»'):'رمز «'+(LK.user||'')+'» را بزنید';
 el.innerHTML=`<div class="lockbox"><div class="logo big">${I('book')}</div><div class="lbiz">${esc(DB.settings.biz||'ابراهیمی اکانتینگ')}</div>
 ${LK.mode==='unlock'?`<div class="lusers">${users.map(u=>`<button class="${u===LK.user?'on':''}" onclick="LK.user='${esc(u).replace(/'/g,'')}';LK.pin='';drawLock()"><span class="av" style="--c:${colorOf(u)}">${esc(u[0]||'؟')}</span><b>${esc(u)}</b></button>`).join('')}</div>`:''}
 <div class="ltitle">${esc(title)}</div><div class="dots ${LK.err?'shake':''}">${[0,1,2,3,4,5].map(i=>`<i class="${i<LK.pin.length?'on':''} ${i>=4?'opt':''}"></i>`).join('')}</div>
 <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="pinKey('${n}')">${fm(n)}</button>`).join('')}<button class="fn" onclick="${LK.mode==='set'?'closeLock()':"pinKey('ok')"}">${LK.mode==='set'?'لغو':I('check')}</button><button onclick="pinKey('0')">${fm(0)}</button><button class="fn" onclick="pinKey('del')">⌫</button></div>
 ${LK.mode==='set'?'<div class="hint">رمز ۴ تا ۶ رقمی بزنید</div>':'<div class="hint">رمز را فراموش کرده‌اید؟ مالک می‌تواند از تنظیمات عوض کند.</div>'}</div>`; LK.err=false; }
async function pinKey(k){
 if(k==='del'){ LK.pin=LK.pin.slice(0,-1); return drawLock(); }
 if(k!=='ok'){ if(LK.pin.length>=6) return; LK.pin+=k; }
 if(LK.mode==='unlock'){ const h=(DB.settings.pins||{})[LK.user];
  if(!h){ if(LK.pin.length>=1||k==='ok') return unlockAs(LK.user); }
  if(LK.pin.length>=4&&await pinHash(LK.user,LK.pin)===h) return unlockAs(LK.user);
  if(LK.pin.length===6||k==='ok'){ LK.pin=''; LK.err=true; if(navigator.vibrate) try{navigator.vibrate(120);}catch(e){} }
  return drawLock(); }
 // set mode
 if(k==='ok'&&LK.pin.length<4) return;
 if(LK.pin.length===6||k==='ok'||(LK.first&&LK.pin.length===LK.first.length)){
  if(!LK.first){ if(LK.pin.length<4) return drawLock(); LK.first=LK.pin; LK.pin=''; return drawLock(); }
  if(LK.pin!==LK.first){ LK.first=''; LK.pin=''; LK.err=true; toast('دو رمز یکی نبود — دوباره'); return drawLock(); }
  const pins=Object.assign({},DB.settings.pins||{}); pins[LK.target]=await pinHash(LK.target,LK.pin);
  save('settings',Object.assign({},DB.settings,{pins})); closeLock(); toast('رمز «'+LK.target+'» ذخیره شد ✓'); render(); return; }
 if(!LK.first&&LK.pin.length===4){ /* allow 4-digit pins: wait briefly for more digits */ clearTimeout(LK.t); LK.t=setTimeout(()=>{ if(LK.mode==='set'&&!LK.first&&LK.pin.length===4){ LK.first=LK.pin; LK.pin=''; drawLock(); } },900); }
 drawLock(); }

async function planRoute(fromDash,mode){ RMODE=mode||RMODE||'debt';
 if(fromDash){ go('map'); }
 toast('در حال پیدا کردن موقعیت شما…');
 try{ MYPOS=await getGPS(); }catch(e){ toast(e.message+' — مسیر از اولین دکان شروع می‌شود'); }
 const td=today(), c=C(), wd=todayW();
 let pool=DB.customers.filter(x=>!x.deleted&&x.lat);
 if(RMODE==='debt') pool=pool.filter(x=>(c.CU[x.id]||{}).bal>0.5);
 if(RMODE==='day') pool=pool.filter(x=>(x.days||[]).includes(wd));
 if(RMODE==='area') pool=pool.filter(x=>(x.area||'').split(/[،,]/)[0].trim()===RAREA);
 let cand=pool.map(x=>{ const u=c.CU[x.id]||{bal:0,oldest:0}; const due=x.promiseDate&&x.promiseDate<=td; return {x,score:(due?1e9:0)+(u.oldest>30?1e8:0)+u.bal}; }).sort((a,b)=>b.score-a.score).slice(0,RMODE==='debt'?10:23).map(o=>o.x);
 if(!cand.length){ ROUTE=null; toast(RMODE==='day'?'برای امروز ('+WDN[wd]+') دکانی تعیین نشده — در فرم دکان «روز توزیع» را بزنید':'دکانی با لوکیشن پیدا نشد'); return render(); }
 let cur=MYPOS||{lat:cand[0].lat,lng:cand[0].lng}, order=[], left=cand.slice(), km=0;
 while(left.length){ let bi=0,bd=1e9; left.forEach((x,i)=>{ const d=hav(cur.lat,cur.lng,x.lat,x.lng); if(d<bd){bd=d;bi=i;} }); const n=left.splice(bi,1)[0]; km+=bd<1e8?bd:0; order.push(n); cur={lat:n.lat,lng:n.lng}; }
 { const st=MYPOS||null, P=order.map(x=>({lat:x.lat,lng:x.lng})), dd=(a,b)=>hav(a.lat,a.lng,b.lat,b.lng), len=a=>a.reduce((s,p,i)=>s+(i?dd(a[i-1],p):(st?dd(st,p):0)),0); let best=order.slice(), imp=true, g=0;
   while(imp&&g++<40){ imp=false; for(let i=0;i<best.length-1;i++) for(let k=i+1;k<best.length;k++){ const cand2=best.slice(0,i).concat(best.slice(i,k+1).reverse(),best.slice(k+1)); if(len(cand2)<len(best)-0.001){ best=cand2; imp=true; } } }
   order=best; km=len(order); }
 ROUTE={ids:order.map(x=>x.id),km,from:MYPOS?{lat:MYPOS.lat,lng:MYPOS.lng}:null,mode:RMODE,area:RAREA};

function hav(a,b,c,d){ const R=6371,t=x=>x*Math.PI/180, dl=t(c-a), dn=t(d-b); const h=Math.sin(dl/2)**2+Math.cos(t(a))*Math.cos(t(c))*Math.sin(dn/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }

 ${a.length?`<div class="cart">${a.map((o,i)=>`<div class="cl shl"><label class="ck"><input type="checkbox" checked onchange="F.list[${i}].on=this.checked;shopTot()"></label><div class="cn"><b>${esc(o.p.name)}</b><div class="mu">موجود ${fm(o.q)}، حد اقل ${fm(o.p.minQty||0)} ${esc(o.p.unit||'')}</div></div><div class="stp"><button type="button" onclick="F.list[${i}].qty++;this.nextElementSibling.value=F.list[${i}].qty;shopTot()">+</button><input inputmode="decimal" value="${o.sug}" oninput="F.list[${i}].qty=num(this.value);shopTot()"><button type="button" onclick="F.list[${i}].qty=Math.max(0,F.list[${i}].qty-1);this.previousElementSibling.value=F.list[${i}].qty;shopTot()">−</button></div>${can('cost')?`<div class="ct">${fm(o.price)}</div>`:''}</div>`).join('')}</div>`:'<div class="empty">همه اجناس کافی است 👌</div>'}
 ${a.length?`<div class="row" style="margin-top:14px"><a class="btn" style="--c:#25b05a" id="shopWa" target="_blank" rel="noopener" href="#">${I('wa')} ارسال لیست در واتس‌اپ</a><button class="btn alt" onclick="navigator.clipboard.writeText(shopText()).then(()=>toast('کاپی شد'))">کاپی</button><button class="btn bl" onclick="shopToPurchase()">${I('cart')} تبدیل به بل خرید</button></div><div class="sum" id="shopSum" style="margin-top:14px"></div><div id="shopBy" style="margin-top:14px"></div>`:''}`);
 shopTot(); }
function shopText(){ return `لیست خرید — ${DB.settings.biz||'ابراهیمی'} — ${fd(today())}\n`+F.list.filter(i=>i.on&&i.qty>0).map((i,k)=>`${fm(k+1)}. ${pname(i.pid)}: ${fm(i.qty)} ${(prod(i.pid)||{}).unit||''}`).join('\n'); }
function shopTot(){ const t=F.list.filter(i=>i.on).reduce((s,i)=>s+i.qty*i.price,0); const el=$('#shopSum'); if(el) el.innerHTML=can('cost')?`<div class="big"><span>هزینهٔ تقریبی (به آخرین قیمت خرید)</span><b>${money(t)}</b></div>`:''; const w=$('#shopWa'); if(w) w.href='https://wa.me/?text='+encodeURIComponent(shopText()); drawShopBy(); }
function shopGroups(){ const g={}; F.list.filter(i=>i.on&&i.qty>0).forEach(i=>{ const sp=supplierPrices(i.pid)[0]; const k=sp?sp[0]:''; (g[k]=g[k]||[]).push(Object.assign({},i,{sp:sp?sp[1].last:i.price})); }); return g; }
function drawShopBy(){ const el=$('#shopBy'); if(!el) return; const g=shopGroups(), ks=Object.keys(g); if(ks.length<2&&!ks[0]){ el.innerHTML=''; return; }
 el.innerHTML=`<h3 style="font-size:15px">${I('truck')} به تفکیک ارزان‌ترین عمده‌فروش</h3>`+ks.map(k=>{ const s=supp(k), l=g[k], txt=`سلام${s&&s.owner?' '+s.owner:''}، ${DB.settings.biz||'ابراهیمی'} هستیم. این اجناس را لازم داریم:\n`+l.map((i,n)=>`${fm(n+1)}. ${pname(i.pid)}: ${fm(i.qty)} ${(prod(i.pid)||{}).unit||''}`).join('\n')+`\nلطفاً قیمت و موجودی را خبر دهید.`;
  return `<div class="card" style="padding:12px;margin-bottom:10px"><div class="row" style="justify-content:space-between"><b>${s?esc(s.name):'عمده‌فروش نامعلوم'}</b>${can('cost')?`<span class="mu">${money(l.reduce((t,i)=>t+i.qty*i.sp,0))}</span>`:''}</div><div class="mu" style="font-size:12.5px;margin:4px 0 8px">${l.map(i=>esc(pname(i.pid))+' '+fm(i.qty)).join('، ')}</div><div class="row">${s?`<a class="btn sm" style="--c:#25b05a" target="_blank" rel="noopener" href="${waLink(s.phone,txt)}">${I('wa')} سفارش</a><button class="btn sm bl" onclick="shopToPurchaseS('${k}')">${I('cart')} بل خرید</button>`:''}</div></div>`; }).join(''); }
function shopToPurchaseS(sid){ const l=shopGroups()[sid]||[]; purchaseForm(sid); F.cart=l.map(i=>({pid:i.pid,qty:i.qty,price:i.sp})); drawCart(); drawGrid(); calcForm(); }
function shopToPurchase(){ const l=F.list.filter(i=>i.on&&i.qty>0); purchaseForm(); F.cart=l.map(i=>({pid:i.pid,qty:i.qty,price:i.price})); drawCart(); drawGrid(); calcForm(); }

 sec('in','موجودی اول دوره (فقط بار اول)',`<div class="f2">${fl('تعداد موجود در روز شروع',inp('openQty',p.openQty||'','inputmode="decimal" placeholder="۰"'))}${fl('قیمت خرید فی واحد',inp('openCost',p.openCost||'','inputmode="decimal" placeholder="۰"'))}</div><div class="hint">خریدهای بعدی را با «خرید عمده» ثبت کنید، نه اینجا.</div>`)+entBar('saveProduct()',del)); drawPhotoBox(); }

 const owe=a.reduce((s,x)=>s+Math.max(0,(c.SU[x.id]||{bal:0}).bal),0), d30=addDays(today(),-29), buy30=DB.txns.filter(t=>!t.void&&t.type==='purchase'&&t.date>=d30).reduce((s,t)=>s+txnTotal(t),0);
 return `<div class="grid k3">${kpi('out','#e5484d','مجموع قرض ما',money(owe),fm(a.filter(x=>(c.SU[x.id]||{}).bal>0.5).length)+' طلبکار','neg')}${kpi('cart','#3b6fd8','خرید ۳۰ روز',money(buy30),'')}${kpi('truck','#13a389','عمده‌فروش‌ها',fm(a.length),'')}</div>

function suppRows(sid){ const s=supp(sid);
 const tx=txOf(sid).filter(t=>true).sort((a,b)=>(a.date+a.createdAt).localeCompare(b.date+b.createdAt)); let bal=num(s.openBal);
 const rows=[]; if(bal) rows.push({d:DB.settings.startDate,desc:'قرض اول دوره',no:'',dr:0,cr:bal,bal});
 for(const t of tx){ const tot=txnTotal(t);
  if(t.type==='purchase'){ const owed=tot-num(t.extra); bal+=owed; rows.push({id:t.id,d:t.date,desc:'خرید جنس ('+(t.items||[]).map(i=>pname(i.pid)).slice(0,3).join('، ')+')',no:t.no,dr:0,cr:owed,bal}); if(num(t.paid)){ bal-=num(t.paid); rows.push({id:t.id,d:t.date,desc:'پرداخت هنگام خرید',no:t.no,dr:num(t.paid),cr:0,bal}); } }
  if(t.type==='payment'){ const a=num(t.amount)+num(t.discount); bal-=a; rows.push({id:t.id,d:t.date,desc:'پرداخت پول'+(num(t.discount)?' (تخفیف '+fm(t.discount)+')':''),no:t.no,dr:a,cr:0,bal}); }
  if(t.type==='preturn'){ bal-=tot; rows.push({id:t.id,d:t.date,desc:'مرجوعی جنس',no:t.no,dr:tot,cr:0,bal}); if(num(t.paid)){ bal+=num(t.paid); rows.push({id:t.id,d:t.date,desc:'دریافت پول مرجوعی',no:t.no,dr:0,cr:num(t.paid),bal}); } } }
 return rows; }

 <div class="slist only-m">${rows.slice().reverse().map(r=>`<div class="sr" ${r.id?`onclick="showTxn('${r.id}')"`:''}><div class="m"><b>${esc(r.desc)}</b><div class="mu">${fd(r.d)}${r.no?'، '+esc(r.no):''}</div></div><div class="a"><b class="${r.dr?'pos':''}">${r.dr?'−'+fm(r.dr):'+'+fm(r.cr)}</b><div class="mu">مانده ${fm(r.bal)}</div></div></div>`).join('')||'<div class="empty">معامله‌ای نیست</div>'}</div>
 <div class="tw only-d"><table class="tbl"><tr><th>تاریخ</th><th>شرح</th><th>نمبر</th><th class="n">پرداخت</th><th class="n">خرید</th><th class="n">مانده قرض</th></tr>${rows.slice().reverse().map(r=>`<tr class="${r.id?'click':''}" ${r.id?`onclick="showTxn('${r.id}')"`:''}><td>${fd(r.d)}</td><td>${esc(r.desc)}</td><td class="mu">${esc(r.no)}</td><td class="n pos">${r.dr?fm(r.dr):''}</td><td class="n">${r.cr?fm(r.cr):''}</td><td class="n"><b>${fm(r.bal)}</b></td></tr>`).join('')||'<tr><td colspan="6" class="empty">معامله‌ای نیست</td></tr>'}</table></div></div>`; }

  <button type="button" class="x" onclick="F.cart.splice(${i},1);drawCart();drawGrid();calcForm()">✕</button></div>`; }).join('')||`<div class="hint" style="text-align:center;padding:6px">روی جنس بزنید تا به ${F.type==='adjust'?'لیست':'بل'} اضافه شود</div>`;

 ${sec('cash','پول را بشمارید',`<div class="hint" style="margin:-4px 0 10px">تعداد هر نوت را بنویسید، یا پایین فقط مجموع را بزنید.</div><div class="notes">${NOTES.map(n=>`<label><span>${fm(n)}</span><input inputmode="numeric" placeholder="۰" oninput="F.notes[${n}]=num(this.value);noteSum()"></label>`).join('')}</div>

 el.className='cdiff '+(fv('counted')===''?'':Math.abs(d)<1?'ok':d<0?'bad':'more');

 const list=k==='c'?DB.customers:k==='p'?DB.products:DB.suppliers, names=new Set(list.filter(x=>!x.deleted).map(x=>x.name.trim())), seen=new Set();

/* ---------- 14-day cash forecast ---------- */
let FCD=14;
function pDay(d){ try{ return parseInt(new Intl.DateTimeFormat('en-u-ca-persian',{day:'numeric'}).format(new Date(d+'T12:00:00')),10); }catch(e){ return +d.slice(8); } }
function repForecast(){ const td=today(), N=FCD, c=C(), start=balOf('1010')+balOf('1020');
 const past=lastDays(30);
 const avgIn=past.reduce((s,t)=>s+(t.type==='receipt'?num(t.amount):t.type==='sale'?num(t.paid):0),0)/30;
 const avgVar=past.filter(t=>t.type==='expense'&&!t.fixed).reduce((s,t)=>s+num(t.amount),0)/30;
 const days=[]; for(let i=1;i<=N;i++) days.push({d:addDays(td,i),ins:[],outs:[]});
 const at=d=>days.find(x=>x.d===d)||(d<=days[0].d?days[0]:null);
 DB.customers.forEach(x=>{ if(x.deleted||!x.promiseDate) return; const b=(c.CU[x.id]||{bal:0}).bal; if(b<=0.5) return; const day=at(x.promiseDate<td?addDays(td,1):x.promiseDate); if(day) day.ins.push({l:'قول '+x.name,v:Math.min(b,num(x.promiseAmt)||b)}); });
 DB.suppliers.forEach(x=>{ if(x.deleted) return; const b=(c.SU[x.id]||{bal:0}).bal, d=suppDue(x.id); if(b<=0.5||!d) return; const day=at(d<td?addDays(td,1):d); if(day) day.outs.push({l:'وعدهٔ '+x.name,v:b}); });
 const paidThis=id=>DB.txns.some(t=>!t.void&&t.type==='expense'&&t.fixed===id&&t.date>=monthStart());
 const nextM=addDays(monthStart(),monthLen()); days.forEach(o=>{ const pd=pDay(o.d); FX().forEach(f=>{ if(num(f.day||1)===pd&&!(o.d<nextM&&paidThis(f.id))) o.outs.push({l:f.note||ACC[f.acc].name,v:num(f.amount)}); }); });
 let bal=start, low=start, lowD=null; const rows=days.map(o=>{ const i=o.ins.reduce((s,x)=>s+x.v,0)+avgIn, out=o.outs.reduce((s,x)=>s+x.v,0)+avgVar; bal+=i-out; if(bal<low){ low=bal; lowD=o.d; } return Object.assign(o,{i,out,bal}); });
 return `<div class="row noprint" style="margin-bottom:14px"><div class="tabs" style="margin:0">${[7,14,30].map(n=>`<button class="${FCD===n?'on':''}" onclick="FCD=${n};render()">${fm(n)} روز</button>`).join('')}</div></div>
 <div class="grid k3" style="margin-bottom:18px">${kpi('wallet','#13a389','پول امروز (صندوق + بانک)',money(start),'')}${kpi('trend',bal>=start?'#16a37a':'#e5484d','تخمین بعد از '+fm(N)+' روز',money(bal),(bal>=start?'▲ ':'▼ ')+money(Math.abs(bal-start)),bal>=start?'pos':'neg')}${kpi('alert',low<0?'#e5484d':'#f08c2e','کمترین موجودی',money(low),lowD?fd(lowD):'—',low<0?'neg':'')}</div>
 ${low<0?`<div class="card banner" style="margin-bottom:18px"><div class="ic" style="--c:#e5484d">${I('alert')}</div><div style="flex:1"><b>در ${fd(lowD)} پول کم می‌آید</b><div class="mu">وصول طلب‌ها را جلو بیندازید یا وعدهٔ پرداخت به عمده‌فروش را عقب بیندازید.</div></div></div>`:''}
 ${barChart(rows.map(r=>fm(pDay(r.d))),[{name:'موجودی تخمینی',color:'#13a389',values:rows.map(r=>Math.round(r.bal))}],200)}

 <div class="hint" style="margin-top:10px">این تخمین است: قول‌های دکان‌ها، وعده‌های پرداخت به عمده‌فروش‌ها و مصارف ثابت ماهانه، به‌اضافهٔ میانگین روزانهٔ ۳۰ روز گذشته (وصول ${kfmt(avgIn)} و مصارف متغیر ${kfmt(avgVar)} در روز). خرید تازه از مندوی در آن حساب نشده.</div>`; }

/* ---------- truck load (morning) & reconciliation (night) ---------- */
function loadsOn(d){ return DB.txns.filter(t=>!t.void&&t.type==='load'&&t.date===d); }
function loadForm(){ const ps=DB.products.filter(p=>!p.deleted).sort((a,b)=>(a.cat||'').localeCompare(b.cat||'','fa')||a.name.localeCompare(b.name,'fa')), c=C(), us=DB.settings.users||[];
 const ord={}; openOrders().forEach(o=>(o.items||[]).forEach(i=>ord[i.pid]=(ord[i.pid]||0)+num(i.qty)));
 F={type:'load',q:{}}; Object.entries(ord).forEach(([k,v])=>F.q[k]=v);
 openModal('بارگیری موتر — صبح',`<div class="hint" style="margin-bottom:12px">چه مقدار از هر جنس بار موتر شد؟ شب با «تطبیق موتر» حساب می‌شود چه فروخته شد و چه باید برگردد. ${Object.keys(ord).length?'مقدار فرمایش‌های تحویل‌نشده از قبل نوشته شده.':''}</div>
 ${fl('راننده / فروشنده',`<select class="in" id="f_driver">${us.map(u=>`<option ${u===META.user?'selected':''}>${esc(u)}</option>`).join('')}</select>`)}
 <div class="list">${ps.map(p=>`<div class="it" style="cursor:default"><div class="m"><div class="t">${esc(p.name)}</div><div class="d">در گدام ${qtyTxt(p,(c.P[p.id]||{qty:0}).qty)}${ord[p.id]?'، فرمایش '+fm(ord[p.id]):''}</div></div><input class="in" style="width:90px;text-align:center" inputmode="decimal" placeholder="۰" value="${F.q[p.id]||''}" oninput="F.q['${p.id}']=num(this.value)" onfocus="this.select()"></div>`).join('')}</div>
 <div class="stick"><button class="btn" onclick="saveLoad()">${I('truck')} ثبت بارگیری</button></div>`); }
function saveLoad(){ const items=Object.entries(F.q).filter(([k,v])=>num(v)>0).map(([pid,qty])=>({pid,qty:num(qty),price:0})); if(!items.length) return toast('حد اقل یک جنس بنویسید');
 const r=save('txn',{type:'load',date:today(),method:'cash',driver:fv('driver'),items,no:nextNo('LOD')}); closeModal(); snack('✓ بارگیری ثبت شد — '+fm(items.length)+' قلم',()=>undoTxn(r.id)); render(); }
function unloadCalc(d,driver,onlyDriver){ const L={}; loadsOn(d).filter(t=>!driver||t.driver===driver).forEach(t=>t.items.forEach(i=>L[i.pid]=(L[i.pid]||0)+num(i.qty)));
 const S={}; DB.txns.filter(t=>!t.void&&t.date===d&&(t.type==='sale'||t.type==='sreturn')&&(!onlyDriver||t.by===driver)).forEach(t=>(t.items||[]).forEach(i=>{ if(L[i.pid]!==undefined) S[i.pid]=(S[i.pid]||0)+(t.type==='sale'?1:-1)*num(i.qty); }));
 return Object.keys(L).map(pid=>({pid,loaded:L[pid],sold:S[pid]||0,exp:L[pid]-(S[pid]||0)})); }
function unloadForm(){ const d=today(), ls=loadsOn(d); if(!ls.length) return toast('امروز بارگیری موتر ثبت نشده — صبح «بارگیری موتر» را بزنید');
 const drivers=[...new Set(ls.map(t=>t.driver).filter(Boolean))]; F={type:'unload',driver:drivers.length===1?drivers[0]:'',only:false,act:{}}; drawUnload(); }
function drawUnload(){ const rows=unloadCalc(today(),F.driver,F.only); F.rows=rows; const drivers=[...new Set(loadsOn(today()).map(t=>t.driver).filter(Boolean))];
 openModal('تطبیق موتر — شب',`<div class="hint" style="margin-bottom:12px">بار صبح منهای فروش امروز = آنچه باید در موتر مانده باشد. باقی‌مانده را بشمارید و بنویسید.</div>
 ${drivers.length>1?fl('موتر / راننده',`<select class="in" onchange="F.driver=this.value;drawUnload()"><option value="">همه</option>${drivers.map(u=>`<option ${F.driver===u?'selected':''}>${esc(u)}</option>`).join('')}</select>`):''}
 ${F.driver?`<label class="row" style="gap:8px;margin-bottom:10px;font-size:13px"><input type="checkbox" ${F.only?'checked':''} onchange="F.only=this.checked;drawUnload()"> فقط فروش‌هایی که ${esc(F.driver)} ثبت کرده</label>`:''}
 <div class="list">${rows.map((r,i)=>`<div class="it" style="cursor:default"><div class="m"><div class="t">${esc(pname(r.pid))}</div><div class="d">بار ${fm(r.loaded)} − فروش ${fm(r.sold)} = باید بماند <b>${fm(r.exp)}</b></div></div><input class="in" style="width:86px;text-align:center" inputmode="decimal" placeholder="${fm(r.exp)}" value="${F.act[r.pid]??''}" oninput="F.act['${r.pid}']=this.value===''?undefined:num(this.value);unloadSum()" onfocus="this.select()"></div>`).join('')}</div>
 <div class="sum" id="usum" style="margin-top:12px"></div>
 <div class="stick"><button class="btn alt" onclick="F.rows.forEach(r=>F.act[r.pid]=r.exp);drawUnload()">همه درست است</button><button class="btn" onclick="saveUnload()">${I('check')} ثبت تطبیق</button></div>`); unloadSum(); }
function unloadSum(){ let sv=0, n=0; F.rows.forEach(r=>{ const a=F.act[r.pid]; if(a===undefined) return; const d=a-r.exp; if(Math.abs(d)>0.001){ n++; sv+=d*num((prod(r.pid)||{}).price); } }); const el=$('#usum'); if(!el) return;
 const filled=F.rows.filter(r=>F.act[r.pid]!==undefined).length; if(!filled){ el.innerHTML='<div class="mu" style="text-align:center">باقی‌ماندهٔ موتر را بشمارید و بنویسید</div>'; return; }
 el.innerHTML=n?`<div class="big"><span>${sv<0?'کسری':'اضافه'} (${fm(n)} قلم، به قیمت فروش)</span><b class="${sv<0?'neg':'pos'}">${money(Math.abs(sv))}</b></div><div class="mu" style="font-size:12px">کسری یعنی جنسی فروخته شده و بل نشده، یا گم شده.</div>`:`<div class="big"><span>اختلاف</span><b class="pos">ندارد ✓</b></div>`; }
function saveUnload(){ if(F.rows.some(r=>F.act[r.pid]===undefined)) return toast('برای همه اجناس «شمرده شد» را بنویسید (یا «همه درست است»)');
 const items=F.rows.map(r=>({pid:r.pid,loaded:r.loaded,sold:r.sold,exp:r.exp,act:F.act[r.pid],qty:F.act[r.pid]-r.exp,price:num((prod(r.pid)||{}).price)})), sv=items.reduce((s,i)=>s+i.qty*i.price,0);
 const r=save('txn',{type:'unload',date:today(),method:'cash',driver:F.driver,only:F.only,lines:items,shortVal:-sv,no:nextNo('ULD')}); closeModal();
 const sh=items.filter(i=>i.qty<-0.001); if(sh.length&&can('edit')) openModal('کسری موتر',`<p>${fm(sh.length)} قلم کم است: ${sh.map(i=>esc(pname(i.pid))+' '+fm(-i.qty)).join('، ')}.</p><p class="hint">اگر واقعاً گم شده یا خراب است، آن را از موجودی گدام کم کنید (به حساب «کسری و ضایعات»). اگر فروخته شده و بل نشده، به‌جای این، بل فروش آن را ثبت کنید.</p><div class="row"><button class="btn red" onclick="shortToAdjust('${r.id}')">کم کردن از گدام</button><button class="btn alt" onclick="closeModal()">بعداً</button></div>`);
 else toast(sv?'✓ تطبیق ثبت شد':'✓ موتر تطبیق شد — اختلاف ندارد'); render(); }
function shortToAdjust(id){ const u=DB.txns.find(t=>t.id===id); const items=u.lines.filter(i=>i.qty<-0.001).map(i=>({pid:i.pid,qty:i.qty,price:0})); save('txn',{type:'adjust',date:today(),method:'cash',items,note:'کسری موتر '+(u.driver||'')+' — '+u.no,no:nextNo('ADJ')}); closeModal(); toast('از گدام کم شد ✓'); render(); }
function truckCard(){ const d=today(), ls=loadsOn(d); if(!ls.length) return ''; const done=DB.txns.some(t=>!t.void&&t.type==='unload'&&t.date===d); if(done) return '';
 const rows=unloadCalc(d,'',false), L=rows.reduce((s,r)=>s+r.loaded,0), S=rows.reduce((s,r)=>s+r.sold,0);
 return `<div class="card" style="margin-bottom:18px"><h3>${I('truck')} موتر امروز<span class="sp"></span><button class="btn sm" onclick="unloadForm()">${I('check')} تطبیق شب</button></h3><div class="row" style="gap:18px"><span>بار صبح <b>${fm(L)}</b></span><span>فروخته <b class="pos">${fm(S)}</b></span><span>باید بماند <b>${fm(L-S)}</b></span></div><div class="hb2" style="margin-top:10px"><i style="width:${L?Math.min(100,S/L*100):0}%"></i></div></div>`; }

/* ---------- duplicate shops & merge ---------- */
const normName=s=>String(s||'').replace(/[\s\u200c\-_.،,]/g,'').replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/^(دکان|سوپرمارکت|فروشگاه|مارکیت)/,'').toLowerCase();
const normPhone=s=>{ let p=String(s||'').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/\D/g,''); if(p.startsWith('93')) p='0'+p.slice(2); return p.length>=9?p.slice(-9):''; };
function dupGroups(){ const cs=DB.customers.filter(x=>!x.deleted&&!x.walkin), ign=new Set(DB.settings.notDup||[]), groups=[], done=new Set();
 const add=(m,k,x)=>{ if(k) (m[k]=m[k]||[]).push(x); }, byP={}, byN={}; cs.forEach(x=>{ add(byP,normPhone(x.phone),x); const n=normName(x.name); add(byN,n.length>2?n:'',x); });
 const scan=(m,why)=>Object.values(m).forEach(a=>{ for(let i=0;i<a.length;i++) for(let j=i+1;j<a.length;j++){ const k=[a[i].id,a[j].id].sort().join('|'); if(ign.has(k)||done.has(k)) continue; done.add(k); groups.push([a[i],a[j],why]); } });
 scan(byP,'شمارهٔ یکسان'); scan(byN,'نام یکسان'); return groups.slice(0,30); }
function dupList(){ const g=dupGroups(), CU=C().CU; openModal('دکان‌های شاید تکراری',`<div class="hint" style="margin-bottom:12px">اگر واقعاً یک دکان است، «یکی کن» را بزنید: همهٔ بل‌ها و پول‌های دکان دوم به دکان اول منتقل می‌شود و دکان دوم حذف می‌شود. اگر دو دکان جدا هستند «جدا هستند» را بزنید.</div>
 <div class="list">${g.map(([a,b,why])=>`<div class="card" style="padding:12px;margin-bottom:10px"><div class="mu" style="font-size:12px;margin-bottom:6px">${why}</div>${[a,b].map(x=>`<div class="row" style="justify-content:space-between;margin-bottom:4px"><b>${esc(x.name)}</b><span class="mu">${esc([x.owner,x.phone,x.area].filter(Boolean).join('، '))} — ${fm((CU[x.id]||{cnt:0}).cnt||0)} معامله، بدهی ${kfmt((CU[x.id]||{bal:0}).bal)}</span></div>`).join('')}<div class="row" style="margin-top:8px"><button class="btn sm" onclick="confirmBtn(this,()=>doMerge('${b.id}','${a.id}',true))">یکی کن (نگه داشتن «${esc(a.name)}»)</button><button class="btn sm alt" onclick="notDup('${a.id}','${b.id}')">جدا هستند</button></div></div>`).join('')||'<div class="empty">موردی نیست</div>'}</div>`); }
function notDup(a,b){ const k=[a,b].sort().join('|'); save('settings',Object.assign({},DB.settings,{notDup:[...(DB.settings.notDup||[]),k]})); dupGroups().length?dupList():(closeModal(),render()); }
function mergeForm(id){ const x=cust(id); openModal('یکی کردن «'+x.name+'» با…',`<div class="hint" style="margin-bottom:12px">دکانی را انتخاب کنید که «${esc(x.name)}» با آن یکی شود. همهٔ معامله‌ها به آن دکان می‌رود و «${esc(x.name)}» حذف می‌شود.</div><div class="sbox">${I('search')}<input id="mq" placeholder="جستجوی دکان…" oninput="drawMerge('${id}')"></div><div class="list" id="ml"></div>`); drawMerge(id); }
function drawMerge(id){ const q=(fv('mq')||'').trim().toLowerCase(); $('#ml').innerHTML=DB.customers.filter(x=>!x.deleted&&x.id!==id&&!x.walkin&&(!q||[x.name,x.owner,x.phone,x.area].join(' ').toLowerCase().includes(q))).slice(0,30).map(x=>`<div class="it" onclick="confirmBtn(this,()=>doMerge('${id}','${x.id}'))"><div class="m"><div class="t">${esc(x.name)}</div><div class="d">${esc([x.owner,x.phone,x.area].filter(Boolean).join('، '))}</div></div></div>`).join(''); }
function doMerge(from,to,fromList){ if(!can('delete')) return toast('فقط مالک'); const a=cust(from), b=cust(to); if(!a||!b) return; let n=0; batch(()=>{
 DB.txns.filter(t=>t.party===from).forEach(t=>{ save('txn',Object.assign({},t,{party:to,mergedFrom:from})); n++; });
 (DB.orders||[]).filter(o=>o.party===from).forEach(o=>save('order',Object.assign({},o,{party:to})));
 const keep={}; ['owner','phone','area','lat','lng','photo','note'].forEach(k=>{ if(!b[k]&&a[k]) keep[k]=a[k]; });
 save('customer',Object.assign({},b,keep,{openBal:num(b.openBal)+num(a.openBal),visits:[...(b.visits||[]),...(a.visits||[])].slice(-30)}));
 save('customer',Object.assign({},a,{deleted:true,mergedInto:to})); });
 toast('✓ یکی شد — '+fm(n)+' معامله منتقل شد'); if(fromList&&dupGroups().length) dupList(); else { closeModal(); go('customer',to); } }

/* ---------- slow / dead stock ---------- */
let DSD=30;
function deadStock(days){ const lim=addDays(today(),-days), last={}, c=C(); DB.txns.forEach(t=>{ if(!t.void&&t.type==='sale') (t.items||[]).forEach(i=>{ if(!last[i.pid]||t.date>last[i.pid]) last[i.pid]=t.date; }); });
 return DB.products.filter(p=>!p.deleted&&(c.P[p.id]||{qty:0}).qty>0&&(!last[p.id]||last[p.id]<lim)&&(p.createdAt||'').slice(0,10)<lim).map(p=>{ const st=c.P[p.id]; return {p,q:st.qty,v:st.qty*st.avg,last:last[p.id]||null}; }).sort((a,b)=>b.v-a.v); }
function deadStockCard(){ if(!can('cost')) return ''; const a=deadStock(DSD), tv=a.reduce((s,x)=>s+x.v,0), inv=Math.max(1,balOf('1200'));
 return `<div class="card" style="margin-bottom:18px"><h3>${I('box')} اجناس راکد (بی‌فروش)</h3><div class="tabs" style="margin-top:-6px">${[30,60,90].map(n=>`<button class="${DSD===n?'on':''}" onclick="DSD=${n};render()">${fm(n)} روز</button>`).join('')}</div>
 ${a.length?`<div class="row" style="gap:16px;margin-bottom:10px"><span>${fm(a.length)} جنس</span><span>ارزش <b class="warn">${money(tv)}</b></span><span class="mu">${fm(Math.round(tv/inv*100))}٪ کل گدام</span></div><div class="slist">${a.slice(0,10).map(x=>`<div class="sr" onclick="go('product','${x.p.id}')"><div class="m"><b>${esc(x.p.name)}</b><div class="mu">موجود ${qtyTxt(x.p,x.q)} — ${x.last?'آخرین فروش '+fd(x.last)+' ('+fm(daysBetween(x.last,today()))+' روز)':'هیچ فروشی ثبت نشده'}</div></div><b>${money(x.v)}</b></div>`).join('')}</div><div class="hint" style="margin-top:8px">پیشنهاد: این اجناس را با تخفیف کم بفروشید یا به عمده‌فروش برگردانید، و تا فروش نرفته دوباره نخرید.</div>`:`<div class="empty">در ${fm(DSD)} روز گذشته همهٔ اجناس فروش داشته‌اند ✓</div>`}</div>`; }

/* ---------- purchase price went up → suggest new sale prices ---------- */
function priceRiseCheck(old){ const c=C(), rnd=v=>v>=1000?Math.round(v/50)*50:v>=100?Math.round(v/10)*10:Math.round(v);
 const a=Object.entries(old).map(([pid,o])=>{ const p=prod(pid), nw=(c.P[pid]||{}).lastBuy||0; if(!p||!o||!nw||nw<=o*1.005||!num(p.price)) return null; const sug=rnd(num(p.price)*nw/o); return sug>num(p.price)?{p,o,nw,sug}:null; }).filter(Boolean);
 if(!a.length) return; F={type:'rise',list:a.map(x=>({pid:x.p.id,price:x.sug,on:true}))};
 openModal('قیمت خرید بالا رفت',`<div class="hint" style="margin-bottom:12px">برای اینکه سود شما کم نشود، قیمت فروش این اجناس را به همان نسبت بالا ببرید. قیمت پیشنهادی قابل تغییر است.</div>
 <div class="list">${a.map((x,i)=>`<div class="it" style="cursor:default"><label class="ck"><input type="checkbox" checked onchange="F.list[${i}].on=this.checked"></label><div class="m"><div class="t">${esc(x.p.name)}</div><div class="d" style="white-space:normal">خرید ${fm(Math.round(x.o))} ← <b class="neg">${fm(Math.round(x.nw))}</b> (${fm(Math.round((x.nw/x.o-1)*100))}٪+)<br>فروش فعلی ${fm(num(x.p.price))}</div></div><input class="in" style="width:96px;text-align:center" inputmode="decimal" value="${x.sug}" oninput="F.list[${i}].price=num(this.value)"></div>`).join('')}</div>
 <div class="stick"><button class="btn alt" onclick="closeModal()">نه، همان بماند</button><button class="btn" onclick="applyRise()">${I('check')} تغییر قیمت فروش</button></div>`); }
function applyRise(){ const l=F.list.filter(x=>x.on&&x.price>0); batch(()=>l.forEach(x=>save('product',Object.assign({},prod(x.pid),{price:x.price})))); closeModal(); toast('✓ قیمت '+fm(l.length)+' جنس تغییر کرد'); render(); }

function myGoalCard(){ const g=(DB.settings.goalsU||{})[META.user]; if(!g) return ''; const ms=monthStart(), v=DB.txns.filter(t=>!t.void&&t.type==='sale'&&t.by===META.user&&t.date>=ms).reduce((s,t)=>s+txnTotal(t),0)-DB.txns.filter(t=>!t.void&&t.type==='sreturn'&&t.by===META.user&&t.date>=ms).reduce((s,t)=>s+txnTotal(t),0);
 const pct=Math.min(100,v/g*100), left=Math.max(0,monthLen()-daysBetween(ms,today())-1);
 return `<div class="card" style="margin-bottom:18px"><h3>${I('trend')} هدف فروش این ماه شما</h3><div class="row" style="justify-content:space-between"><b style="font-size:20px">${money(v)}</b><span class="mu">از ${money(g)}</span></div><div class="hb2" style="margin:10px 0 6px"><i style="width:${pct}%"></i></div><div class="mu" style="font-size:12.5px">${v>=g?'🎉 به هدف رسیدید!':fm(Math.round(pct))+'٪ — باقی '+money(g-v)+(left?'، روزی حدود '+money((g-v)/left)+' در '+fm(left)+' روز باقی‌مانده':'')}</div></div>`; }

/* ---------- end-of-day checklist (owner, evenings) ---------- */
function nightCard(force){ if(!can('settings')) return ''; const h=new Date().getHours(); if(!force&&h<17) return ''; const d=today(), tx=DB.txns.filter(t=>!t.void&&t.date===d);
 if(!force&&!tx.length) return '';
 const loads=loadsOn(d).length, unl=tx.some(t=>t.type==='unload'), cc=tx.some(t=>t.type==='cashcount'), un=unapproved().filter(t=>t.date===d).length;
 const others=[...new Set(tx.map(t=>t.by).filter(u=>u&&u!==META.user))], hand=new Set(tx.filter(t=>t.type==='handover').map(t=>t.from));
 const syncOk=!META.sync||!META.sync.url||!META.dirty.length, bk=META.sync&&META.sync.url?true:(META.lastBackup&&daysBetween(META.lastBackup.slice(0,10),d)<7);

/* ---------- shops whose buying dropped or grew ---------- */
let STD=30;
function repShopTrend(){ const td=today(), a1=addDays(td,-STD+1), a0=addDays(td,-2*STD+1), b0=addDays(a1,-1), m={};
 DB.txns.forEach(t=>{ if(t.void||(t.type!=='sale'&&t.type!=='sreturn')||t.date<a0) return; const o=m[t.party]||(m[t.party]={now:0,prev:0}); const v=(t.type==='sale'?1:-1)*txnTotal(t); if(t.date>=a1) o.now+=v; else if(t.date<=b0) o.prev+=v; });
 const a=Object.entries(m).filter(([id])=>{ const x=cust(id); return x&&!x.deleted&&!x.walkin; }).map(([id,o])=>({x:cust(id),...o,d:o.now-o.prev,pc:o.prev?((o.now-o.prev)/o.prev*100):null}));
 const down=a.filter(o=>o.prev>0&&o.d<0).sort((p,q)=>p.d-q.d).slice(0,15), up=a.filter(o=>o.d>0).sort((p,q)=>q.d-p.d).slice(0,10);
 const row=o=>`<div class="sr" onclick="go('customer','${o.x.id}')"><div class="m"><b>${esc(o.x.name)}</b><div class="mu">${esc(o.x.area||'')} — قبلاً ${kfmt(o.prev)}، حالا ${kfmt(o.now)}</div></div><b class="${o.d<0?'neg':'pos'}">${o.d<0?'▼':'▲'} ${o.pc===null?'تازه':fm(Math.abs(Math.round(o.pc)))+'٪'}</b></div>`;
 const T0=a.reduce((s,o)=>s+o.prev,0), T1=a.reduce((s,o)=>s+o.now,0);
 return `<div class="tabs">${[30,60,90].map(n=>`<button class="${STD===n?'on':''}" onclick="STD=${n};render()">${fm(n)} روز</button>`).join('')}</div><div class="mu" style="font-size:12.5px;margin:-6px 0 12px">مقایسهٔ ${fm(STD)} روز اخیر با ${fm(STD)} روز پیش از آن</div>
 <div class="grid k3" style="margin-bottom:18px">${kpi('receipt','#13a389','فروش این دوره',money(T1),'')}${kpi('clock','#7d8796','فروش دورهٔ قبل',money(T0),'')}${kpi('trend',T1>=T0?'#16a37a':'#e5484d','تغییر',(T1>=T0?'▲ ':'▼ ')+fm(Math.abs(Math.round(T0?(T1-T0)/T0*100:0)))+'٪','',T1>=T0?'pos':'neg')}</div>
 <div class="grid k2" style="align-items:start"><div class="card"><h3>${I('alert')} خریدشان کم شده — سر بزنید</h3><div class="slist">${down.map(row).join('')||'<div class="empty">هیچ دکانی کم نشده ✓</div>'}</div></div>
 <div class="card"><h3>${I('trend')} خریدشان زیاد شده</h3><div class="slist">${up.map(row).join('')||'<div class="empty">—</div>'}</div></div></div>
 <div class="hint" style="margin-top:10px">دکانی که ناگهان کمتر می‌خرد شاید از توزیع‌کنندهٔ دیگری جنس گرفته. زودتر سر بزنید و دلیلش را بپرسید.</div>`; }

function orphanTxns(){ const del={}; DB.customers.forEach(x=>{ if(x.deleted) del[x.id]=x; }); return DB.txns.filter(t=>!t.void&&t.party&&del[t.party]&&['sale','sreturn','receipt'].includes(t.type)); }
function fixOrphans(){ const l=orphanTxns(); let n=0, u=0; batch(()=>l.forEach(t=>{ let x=cust(t.party), g=0; while(x&&x.deleted&&x.mergedInto&&g++<5) x=cust(x.mergedInto); if(x&&!x.deleted){ save('txn',Object.assign({},t,{party:x.id})); n++; } else { save('customer',Object.assign({},cust(t.party),{deleted:false})); u++; } }));
 closeModal(); toast('✓ '+fm(n)+' سند به دکان درست منتقل شد'+(u?'، '+fm(u)+' دکان حذف‌شده برگردانده شد':'')); render(); }

/* ---------- installment plans for big debts ---------- */
function planPaid(x){ const at=x.plan.at; return txOf(x.id).filter(t=>true&&(t.createdAt||t.date)>=at&&(t.type==='receipt'||t.type==='sale')).reduce((s,t)=>s+(t.type==='receipt'?num(t.amount)+num(t.discount):num(t.paid)),0); }
function planStatus(x){ const td=today(), paid=planPaid(x); let cum=0, due=0, firstLate=null; const items=x.plan.items.map(it=>{ cum+=it.amt; const ok=paid>=cum-0.5; if(it.d<=td){ due=cum; if(!ok&&!firstLate) firstLate=it.d; } return Object.assign({},it,{ok}); });
 return {items,paid,due,behind:Math.max(0,due-paid),lateDays:firstLate?daysBetween(firstLate,td):0,done:paid>=cum-0.5}; }
function planForm(id){ if(!can('edit')) return toast('قسط‌بندی را مالک تعیین می‌کند'); const x=cust(id), b=(C().CU[id]||{bal:0}).bal; if(b<=0.5) return toast('این دکان بدهی ندارد'); F={type:'plan',id,n:4,every:7,start:addDays(today(),7),total:Math.round(b)};
 openModal('قسط‌بندی بدهی — '+x.name,`<div class="hint" style="margin-bottom:12px">بدهی بزرگ را به چند قسط تقسیم کنید. روز هر قسط در خانه یادآوری می‌شود و پولی که دکان می‌دهد خودکار از قسط‌ها کم می‌شود.</div>
 ${fl('مبلغ قسط‌بندی',`<input class="in" inputmode="decimal" value="${F.total}" oninput="F.total=num(this.value);drawPlan()">`)}
 ${fl('تعداد قسط',`<div class="chips">${[2,3,4,6,8,10,12].map(n=>`<button type="button" class="${F.n===n?'on':''}" onclick="F.n=${n};planForm2()">${fm(n)}</button>`).join('')}</div>`)}
 ${fl('هر چند وقت',`<div class="chips">${[[7,'هفته‌ای'],[14,'دو هفته'],[30,'ماهانه']].map(o=>`<button type="button" class="${F.every===o[0]?'on':''}" onclick="F.every=${o[0]};planForm2()">${o[1]}</button>`).join('')}</div>`)}
 ${fl('قسط اول',`<input class="in" type="date" value="${F.start}" onchange="F.start=this.value;drawPlan()">`)}
 <div id="plv"></div><div class="stick">${x.plan?`<button class="btn alt" onclick="confirmBtn(this,()=>{save('customer',Object.assign({},cust('${id}'),{plan:null}));closeModal();render();})">لغو قسط‌بندی قبلی</button>`:''}<button class="btn" onclick="savePlan()">${I('check')} ثبت قسط‌ها</button></div>`); drawPlan(); }
function planForm2(){ const k=Object.assign({},F); planForm(F.id); Object.assign(F,k); drawPlan(); document.querySelectorAll('#mBody .chips button').forEach(b=>{ const t=b.getAttribute('onclick')||''; const m=t.match(/F\.(n|every)=(\d+)/); if(m) b.classList.toggle('on',F[m[1]]===+m[2]); }); }
function planItems(){ const n=F.n, per=Math.floor(F.total/n), out=[]; for(let i=0;i<n;i++) out.push({d:addDays(F.start,i*F.every),amt:i<n-1?per:F.total-per*(n-1)}); return out; }
function drawPlan(){ const el=$('#plv'); if(!el) return; el.innerHTML=`<div class="slist">${planItems().map((it,i)=>`<div class="sr" style="cursor:default"><div class="m"><b>قسط ${fm(i+1)}</b><div class="mu">${fd(it.d)}</div></div><b>${money(it.amt)}</b></div>`).join('')}</div>`; }
function savePlan(){ if(!(F.total>0)) return toast('مبلغ را بنویسید'); const x=cust(F.id); save('customer',Object.assign({},x,{plan:{at:nowIso(),total:F.total,n:F.n,every:F.every,items:planItems(),by:META.user},promiseDate:null,promiseAmt:null})); closeModal(); toast('✓ قسط‌بندی ثبت شد'); render(); }
function planCard(x){ if(!x.plan) return ''; const ps=planStatus(x);
 return `<div class="card" style="margin-top:18px"><h3>${I('book')} قسط‌ها<span class="sp"></span><span class="mu" style="font-size:12.5px">پرداخت‌شده ${money(ps.paid)} از ${money(x.plan.total)}</span></h3>${ps.done?'<div class="hint pos">🎉 همهٔ قسط‌ها پرداخت شد</div>':ps.behind>0.5?`<div class="hint neg">${money(ps.behind)} عقب است${ps.lateDays?' — '+fm(ps.lateDays)+' روز':''}</div>`:''}<div class="hb2" style="margin:8px 0 12px"><i style="width:${Math.min(100,ps.paid/x.plan.total*100)}%"></i></div><div class="slist">${ps.items.map((it,i)=>`<div class="sr" style="cursor:default"><span class="badge" style="--c:${it.ok?'#16a37a':it.d<today()?'#e5484d':'#7d8796'}">${it.ok?'پرداخت شد':it.d<today()?'عقب':'مانده'}</span><div class="m"><b>قسط ${fm(i+1)}</b><div class="mu">${fd(it.d)}</div></div><b>${money(it.amt)}</b></div>`).join('')}</div></div>`; }

/* ---------- where was this entry made? (optional) ---------- */
function stampGeo(id){ if(!DB.settings.geoStamp||!navigator.geolocation) return;
 navigator.geolocation.getCurrentPosition(p=>{ const t=DB.txns.find(x=>x.id===id); if(!t||t.geo) return; const g={lat:+p.coords.latitude.toFixed(5),lng:+p.coords.longitude.toFixed(5),acc:Math.round(p.coords.accuracy)}; const x=cust(t.party);
  if(x&&x.lat) g.m=Math.round(hav(g.lat,g.lng,x.lat,x.lng)*1000); save('txn',Object.assign({},t,{geo:g})); },()=>{}, {enableHighAccuracy:false,timeout:15000,maximumAge:180000}); }
const geoTxt=t=>!t.geo?'':t.geo.m===undefined?'جای ثبت ذخیره شد':t.geo.m<=Math.max(150,t.geo.acc||0)?'سر دکان ثبت شد':'ثبت در '+(t.geo.m>=1000?fm(Math.round(t.geo.m/100)/10)+' کیلومتری':fm(t.geo.m)+' متری')+' دکان';
function farEntries(days){ const since=addDays(today(),-days); return DB.txns.filter(t=>!t.void&&t.date>=since&&t.geo&&t.geo.m!==undefined&&t.geo.m>Math.max(500,(t.geo.acc||0)*2)); }

/* ---------- counter day close (بستن حساب امروز هنگر) ---------- */
function ctLastClose(d){ return DB.txns.filter(t=>!t.void&&t.type==='dclose'&&t.date===d).sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''))[0]||null; }
function ctOpen(){ const d=today(), cl=ctLastClose(d), since=cl?cl.createdAt:'';
 const tx=DB.txns.filter(t=>!t.void&&t.date===d&&t.counter&&(t.type==='sale'||t.type==='purchase')&&(!since||(t.createdAt||'')>since));
 const sales=tx.filter(t=>t.type==='sale'), ins=tx.filter(t=>t.type==='purchase'), agg=a=>{ const m={}; a.forEach(t=>(t.items||[]).forEach(i=>{ const o=m[i.pid]||(m[i.pid]={q:0,v:0}); o.q+=num(i.qty); o.v+=num(i.qty)*num(i.price); })); return m; };
 const cash=sales.reduce((s,t)=>s+num(t.paid),0), credit=sales.reduce((s,t)=>s+txnTotal(t)-num(t.paid),0), byU={}; tx.forEach(t=>byU[t.by||'—']=(byU[t.by||'—']||0)+1);
 return {since,bills:sales.length,ins:ins.length,cash:r2(cash),credit:r2(credit),sold:agg(sales),inn:agg(ins),byU,inVal:ins.reduce((s,t)=>s+txnTotal(t),0)}; }

function ctCloseEditSave(){ const t=DB.txns.find(x=>x.id===F.id); if(!t) return; if(fv('counted')==='') return toast('پول شمرده‌شده را بنویسید');
 const why=fv('why').trim(); if(!why) return toast('دلیل ویرایش را بنویسید');
 const n={counted:num(fv('counted')),to:fv('to')||null,note:fv('note').trim()}, ch=Object.keys(n).filter(k=>String(t[k]??'')!==String(n[k]??'')).map(k=>({f:k,o:t[k]??null,n:n[k]}));
 if(!ch.length) return toast('چیزی تغییر نکرد');
 const by=t.by, d=t.date; let hid=t.hid||((DB.txns.find(x=>!x.void&&x.type==='handover'&&(x.dc===t.id||(t.no&&(x.note||'').includes(t.no))))||{}).id)||null;
 batch(()=>{ const h=hid&&DB.txns.find(x=>x.id===hid);
  if(n.to&&n.counted>0){ if(h) save('txn',Object.assign({},h,{to:n.to,amount:n.counted,editedBy:META.user,editedAt:nowIso()})); else hid=save('txn',{type:'handover',date:d,method:'cash',from:by,to:n.to,amount:n.counted,no:nextNo('HND'),note:'تحویل پول هنگر — '+t.no,dc:t.id}).id; }
  else if(h){ save('txn',Object.assign({},h,{void:true,voidBy:META.user,voidAt:nowIso()})); hid=null; }
  save('txn',Object.assign({},t,n,{amount:n.counted,diff:r2(n.counted-num(t.expected)),hid,okBy:null,okAt:null,editedBy:META.user,editedAt:nowIso(),edits:[...(t.edits||[]),{at:nowIso(),by:META.user,why,ch}]})); });
 closeModal(); render(); toast('✓ ویرایش ذخیره شد'); ctCloseView(t.id); }

/* rotating saber light: SVG stroke so it moves at an even pace along the edge, synced to one clock so re-renders never jump */
const SB_SEL='#side a.on,#bnav a.on,.tabs button.on,.seg button.on,.chips button.on,.chipf.on,.rpk.on,.days button.on,.uchips button.on,.lusers button.on,.etiles button.on,.pc.on,.mctl button.on';
const SB_MS=3200; let SBQ=0;
function saberize(){ SBQ=0; const del=-(performance.now()%SB_MS)+'ms';
 document.querySelectorAll('.sbx').forEach(x=>{ const el=x.parentNode; if(!el||!el.matches||!el.matches(SB_SEL)) x.remove(); });
 document.querySelectorAll(SB_SEL).forEach(el=>{ if(el.querySelector(':scope>.sbx')) return; const x=document.createElement('span'); x.className='sbx'; x.setAttribute('aria-hidden','true'); x.style.setProperty('--sbdel',del); x.style.setProperty('--sbd',SB_MS+'ms'); el.appendChild(x); }); }
function sbQueue(){ if(!SBQ) SBQ=requestAnimationFrame(saberize); }
const sbMine=n=>n.nodeType!==1||(n.classList&&n.classList.contains('sbx'));
try{ new MutationObserver(ms=>{ for(const m of ms){ if(m.type==='attributes'&&!(m.target.classList&&m.target.classList.contains('sbx'))){ sbQueue(); return; } if([...m.addedNodes].some(n=>!sbMine(n))||[...m.removedNodes].some(n=>!sbMine(n))){ sbQueue(); return; } } }).observe(document.documentElement,{subtree:true,childList:true,attributes:true,attributeFilter:['class']}); }catch(e){}
addEventListener('load',sbQueue);

/* ---------- closed counter accounts: daily / weekly / monthly ---------- */
let CLT='day';
const wkStart=d=>addDays(d,-((new Date(d+'T12:00:00').getDay()+1)%7));
function pMonth(d){ try{ const ps=new Intl.DateTimeFormat('en-u-ca-persian',{year:'numeric',month:'numeric'}).formatToParts(new Date(d+'T12:00:00')); const y=ps.find(x=>x.type==='year').value, m=ps.find(x=>x.type==='month').value; return y+'-'+String(m).padStart(2,'0'); }catch(e){ return d.slice(0,7); } }
function pMonthName(d){ try{ return new Intl.DateTimeFormat('fa-AF-u-ca-persian',{year:'numeric',month:'long'}).format(new Date(d+'T12:00:00')); }catch(e){ return d.slice(0,7); } }
function dayLabel(d){ const t=today(); if(d===t) return 'امروز'; if(d===addDays(t,-1)) return 'دیروز'; return WDN[new Date(d+'T12:00:00').getDay()]; }
function clGroups(kind){ const a=DB.txns.filter(t=>!t.void&&t.type==='dclose'), g={};
 a.forEach(t=>{ const k=kind==='day'?t.date:kind==='week'?wkStart(t.date):pMonth(t.date); const o=g[k]||(g[k]={k,list:[],cash:0,credit:0,bills:0,counted:0,diff:0,days:new Set(),sold:{},inn:{},edited:0,first:t.date,last:t.date});
  o.list.push(t); o.cash+=num(t.expected); o.credit+=num(t.credit); o.bills+=num(t.bills); o.counted+=num(t.counted); o.diff+=num(t.diff); o.days.add(t.date); if((t.edits||[]).length) o.edited++;
  if(t.date<o.first) o.first=t.date; if(t.date>o.last) o.last=t.date;
  [['sold',t.sold],['inn',t.inn]].forEach(([f,m])=>Object.entries(m||{}).forEach(([pid,x])=>{ const y=o[f][pid]||(o[f][pid]={q:0,v:0}); y.q+=num(x.q); y.v+=num(x.v); })); });
 return Object.values(g).sort((x,y)=>y.k.localeCompare(x.k)); }
function clTitle(kind,o){ const t=today();
 if(kind==='day') return `<b>${dayLabel(o.k)}</b> <span class="mu">${fd(o.k)}</span>`;
 if(kind==='week'){ const w=wkStart(t), l=o.k===w?'این هفته':o.k===addDays(w,-7)?'هفتهٔ گذشته':'هفته'; return `<b>${l}</b> <span class="mu">${fd(o.k)} تا ${fd(addDays(o.k,6))}</span>`; }
 const l=o.k===pMonth(t)?'این ماه':o.k===pMonth(addDays(monthStart(),-1))?'ماه گذشته':''; return `<b>${l||pMonthName(o.first)}</b>${l?` <span class="mu">${pMonthName(o.first)}</span>`:''}`; }
function viewCloses(){ const g=clGroups(CLT), now=CLT==='day'?today():CLT==='week'?wkStart(today()):pMonth(today()), open=ctOpen();
 const tabs=[['day','روزانه'],['week','هفته‌وار'],['month','ماهوار']];
 const tot=g.reduce((s,o)=>s+o.cash,0);
 return `<div class="seg" style="margin-bottom:16px">${tabs.map(([k,l])=>`<button class="${CLT===k?'on':''}" onclick="CLT='${k}';render()">${l}</button>`).join('')}</div>
 ${CLT==='day'&&!g.some(o=>o.k===today())?`<div class="card clrow open" onclick="${open.bills?'ctCloseForm()':"go('counter')"}"><div class="m"><b>امروز</b> <span class="mu">${fd(today())}</span><div class="mu">${open.bills?`${fm(open.bills)} بل — هنوز بسته نشده`:'هنوز بسته نشده'}</div></div><span class="btn sm">${I('lock')} ${open.bills?'بستن':'هنگر'}</span></div>`:''}
 ${g.length?g.map((o,i)=>`<div class="card clrow ${o.k===now?'cur':''}" onclick="clOpen('${CLT}','${o.k}')">
   <div class="m"><div>${clTitle(CLT,o)}${o.edited?' <span class="pill">ویرایش‌شده</span>':''}</div>
    <div class="clnums"><span>نقد <b class="pos">${money(o.cash)}</b></span><span>قرض <b class="warn">${money(o.credit)}</b></span><span>${fm(o.bills)} بل</span>${CLT!=='day'?`<span>${fm(o.days.size)} روز بسته شد</span>`:o.list.length>1?`<span>${fm(o.list.length)} بار بسته شد</span>`:`<span>${who(o.list[0].by)}</span>`}</div></div>
   <div class="cla"><b>${money(o.counted)}</b><small class="${Math.abs(o.diff)<0.5?'pos':o.diff>0?'pos':'neg'}">${Math.abs(o.diff)<0.5?'✓ درست':(o.diff>0?'+':'−')+money(Math.abs(o.diff))}</small></div></div>`).join(''):'<div class="card"><div class="empty">هنوز هیچ حسابی بسته نشده. آخر روز در صفحهٔ هنگر «بستن حساب» را بزنید.</div></div>'}`; }
function clOpen(kind,k){ const o=clGroups(kind).find(x=>x.k===k); if(!o) return;
 if(kind==='day'&&o.list.length===1) return ctCloseView(o.list[0].id);
 const title=kind==='day'?dayLabel(k)+' — '+fd(k):kind==='week'?'هفته: '+fd(k)+' تا '+fd(addDays(k,6)):pMonthName(o.first);
 const rows=kind==='day'?o.list.slice().sort((a,b)=>(a.createdAt||'').localeCompare(b.createdAt||'')).map(t=>`<div class="it" onclick="ctCloseView('${t.id}')"><div class="m"><div class="t">ساعت ${hm(t.createdAt)} — ${fm(t.bills)} بل</div><div class="d">${who(t.by)}${t.to?' · تحویل به '+esc(t.to):''}</div></div><div class="a">${money(t.counted)}</div></div>`)
  :[...o.days].sort().reverse().map(d=>{ const l=o.list.filter(t=>t.date===d), c=l.reduce((s,t)=>s+num(t.counted),0), df=l.reduce((s,t)=>s+num(t.diff),0), b=l.reduce((s,t)=>s+num(t.bills),0);
   return `<div class="it" onclick="${l.length===1?`ctCloseView('${l[0].id}')`:`clOpen('day','${d}')`}"><div class="m"><div class="t">${dayLabel(d)} ${fd(d)}</div><div class="d">${fm(b)} بل · نقد ${money(l.reduce((s,t)=>s+num(t.expected),0))}${Math.abs(df)>=0.5?` · <span class="${df>0?'pos':'neg'}">${df>0?'اضافه':'کم'} ${money(Math.abs(df))}</span>`:''}</div></div><div class="a">${money(c)}</div></div>`; });
 const txt=`📋 حساب هنگر — ${title}\n💵 فروش نقد: ${money(o.cash)}\n🧾 فروش قرض: ${money(o.credit)}\n🔢 تعداد بل: ${fm(o.bills)}\n✋ پول شمرده‌شده: ${money(o.counted)}${Math.abs(o.diff)>=0.5?' ('+(o.diff>0?'اضافه ':'کم ')+money(Math.abs(o.diff))+')':' ✓'}\n\n🛒 فروخته شد:\n`+Object.entries(o.sold).sort((a,b)=>b[1].v-a[1].v).map(([p,x])=>`• ${pname(p)}: ${qtyTxt(prod(p),r2(x.q))}`).join('\n');
 window._clTxt=txt;
 openModal(title,`<div class="grid k3 mini" style="margin-bottom:14px"><div><span class="mu">فروش نقد</span><b class="pos">${money(o.cash)}</b></div><div><span class="mu">فروش قرض</span><b class="warn">${money(o.credit)}</b></div><div><span class="mu">تعداد بل</span><b>${fm(o.bills)}</b></div></div>
  <div class="sum"><div><span>پول شمرده‌شده</span><b>${money(o.counted)}</b></div><div><span>تفاوت</span><b class="${Math.abs(o.diff)<0.5||o.diff>0?'pos':'neg'}">${Math.abs(o.diff)<0.5?'✓ درست':o.diff>0?money(o.diff)+' اضافه':money(-o.diff)+' کم'}</b></div></div>
  ${sec('clock',kind==='day'?'بستن‌های این روز':'روزها',`<div class="list">${rows.join('')}</div>`)}
  ${sec('receipt','فروخته شد',ctAggTable(o.sold,true))}${sec('in','وارد هنگر شد',ctAggTable(o.inn,can('cost')))}
  <div class="qrow" style="justify-content:center;margin-top:14px"><button class="btn" style="--c:#25b05a" onclick="window.open('https://wa.me/?text='+encodeURIComponent(window._clTxt),'_blank')">${I('wa')} فرستادن در واتس‌اپ</button><button class="btn alt" onclick="navigator.clipboard.writeText(window._clTxt).then(()=>toast('کاپی شد'))">کاپی</button></div>`); }
