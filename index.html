<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#e6eaef">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ابراهیمی اکانتینگ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#e6eaef;--card:#e6eaef;--sd:#c3c9d2;--sl:#ffffff;--tx:#2b3340;--mu:#7d8796;--line:rgba(120,130,145,.18);
 --g:#0f8f78;--g2:#13a389;--g3:rgba(19,163,137,.12);--red:#e5484d;--or:#f08c2e;--gr:#16a37a;--bl:#3b6fd8;--pu:#8b5cf6;
 --acc1:#ffc24b;--acc2:#ff5a4e;--r:22px;
 --up:7px 7px 16px var(--sd),-7px -7px 16px var(--sl);--upS:4px 4px 9px var(--sd),-4px -4px 9px var(--sl);
 --in:inset 4px 4px 9px var(--sd),inset -4px -4px 9px var(--sl);--inS:inset 2px 2px 5px var(--sd),inset -2px -2px 5px var(--sl)}
[data-theme=dark]{--bg:#2a2e35;--card:#2a2e35;--sd:#1b1e22;--sl:#383d46;--tx:#e9ecf1;--mu:#98a1ae;--line:rgba(255,255,255,.07);--g3:rgba(19,163,137,.16)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,sans-serif;font-size:15px}
button,input,select,textarea{font-family:inherit;font-size:15px;color:var(--tx)}
a{color:var(--g2)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
#side{background:var(--bg);position:sticky;top:0;height:100vh;overflow:auto;padding:22px 16px;box-shadow:6px 0 18px var(--sd)}
#side .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;padding:4px 6px}
#side .logo{width:44px;height:44px;border-radius:50%;box-shadow:var(--up);display:grid;place-items:center;color:var(--g2);position:relative;flex:none}
#side .logo:after{content:'';position:absolute;inset:-5px;border-radius:50%;border:2.5px solid transparent;border-top-color:var(--acc1);border-left-color:var(--acc2);transform:rotate(-30deg)}
#side .sub{color:var(--mu);font-size:12px;padding:4px 6px 18px 6px;margin-right:56px;margin-top:-12px}
#side a{display:flex;gap:12px;align-items:center;color:var(--mu);text-decoration:none;padding:11px 14px;border-radius:16px;margin:7px 0;cursor:pointer;transition:.2s}
#side a:hover{color:var(--tx)}
#side a.on{box-shadow:var(--in);color:var(--g2);font-weight:700}
#side a.on:before{content:'';width:6px;height:6px;border-radius:50%;background:var(--g2);order:3;margin-right:auto;box-shadow:0 0 8px var(--g2)}
#side .qa{margin-top:18px;display:grid;gap:10px}
#side .qa button{background:var(--bg);color:var(--tx);border:0;border-radius:16px;padding:11px 14px;cursor:pointer;text-align:right;box-shadow:var(--upS);display:flex;align-items:center;gap:10px}
#side .qa button svg{color:var(--g2)}
#side .qa button:active{box-shadow:var(--inS)}
main{min-width:0}
#top{position:sticky;top:0;z-index:500;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);display:flex;align-items:center;gap:10px;padding:12px 18px}
#top h1{font-size:18px;margin:0;flex:1;font-weight:800}
.chip{display:inline-flex;align-items:center;gap:7px;background:var(--bg);color:var(--tx);border-radius:99px;padding:8px 13px;font-size:13px;font-weight:600;cursor:pointer;border:0;box-shadow:var(--upS)}
.chip:active{box-shadow:var(--inS)}
.chip svg.i{width:17px;height:17px;color:var(--g2)}
.dot{width:8px;height:8px;border-radius:50%;background:#a7afba;display:inline-block}
.dot.ok{background:var(--gr);box-shadow:0 0 8px var(--gr)}.dot.err{background:var(--red);box-shadow:0 0 8px var(--red)}.dot.busy{background:var(--or)}
#view{padding:10px 18px 18px;max-width:1240px;margin:auto;padding-bottom:120px}
#bnav{display:none}
.grid{display:grid;gap:18px}
.k4{grid-template-columns:repeat(4,minmax(0,1fr))}.k3{grid-template-columns:repeat(3,minmax(0,1fr))}.k2{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:var(--up)}
.card .card{box-shadow:var(--in)}
.card h3{margin:0 0 14px;font-size:15px;display:flex;align-items:center;gap:10px;font-weight:800}
.card h3 .sp{flex:1}
.card h3>svg.i{color:var(--g2)}
.kpi{display:flex;gap:14px;align-items:center}
.ic{--c:var(--g2);width:50px;height:50px;border-radius:50%;box-shadow:var(--upS);display:grid;place-items:center;color:var(--c);position:relative;flex:none;margin:5px}
.ic:after{content:'';position:absolute;inset:-6px;border-radius:50%;border:2.5px solid transparent;border-top-color:var(--c);border-right-color:var(--c);opacity:.85;transform:rotate(-25deg)}
.ic svg.i{width:22px;height:22px}
.kt{min-width:0}
.kpi .l{color:var(--mu);font-size:12.5px}.kpi .v{font-size:19px;font-weight:800;margin-top:3px;white-space:nowrap}
.kpi .s{font-size:12px;color:var(--mu);margin-top:2px}
.pos{color:var(--gr)}.neg{color:var(--red)}.warn{color:var(--or)}.mu{color:var(--mu)}
.btn{--c:var(--g2);background:linear-gradient(145deg,color-mix(in srgb,var(--c) 88%,#fff),var(--c));color:#fff;border:0;border-radius:14px;padding:11px 16px;cursor:pointer;font-weight:700;display:inline-flex;align-items:center;gap:7px;justify-content:center;box-shadow:4px 4px 10px var(--sd),-4px -4px 10px var(--sl);text-decoration:none;transition:.15s}
.hm{}
.btn:active{transform:scale(.97);box-shadow:var(--inS)}
.btn.alt,.btn.ghost{background:var(--bg);color:var(--g2)}
.btn.red{--c:var(--red)}.btn.bl{--c:var(--bl)}.btn.or{--c:var(--or)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:12px}
.btn:disabled{opacity:.5}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:right;color:var(--mu);font-weight:600;font-size:12.5px;border-bottom:1px solid var(--line);padding:9px 8px;white-space:nowrap}
.tbl td{border-bottom:1px solid var(--line);padding:10px 8px;vertical-align:top}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:var(--g3)}
.tbl .n{text-align:left;white-space:nowrap;direction:ltr}
.tbl tfoot td{font-weight:800;border-top:2px solid var(--mu)}
.tw{overflow-x:auto}
.badge{--c:#888;display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:4px 10px;font-size:12px;font-weight:700;color:var(--c);white-space:nowrap;background:color-mix(in srgb,var(--c) 14%,transparent)}
.badge:before{content:'';width:7px;height:7px;border-radius:50%;background:var(--c)}
.list .it{display:flex;gap:12px;align-items:center;padding:10px 12px;margin:0 0 10px;border-radius:18px;cursor:pointer;box-shadow:var(--upS);transition:.15s}
.list .it:active{box-shadow:var(--inS)}
.list .it .m{flex:1;min-width:0}.list .it .t{font-weight:700}.list .it .d{font-size:12.5px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .it .a{text-align:left;font-weight:800;white-space:nowrap}
.av{--c:var(--g2);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:var(--c);flex:none;box-shadow:var(--upS);position:relative;margin:3px}
.av:after{content:'';position:absolute;inset:-4px;border-radius:50%;border:2px solid transparent;border-top-color:var(--c);border-left-color:var(--c);transform:rotate(20deg)}
input.in,select.in,textarea.in{width:100%;padding:12px 14px;border:0;border-radius:14px;background:var(--bg);box-shadow:var(--in)}
input.in:focus,select.in:focus,textarea.in:focus{outline:2px solid color-mix(in srgb,var(--g2) 55%,transparent)}
.fl{display:block;margin-bottom:12px}.fl>span{display:block;font-size:12.5px;color:var(--mu);margin-bottom:6px;font-weight:600}
.f2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.tabs{display:flex;gap:10px;overflow-x:auto;margin-bottom:16px;padding:6px 6px 10px}
.tabs button{border:0;background:var(--bg);border-radius:99px;padding:8px 16px;white-space:nowrap;cursor:pointer;box-shadow:var(--upS);color:var(--mu)}
.tabs button.on{box-shadow:var(--inS);color:var(--g2);font-weight:700}
.tabs select.in{padding:8px 12px}
#modal{position:fixed;inset:0;background:rgba(30,36,45,.35);backdrop-filter:blur(3px);z-index:2000;display:flex;align-items:center;justify-content:center}
#modal.hide{display:none}
.sheet{background:var(--bg);border-radius:26px;width:min(700px,96vw);max-height:92vh;display:flex;flex-direction:column;box-shadow:12px 12px 30px rgba(0,0,0,.25)}
.sh-head{display:flex;align-items:center;padding:16px 18px}
.sh-head b{flex:1;font-size:16px}.sh-head button{border:0;background:var(--bg);border-radius:50%;width:38px;height:38px;cursor:pointer;font-size:15px;box-shadow:var(--upS)}
#mBody{padding:6px 18px 20px;overflow:auto}
.irow{display:grid;grid-template-columns:1fr 80px 100px 90px 34px;gap:8px;align-items:center;margin-bottom:10px}
.irow.adj{grid-template-columns:1fr 100px 90px 34px}
.irow select,.irow input{padding:10px;border:0;border-radius:12px;width:100%;min-width:0;background:var(--bg);box-shadow:var(--inS)}
.irow .ilt{font-size:12.5px;text-align:left;font-weight:700;direction:ltr}
.irow .x{border:0;background:var(--bg);color:var(--red);border-radius:50%;height:34px;width:34px;cursor:pointer;box-shadow:var(--upS)}
.sum{border-radius:18px;padding:12px 16px;margin:12px 0;box-shadow:var(--in)}
.sum div{display:flex;justify-content:space-between;padding:3px 0}.sum .big{font-weight:800;font-size:16px;border-top:1px dashed var(--mu);margin-top:5px;padding-top:7px}
#toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:11px 20px;border-radius:16px;z-index:3000;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center;font-weight:600}
#toast.on{opacity:1}
#map{height:62vh;border-radius:var(--r);box-shadow:var(--in);background:var(--bg);z-index:1;border:6px solid var(--bg)}
.mapbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.leaflet-popup-content{font-family:Vazirmatn,Tahoma;direction:rtl;text-align:right;min-width:200px}
.leaflet-popup-content-wrapper{border-radius:18px}
.pop b{font-size:15px}.pop .row{margin-top:8px;gap:6px}.pop .btn{box-shadow:none}
.aging{display:flex;height:12px;border-radius:99px;overflow:hidden;box-shadow:var(--inS);margin:10px 0 6px}
.aging i{display:block;height:100%}
.empty{padding:28px;text-align:center;color:var(--mu)}
.gps{font-size:12.5px;color:var(--mu)}
.hint{font-size:12.5px;color:var(--mu);line-height:1.9}
pre.code{direction:ltr;text-align:left;background:#1e2229;color:#bfe;padding:12px;border-radius:14px;overflow:auto;font-size:12px;white-space:pre}
details summary{cursor:pointer}
/* hero ring */
.hero{display:grid;grid-template-columns:260px 1fr;gap:22px;align-items:center}
.ring{position:relative;width:230px;height:230px;margin:auto;border-radius:50%;box-shadow:var(--up)}
.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring .in{position:absolute;inset:40px;border-radius:50%;box-shadow:var(--up);display:grid;place-items:center;text-align:center;align-content:center}
.ring .in b{font-size:34px;font-weight:800;line-height:1}
.ring .in b small{font-size:18px}
.ring .in span{font-size:12px;color:var(--mu);margin-top:6px;max-width:120px}
.hrows{display:grid;gap:12px}
.hrow{display:flex;align-items:center;gap:14px;padding:10px 14px 10px 18px;border-radius:99px;box-shadow:var(--upS);cursor:pointer}
.hrow:active{box-shadow:var(--inS)}
.hrow .ic{width:42px;height:42px;margin:4px}.hrow .ic:after{inset:-5px}
.hrow .m{flex:1;min-width:0}.hrow .m div{font-size:12.5px;color:var(--mu)}
.hrow .v{font-weight:800;font-size:17px;white-space:nowrap}
.steps{display:flex;align-items:center;gap:0;margin:4px 0 14px;overflow-x:auto;padding:10px 4px}
@media (max-width:860px){
 #app{grid-template-columns:minmax(0,1fr)}
 #side{display:none}
 #top{padding:12px 14px}
 #view{padding:8px 14px;padding-bottom:120px}
 .grid{gap:14px}
 .k4{grid-template-columns:repeat(2,minmax(0,1fr))}.k3{grid-template-columns:repeat(2,minmax(0,1fr))}
 .k2{grid-template-columns:minmax(0,1fr)}
 .card{padding:15px;border-radius:20px}
 .kpi{flex-direction:column;align-items:flex-start;gap:8px}
 .kpi .v{font-size:16px}
 .ic{width:42px;height:42px}
 .hero{grid-template-columns:1fr}
 .ring{width:210px;height:210px}
 #bnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--bg);z-index:900;padding:8px 6px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -6px 16px var(--sd)}
 #bnav a{flex:1;text-align:center;font-size:11px;color:var(--mu);text-decoration:none;cursor:pointer;padding:2px 0;display:flex;flex-direction:column;align-items:center;gap:3px}
 #bnav a b{width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
 #bnav a.on{color:var(--g2);font-weight:700}
 #bnav a.on b{box-shadow:var(--inS)}
 #bnav a.plus b{width:58px;height:58px;margin-top:-30px;color:#fff;background:linear-gradient(145deg,#1bc3a4,#0f8f78);box-shadow:5px 5px 12px var(--sd),-5px -5px 12px var(--sl);position:relative}
 #bnav a.plus b:after{content:'';position:absolute;inset:-7px;border-radius:50%;border:3px solid transparent;border-top-color:var(--acc1);border-left-color:var(--acc2);transform:rotate(-20deg)}
 #bnav a.plus svg.i{width:28px;height:28px;stroke-width:2.4}
 .irow{grid-template-columns:1fr 64px 80px 30px}.irow .ilt{display:none}
 .irow.adj{grid-template-columns:1fr 80px 30px}
 .sheet{width:100vw;max-height:94vh;border-radius:26px 26px 0 0;position:fixed;bottom:0}
 #modal{align-items:flex-end}
 #map{height:55vh}
}
/* v1.2 — forms, POS, customer hero, chart, print */
.sec{margin-bottom:18px}
.sech{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;margin:0 2px 10px;color:var(--tx)}
.sech svg.i{color:var(--g2);width:18px;height:18px}.sech .sp{flex:1}
.sbox{display:flex;align-items:center;gap:8px;border-radius:14px;box-shadow:var(--in);padding:0 12px;margin-bottom:12px}
.sbox svg.i{color:var(--mu);width:18px;height:18px}
.sbox input{flex:1;border:0;background:transparent;padding:12px 0;outline:none;min-width:0}
.psel{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:18px;box-shadow:var(--upS);cursor:pointer}
.psel .m{flex:1;min-width:0}.psel .m b{font-size:16px}.psel .mu{font-size:12.5px}
.psel .pb{text-align:left}.psel .pb b{font-size:16px}
.psel .chg{color:var(--g2);font-size:13px;font-weight:700}
.plist{max-height:300px;overflow:auto;padding:4px 4px 6px;margin:0 -4px}
.pi{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:14px;cursor:pointer;margin-bottom:6px}
.pi:hover{box-shadow:var(--upS)}.pi:active{box-shadow:var(--inS)}
.pi .m{flex:1;min-width:0}.pi .mu{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pi.new{color:var(--g2)}
.gstrip{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:6px 4px 14px;max-height:290px;overflow:auto}
.pc{position:relative;text-align:right;border:0;background:var(--bg);border-radius:16px;padding:11px 12px;box-shadow:var(--upS);display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0}
.pc b{font-size:13px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:40px}
.pc span{color:var(--g2);font-weight:800;font-size:13.5px}
.pc i{font-style:normal;font-size:11.5px;color:var(--mu)}
.pc.on{box-shadow:var(--inS)}
.pc em{position:absolute;top:-7px;left:-7px;background:linear-gradient(145deg,#1bc3a4,#0f8f78);color:#fff;border-radius:99px;min-width:26px;height:26px;font-style:normal;font-size:12.5px;font-weight:800;display:grid;place-items:center;padding:0 7px;box-shadow:0 3px 8px rgba(0,0,0,.25)}
.cart{display:grid;gap:10px}
.cl{display:grid;grid-template-columns:minmax(0,1fr) auto 120px 90px 34px;gap:10px;align-items:center;padding:10px 12px;border-radius:16px;box-shadow:var(--upS)}
.cn b{font-size:14px}.cn .mu{font-size:12px}
.stp{display:flex;align-items:center;border-radius:12px;box-shadow:var(--inS);overflow:hidden}
.stp button{border:0;background:transparent;width:34px;height:38px;font-size:19px;font-weight:700;color:var(--g2);cursor:pointer}
.stp input{width:46px;border:0;background:transparent;text-align:center;font-weight:800;outline:none}
.cp{display:flex;align-items:center;gap:6px;border-radius:12px;box-shadow:var(--inS);padding:0 10px}
.cp input{width:100%;border:0;background:transparent;padding:10px 0;outline:none;font-weight:600;min-width:0}
.cp .mu{font-size:11.5px}
.ct{font-weight:800;text-align:left;direction:ltr;white-space:nowrap}
.cl .x{border:0;background:var(--bg);color:var(--red);border-radius:50%;height:32px;width:32px;cursor:pointer;box-shadow:var(--upS)}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin:-2px 0 14px}
.chips button{border:0;background:var(--bg);border-radius:99px;padding:8px 14px;box-shadow:var(--upS);cursor:pointer;font-size:13px;font-weight:600;color:var(--g2)}
.chips button:active{box-shadow:var(--inS)}
.seg{display:flex;border-radius:14px;box-shadow:var(--in);padding:5px;gap:5px}
.seg button{flex:1;border:0;background:transparent;border-radius:11px;padding:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--mu);font-weight:600}
.seg button.on{background:var(--bg);box-shadow:var(--upS);color:var(--g2)}
.seg svg.i{width:17px;height:17px}
details.more{border-radius:16px;padding:12px 14px;box-shadow:var(--upS);margin-top:4px}
details.more summary{list-style:none;display:flex;align-items:center;gap:8px;color:var(--mu);font-weight:600;font-size:13.5px}
details.more summary::-webkit-details-marker{display:none}
details.more summary svg.i{width:16px;height:16px}
details.more[open] summary{color:var(--g2)}
input.in.big{font-size:26px;font-weight:800;text-align:center;padding:14px;margin-bottom:12px}
.stick{position:sticky;bottom:-20px;margin:18px -18px -20px;padding:12px 18px calc(12px + env(safe-area-inset-bottom));background:var(--bg);display:flex;align-items:center;gap:14px;box-shadow:0 -8px 16px -6px var(--sd);z-index:5}
.stick .ft{flex:1;min-width:0}.stick .ft .mu{font-size:12px;display:block}.stick .ft b{display:block;font-size:22px;font-weight:800;white-space:nowrap}
.stick .btn{padding:14px 26px;font-size:16px}
.sum:empty{display:none}
.etiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.etiles button{border:0;background:var(--bg);border-radius:18px;padding:12px 6px;box-shadow:var(--upS);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--tx)}
.etiles button .ic{width:38px;height:38px;margin:4px}.etiles button .ic:after{inset:-5px}
.etiles button b{font-size:11.5px;font-weight:600;line-height:1.5;text-align:center}
.etiles button.on{box-shadow:var(--inS)}.etiles button.on b{color:var(--g2)}
/* quick actions */
.qrow{display:flex;gap:14px;flex-wrap:wrap;margin-top:16px}
.qa{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;color:var(--tx);text-decoration:none;font-family:inherit;width:74px;padding:0}

<!-- ===================== ENGINE (data + accounting) ===================== -->
<script id="engine">
'use strict';
const LS = 'ebrahimi_acc_v1';
const VERSION = '1.2.1';

/* ---- Chart of accounts (کدینگ حساب‌ها) ----
   nature: A=asset (debit), L=liability (credit), E=equity (credit), E-=contra equity (debit),
           R=revenue (credit), R-=contra revenue (debit), X=expense (debit) */
const ACCOUNTS = [
 ['1010','صندوق نقدی (دخل)','A'],
 ['1020','بانک / حواله / حساب موبایلی','A'],
 ['1100','حسابات دریافتنی — طلب از دکان‌ها','A'],
 ['1200','موجودی جنس (هنگر / گدام)','A'],
 ['1500','موتر باربری و تجهیزات','A'],
 ['2100','حسابات پرداختنی — قرض به عمده‌فروش‌ها','L'],
 ['2200','سایر قرضه‌ها','L'],
 ['3100','سرمایهٔ مالک','E'],
 ['3200','برداشت مالک (مصارف شخصی/خانه)','E-'],
 ['3900','موجودی‌های افتتاحیه (اول دوره)','E'],
 ['4100','فروش جنس','R'],
 ['4200','تخفیف و مرجوعی فروش','R-'],
 ['4300','تخفیف دریافتی و سایر عواید','R'],
 ['5100','قیمت تمام‌شدهٔ جنس فروخته‌شده','X'],
 ['6100','تیل و مصرف موتر','X'],
 ['6200','ترمیم، پرزه و تایر موتر','X'],
 ['6300','کرایهٔ هنگر / دکان','X'],
 ['6400','معاش و مزد کارگر','X'],
 ['6500','حمالی و بارگیری','X'],
 ['6600','برق، آب، انترنت، کریدت','X'],
 ['6700','محصول، مالیات، جواز و شاروالی','X'],
 ['6800','کسری، ضایعات و تاریخ‌گذشته','X'],
 ['6900','سایر مصارف','X'],
];
const ACC = Object.fromEntries(ACCOUNTS.map(a=>[a[0],{code:a[0],name:a[1],nat:a[2]}]));
const CASH = {cash:'1010', bank:'1020'};

const TT = {
 sale:     ['فروش (بل فروش)', 'INV', '#13806b'],
 sreturn:  ['مرجوعی فروش',    'SR',  '#6f8f2f'],
 purchase: ['خرید عمده',      'PUR', '#2c5aa0'],
 preturn:  ['مرجوعی خرید',    'PR',  '#5b6fb0'],
 receipt:  ['دریافت پول از دکان','RCV','#1e8e5a'],
 payment:  ['پرداخت به عمده‌فروش','PAY','#8e44ad'],
 expense:  ['مصرف',           'EXP', '#c0392b'],
 capital:  ['آوردن سرمایه',    'CAP', '#0f5c4d'],
 drawing:  ['برداشت مالک',     'DRW', '#a0522d'],
 transfer: ['انتقال بین صندوق و بانک','TRF','#607d8b'],
 adjust:   ['اصلاح موجودی گدام','ADJ','#d98a00'],
};

let DB, META;
const num = v => { if(v===null||v===undefined) return 0; if(typeof v==='number') return isFinite(v)?v:0;
 const s=String(v).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[,،٬\s]/g,'').replace(/٫/g,'.');
 const n=parseFloat(s); return isFinite(n)?n:0; };
const r2 = n => Math.round(n*100)/100;
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,9);
const nowIso = () => new Date().toISOString();
function today(){ const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); }
function addDays(iso,n){ const d=new Date(iso+'T12:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
function daysBetween(a,b){ return Math.round((new Date(b+'T12:00:00Z')-new Date(a+'T12:00:00Z'))/864e5); }

function defaultDB(){ return {products:[],customers:[],suppliers:[],txns:[],
 settings:{id:'settings',kind:'settings',biz:'ابراهیمی اکانتینگ',users:['ابراهیمی','پدر'],startDate:today(),updatedAt:'1970-01-01T00:00:00.000Z'}}; }
function load(){
 try{ DB=JSON.parse(localStorage.getItem(LS)); }catch(e){ DB=null; }
 if(!DB||typeof DB!=='object') DB=defaultDB();
 ['products','customers','suppliers','txns'].forEach(k=>{ if(!Array.isArray(DB[k])) DB[k]=[]; });
 if(!DB.settings) DB.settings=defaultDB().settings;
 try{ META=JSON.parse(localStorage.getItem(LS+'_meta')); }catch(e){ META=null; }
 if(!META) META={device:'ABCDEFGHJKMNPRSTUVWXYZ'[Math.floor(Math.random()*22)], user:DB.settings.users[0], dirty:[], lastPull:'', sync:{}};
 if(!Array.isArray(META.dirty)) META.dirty=[];
 if(!META.sync) META.sync={};
}
function persist(){
 try{ localStorage.setItem(LS,JSON.stringify(DB)); localStorage.setItem(LS+'_meta',JSON.stringify(META)); return true; }
 catch(e){ if(typeof toast==='function') toast('⚠️ خطا در ذخیره‌سازی: '+e.message); return false; }
}
const KIND = {product:'products',customer:'customers',supplier:'suppliers',txn:'txns'};
let _C=null; function invalidate(){ _C=null; }
function C(){ return _C||(_C=compute()); }
let onSaved=null;
function save(kind,rec){
 rec=Object.assign({},rec); rec.kind=kind; rec.updatedAt=nowIso();
 if(!rec.id) rec.id=uid();
 if(!rec.createdAt){ rec.createdAt=rec.updatedAt; rec.by=META.user; }
 if(kind==='settings'){ rec.id='settings'; DB.settings=rec; }
 else { const arr=DB[KIND[kind]]; const i=arr.findIndex(x=>x.id===rec.id); if(i>=0) arr[i]=rec; else arr.push(rec); }
 if(!META.dirty.includes(rec.id)) META.dirty.push(rec.id);
 persist(); invalidate(); if(onSaved) onSaved();
 return rec;
}
function allRecords(){ return [DB.settings,...DB.products,...DB.customers,...DB.suppliers,...DB.txns]; }
function findRec(id){ return allRecords().find(r=>r.id===id); }
function nextNo(prefix){
 const re=new RegExp('^'+prefix+'-'+META.device+'(\\d+)$'); let mx=0;
 for(const r of [...DB.txns,...DB.customers,...DB.suppliers,...DB.products]){ const m=re.exec(r.no||r.code||''); if(m) mx=Math.max(mx,+m[1]); }
 return prefix+'-'+META.device+String(mx+1).padStart(4,'0');
}
const cust = id => DB.customers.find(x=>x.id===id);
const supp = id => DB.suppliers.find(x=>x.id===id);
const prod = id => DB.products.find(x=>x.id===id);
const pname = id => (prod(id)||{}).name||'؟';
const partyName = t => { const p=(['purchase','preturn','payment'].includes(t.type)?supp:cust)(t.party); return p?p.name:''; };

/* ---- Core: replay every transaction in date order and build the double-entry journal ----
   Inventory valued with weighted-average cost (میانگین موزون). Receivables aged FIFO. */
function compute(){
 const s=DB.settings, sd=s.startDate||'2000-01-01';
 const J=[], P={}, CU={}, SU={}, costs={};
 const post=(t,acc,amt,memo)=>{ amt=r2(amt); if(Math.abs(amt)<0.005) return;
  J.push({d:t.date,tx:t.id,no:t.no||'',type:t.type,acc,dr:amt>0?amt:0,cr:amt<0?-amt:0,memo:memo||''}); };
 const op={date:sd,id:'opening',no:'افتتاحیه',type:'opening'};
 const gp=id=>P[id]||(P[id]={qty:0,avg:0,soldQty:0,rev:0,cogs:0,boughtQty:0,lastBuy:0});
 const gc=id=>CU[id]||(CU[id]={bal:0,sales:0,recv:0,open:[],adv:0,last:null,lastSale:null,cnt:0});
 const gs=id=>SU[id]||(SU[id]={bal:0,buys:0,paid:0,last:null});
 const debitC=(c,amt,t)=>{ c.bal+=amt; let a=amt; if(c.adv>0){ const u=Math.min(c.adv,a); c.adv-=u; a-=u; } if(a>0.005) c.open.push({d:t.date,amt:a,no:t.no}); };
 const creditC=(c,amt)=>{ c.bal-=amt; let r=amt; while(r>0.005&&c.open.length){ const f=c.open[0]; if(f.amt<=r+0.005){ r-=f.amt; c.open.shift(); } else { f.amt-=r; r=0; } } if(r>0.005) c.adv+=r; };

 for(const p of DB.products){ if(p.deleted) continue; const q=num(p.openQty), c=num(p.openCost); const x=gp(p.id); x.qty=q; x.avg=c; x.lastBuy=c;
  if(q*c){ post(op,'1200',q*c,'موجودی اول دوره: '+p.name); post(op,'3900',-q*c,'موجودی اول دوره: '+p.name); } }
 for(const c of DB.customers){ if(c.deleted) continue; const b=num(c.openBal); const x=gc(c.id);
  if(b){ debitC(x,b,{date:sd,no:'افتتاحیه'}); post(op,'1100',b,'طلب اول دوره: '+c.name); post(op,'3900',-b,'طلب اول دوره: '+c.name); } }
 for(const v of DB.suppliers){ if(v.deleted) continue; const b=num(v.openBal); const x=gs(v.id);
  if(b){ x.bal=b; post(op,'3900',b,'قرض اول دوره: '+v.name); post(op,'2100',-b,'قرض اول دوره: '+v.name); } }

 const tx=DB.txns.filter(t=>!t.void).slice().sort((a,b)=>(a.date+(a.createdAt||'')).localeCompare(b.date+(b.createdAt||'')));
 for(const t of tx){
  const cash=CASH[t.method]||'1010', items=t.items||[], nm=partyName(t);
  switch(t.type){
   case 'sale':{ let gross=0,cost=0;
    for(const it of items){ const p=gp(it.pid),q=num(it.qty),pr=num(it.price); gross+=q*pr; const c=q*p.avg; cost+=c; p.qty-=q; p.soldQty+=q; p.rev+=q*pr; p.cogs+=c; }
    const disc=num(t.discount), net=gross-disc, paid=num(t.paid);
    post(t,'1100',net,'فروش به '+nm); if(disc) post(t,'4200',disc,'تخفیف فروش'); post(t,'4100',-gross,'فروش به '+nm);
    if(paid){ post(t,cash,paid,'دریافت نقد هنگام فروش'); post(t,'1100',-paid,'دریافت نقد هنگام فروش'); }
    post(t,'5100',cost,'قیمت تمام‌شده'); post(t,'1200',-cost,'خروج از گدام');
    costs[t.id]=cost; const c=gc(t.party); debitC(c,net,t); if(paid) creditC(c,paid); c.sales+=net; c.recv+=paid; c.last=t.date; c.lastSale=t.date; c.cnt++; break; }
   case 'sreturn':{ let val=0,cost=0;
    for(const it of items){ const p=gp(it.pid),q=num(it.qty),pr=num(it.price); val+=q*pr; const c=q*p.avg; cost+=c; p.qty+=q; p.soldQty-=q; p.rev-=q*pr; p.cogs-=c; }
    post(t,'4200',val,'مرجوعی از '+nm); post(t,'1100',-val,'مرجوعی از '+nm); post(t,'1200',cost,'برگشت به گدام'); post(t,'5100',-cost,'برگشت قیمت تمام‌شده');
    const c=gc(t.party); creditC(c,val); c.sales-=val; const paid=num(t.paid);
    if(paid){ post(t,'1100',paid,'پس‌دادن پول به '+nm); post(t,cash,-paid,'پس‌دادن پول'); debitC(c,paid,t); }
    costs[t.id]=-cost; c.last=t.date; break; }
   case 'purchase':{ let gross=0; for(const it of items) gross+=num(it.qty)*num(it.price);
    const disc=num(t.discount), extra=num(t.extra), owed=gross-disc, paid=num(t.paid), total=owed+extra;
    for(const it of items){ const p=gp(it.pid),q=num(it.qty),line=q*num(it.price); if(q<=0) continue;
     const share=gross?line/gross:0, landed=line-disc*share+extra*share, base=Math.max(p.qty,0);
     p.avg=(base*p.avg+landed)/(base+q); p.qty+=q; p.boughtQty+=q; p.lastBuy=landed/q; }
    post(t,'1200',total,'خرید از '+nm); post(t,'2100',-owed,'خرید از '+nm);
    if(extra) post(t,cash,-extra,'کرایه/حمالی خرید');
    if(paid){ post(t,'2100',paid,'پرداخت هنگام خرید'); post(t,cash,-paid,'پرداخت هنگام خرید'); }
    const s2=gs(t.party); s2.bal+=owed-paid; s2.buys+=owed; s2.paid+=paid; s2.last=t.date; break; }
   case 'preturn':{ let val=0,cost=0;
    for(const it of items){ const p=gp(it.pid),q=num(it.qty); val+=q*num(it.price); cost+=q*p.avg; p.qty-=q; }
    post(t,'2100',val,'مرجوعی به '+nm); post(t,'1200',-cost,'خروج مرجوعی'); post(t,'5100',cost-val,'تفاوت قیمت مرجوعی');
    const s2=gs(t.party); s2.bal-=val; const paid=num(t.paid);
    if(paid){ post(t,cash,paid,'دریافت پول مرجوعی'); post(t,'2100',-paid,'دریافت پول مرجوعی'); s2.bal+=paid; }
    s2.last=t.date; break; }
   case 'receipt':{ const a=num(t.amount), d=num(t.discount);
    post(t,cash,a,'دریافت از '+nm); if(d) post(t,'4200',d,'تخفیف هنگام تصفیه'); post(t,'1100',-(a+d),'دریافت از '+nm);
    const c=gc(t.party); creditC(c,a+d); c.recv+=a; c.last=t.date; break; }
   case 'payment':{ const a=num(t.amount), d=num(t.discount);
    post(t,'2100',a+d,'پرداخت به '+nm); post(t,cash,-a,'پرداخت به '+nm); if(d) post(t,'4300',-d,'تخفیف گرفته‌شده');
    const s2=gs(t.party); s2.bal-=a+d; s2.paid+=a; s2.last=t.date; break; }
   case 'expense':{ const a=num(t.amount); post(t,t.acc||'6900',a,t.note||ACC[t.acc||'6900'].name); post(t,cash,-a,'مصرف'); break; }
   case 'capital':{ const a=num(t.amount); post(t,cash,a,'آوردن سرمایه'); post(t,'3100',-a,'آوردن سرمایه'); break; }
   case 'drawing':{ const a=num(t.amount); post(t,'3200',a,t.note||'برداشت مالک'); post(t,cash,-a,'برداشت مالک'); break; }
   case 'transfer':{ const a=num(t.amount); post(t,CASH[t.to]||'1020',a,'انتقال'); post(t,cash,-a,'انتقال'); break; }
   case 'adjust':{ for(const it of items){ const p=gp(it.pid),q=num(it.qty),v=q*p.avg; p.qty+=q;
     post(t,'1200',v,'اصلاح موجودی '+pname(it.pid)); post(t,'6800',-v,'اصلاح موجودی '+pname(it.pid)); } break; }
  }
 }
 // aging per customer
 const td=today();
 for(const id in CU){ const c=CU[id]; c.b=[0,0,0,0]; c.oldest=0;
  for(const o of c.open){ const age=Math.max(0,daysBetween(o.d,td)); c.oldest=Math.max(c.oldest,age); c.b[age<=30?0:age<=60?1:age<=90?2:3]+=o.amt; } }
 return {J,P,CU,SU,costs};
}
function sums(from,to){ const S={}; for(const j of C().J){ if(from&&j.d<from) continue; if(to&&j.d>to) continue; S[j.acc]=(S[j.acc]||0)+j.dr-j.cr; } return S; }
function balOf(code,to){ return sums(null,to)[code]||0; }
function pnl(from,to){ const S=sums(from,to), g=k=>S[k]||0;
 const sales=-g('4100'), ret=g('4200'), netSales=sales-ret, cogs=g('5100'), gross=netSales-cogs, other=-g('4300');
 const exp=ACCOUNTS.filter(a=>a[0][0]==='6').map(a=>({code:a[0],name:a[1],amt:g(a[0])})).filter(e=>Math.abs(e.amt)>0.004);
 const totalExp=exp.reduce((s,e)=>s+e.amt,0);
 return {sales,ret,netSales,cogs,gross,other,exp,totalExp,net:gross+other-totalExp,margin:netSales?gross/netSales*100:0};
}
function balanceSheet(to){ const S=sums(null,to), g=k=>S[k]||0;
 const assets=['1010','1020','1100','1200','1500'].map(k=>({code:k,name:ACC[k].name,amt:g(k)}));
 const liab=['2100','2200'].map(k=>({code:k,name:ACC[k].name,amt:-g(k)}));
 let profit=0; for(const k in S){ if('456'.includes(k[0])) profit-=S[k]; }
 const eq=[{code:'3100',name:ACC['3100'].name,amt:-g('3100')},{code:'3900',name:ACC['3900'].name,amt:-g('3900')},
  {code:'3200',name:ACC['3200'].name+' (منفی)',amt:-g('3200')},{code:'—',name:'سود انباشته (از ابتدا تا این تاریخ)',amt:profit}];
 const tA=assets.reduce((s,a)=>s+a.amt,0), tL=liab.reduce((s,a)=>s+a.amt,0), tE=eq.reduce((s,a)=>s+a.amt,0);

/* ---- Cloud sync (Supabase REST) — optional, so the phone and the computer share one ledger ---- */
let syncState='off', syncTimer=null;
function syncHeaders(){ const k=META.sync.key; return {apikey:k,Authorization:'Bearer '+k,'x-app-key':META.sync.secret||'','Content-Type':'application/json'}; }
async function syncNow(){
 const sc=META.sync; if(!sc.url||!sc.key) { syncState='off'; return 'off'; }
 if(syncState==='busy') return 'busy';
 syncState='busy'; if(typeof drawTop==='function') drawTop();
 const base=sc.url.replace(/\/+$/,'')+'/rest/v1/records';
 try{
  const ids=META.dirty.slice(); const recs=ids.map(findRec).filter(Boolean);
  for(let i=0;i<recs.length;i+=200){
   const chunk=recs.slice(i,i+200).map(r=>({id:r.id,kind:r.kind,data:r}));
   const res=await fetch(base,{method:'POST',headers:Object.assign(syncHeaders(),{Prefer:'resolution=merge-duplicates,return=minimal'}),body:JSON.stringify(chunk)});
   if(!res.ok) throw new Error('push '+res.status+' '+(await res.text()).slice(0,140));
  }
  META.dirty=META.dirty.filter(id=>!ids.includes(id));
  let since=META.lastPull?new Date(new Date(META.lastPull).getTime()-120000).toISOString():'1970-01-01T00:00:00Z', got=0, changed=false;
  for(let page=0;page<50;page++){
   const res=await fetch(base+'?select=id,kind,data,updated_at&updated_at=gt.'+encodeURIComponent(since)+'&order=updated_at.asc&limit=1000',{headers:syncHeaders()});
   if(!res.ok) throw new Error('pull '+res.status+' '+(await res.text()).slice(0,140));
   const rows=await res.json(); got+=rows.length;
   for(const row of rows){ const r=row.data; if(!r||!r.id) continue;
    const local=findRec(r.id);
    if(META.dirty.includes(r.id) && local && local.updatedAt>=r.updatedAt) continue;
    if(!local || (r.updatedAt||'')>(local.updatedAt||'')){
     if(r.kind==='settings') DB.settings=r; else if(KIND[r.kind]){ const arr=DB[KIND[r.kind]]; const i=arr.findIndex(x=>x.id===r.id); if(i>=0) arr[i]=r; else arr.push(r); }
     changed=true; }
    if(!META.lastPull||row.updated_at>META.lastPull) META.lastPull=row.updated_at;
   }
   if(rows.length<1000) break; since=rows[rows.length-1].updated_at;
  }
  META.lastSyncAt=nowIso(); persist(); if(changed) invalidate();
  syncState='ok'; return changed?'changed':'ok';
 }catch(e){ syncState='err'; META.lastSyncErr=String(e.message||e); persist(); return 'err'; }
}
function syncSQL(secret){ return `-- ابراهیمی اکانتینگ — جدول همگام‌سازی (یک بار در Supabase > SQL Editor اجرا کنید)
create table if not exists public.records (
  id text primary key,
  kind text not null,
  data jsonb not null,
  updated_at timestamptz not null default now()
);
create index if not exists records_updated_idx on public.records(updated_at);
create or replace function public.records_touch() returns trigger language plpgsql as $$
begin new.updated_at := clock_timestamp(); return new; end $$;
drop trigger if exists records_touch on public.records;
create trigger records_touch before insert or update on public.records
  for each row execute function public.records_touch();
alter table public.records enable row level security;
drop policy if exists app_key on public.records;
create policy app_key on public.records for all to anon
  using ((current_setting('request.headers', true)::json->>'x-app-key') = '${(secret||'SECRET').replace(/'/g,"''")}')
  with check ((current_setting('request.headers', true)::json->>'x-app-key') = '${(secret||'SECRET').replace(/'/g,"''")}');`; }

 const mx=Math.max(1,...days.map(d=>Math.max(S[d]||0,Cc[d]||0))), W=720, H=210, B=26, L=46, cw=(W-L)/14, h=v=>v/mx*(H-B-14);
 let dfmt; try{ dfmt=new Intl.DateTimeFormat('fa-AF-u-ca-persian',{day:'numeric'}); }catch(e){}
 const k=v=>v>=1e6?fm(r2(v/1e6))+'M':v>=1e3?fm(Math.round(v/1e3))+'K':fm(Math.round(v));
 let g=''; for(let i=0;i<=3;i++){ const y=H-B-(H-B-14)*i/3; g+=`<line x1="${L}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L-6}" y="${y+4}" text-anchor="end" class="ax">${k(mx*i/3)}</text>`; }
 const bars=days.map((d,i)=>{ const x=L+i*cw, s=S[d]||0, c=Cc[d]||0, bw=cw*0.3; return `<g><title>${fd(d)} — فروش ${money(s)} · وصول ${money(c)}</title><rect x="${x+cw*0.17}" y="${H-B-h(s)}" width="${bw}" height="${Math.max(0,h(s))}" rx="4" fill="url(#gS)"/><rect x="${x+cw*0.17+bw+2}" y="${H-B-h(c)}" width="${bw}" height="${Math.max(0,h(c))}" rx="4" fill="url(#gC)"/><text x="${x+cw/2}" y="${H-8}" text-anchor="middle" class="ax ${d===td?'td':''}">${dfmt?dfmt.format(new Date(d+'T12:00:00')):d.slice(8)}</text></g>`; }).join('');
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" dir="ltr"><defs><linearGradient id="gS" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1bc3a4"/><stop offset="1" stop-color="#0f8f78"/></linearGradient><linearGradient id="gC" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc24b"/><stop offset="1" stop-color="#f08c2e"/></linearGradient></defs>${g}${bars}</svg>`; }

function stmtRows(cid){ const x=cust(cid), rows=[]; let bal=0;
 if(num(x.openBal)){ bal=num(x.openBal); rows.push({d:DB.settings.startDate,desc:'طلب اول دوره',no:'',dr:bal>0?bal:0,cr:bal<0?-bal:0,bal}); }
 const tx=DB.txns.filter(t=>!t.void&&t.party===cid&&['sale','sreturn','receipt'].includes(t.type)).sort((a,b)=>(a.date+a.createdAt).localeCompare(b.date+b.createdAt));
 for(const t of tx){ const tot=txnTotal(t);
  if(t.type==='sale'){ bal+=tot; rows.push({id:t.id,d:t.date,desc:'بل فروش ('+(t.items||[]).map(i=>pname(i.pid)).slice(0,3).join('، ')+')',no:t.no,dr:tot,cr:0,bal}); if(num(t.paid)){ bal-=num(t.paid); rows.push({id:t.id,d:t.date,desc:'نقد هنگام فروش',no:t.no,dr:0,cr:num(t.paid),bal}); } }
  if(t.type==='sreturn'){ bal-=tot; rows.push({id:t.id,d:t.date,desc:'مرجوعی جنس',no:t.no,dr:0,cr:tot,bal}); if(num(t.paid)){ bal+=num(t.paid); rows.push({id:t.id,d:t.date,desc:'پس‌دادن پول',no:t.no,dr:num(t.paid),cr:0,bal}); } }
  if(t.type==='receipt'){ const a=num(t.amount)+num(t.discount); bal-=a; rows.push({id:t.id,d:t.date,desc:'دریافت پول'+(num(t.discount)?' (با تخفیف '+fm(t.discount)+')':''),no:t.no,dr:0,cr:a,bal}); }
 } return rows; }
function stmtText(cid){ const x=cust(cid), c=C().CU[cid]||{bal:0}; const rows=stmtRows(cid).slice(-8);
 return `${DB.settings.biz||'ابراهیمی اکانتینگ'}\nصورت‌حساب: ${x.name}\n`+rows.map(r=>`${fd(r.d)} | ${r.desc} | ${r.dr?'+'+fm(r.dr):'-'+fm(r.cr)}`).join('\n')+`\n———\nمانده حساب: ${money(c.bal)}\nتشکر از همکاری شما 🌹`; }
function custProducts(cid){ const m={}; for(const t of DB.txns) if(!t.void&&t.party===cid&&t.type==='sale') for(const i of t.items||[]){ const o=m[i.pid]||(m[i.pid]={q:0,v:0,last:''}); o.q+=num(i.qty); o.v+=num(i.qty)*num(i.price); if(t.date>o.last) o.last=t.date; }
 const a=Object.entries(m).sort((x,y)=>y[1].v-x[1].v); if(!a.length) return '<div class="empty">هنوز خریدی نکرده</div>';
 return `<div class="tw"><table class="tbl"><tr><th>جنس</th><th class="n">تعداد</th><th class="n">ارزش</th><th>آخرین بار</th></tr>${a.map(([p,o])=>`<tr><td>${esc(pname(p))}</td><td class="n">${fm(o.q)} ${esc((prod(p)||{}).unit||'')}</td><td class="n">${money(o.v)}</td><td>${fd(o.last)}</td></tr>`).join('')}</table></div>`; }

  if(id==='__new'){ el.innerHTML=`<div class="psel" onclick="drawParty(true)"><div class="av">${I('plus')}</div><div class="m"><b>${kind==='c'?'دکان جدید':'عمده‌فروش جدید'}</b><div class="mu">مشخصات را پایین بنویسید</div></div><span class="chg">تغییر</span></div>`; return; }
  const p=(kind==='c'?cust:supp)(id); if(!p){ $('#f_party').value=''; return drawParty(true); } const b=pBal(id);
  el.innerHTML=`<div class="psel" onclick="drawParty(true)"><div class="av" style="--c:${pCol(p)}">${esc(p.name[0]||'؟')}</div><div class="m"><b>${esc(p.name)}</b><div class="mu">${esc([p.owner,p.area].filter(Boolean).join(' · '))}</div></div><div class="pb"><div class="mu">${kind==='c'?'بدهی فعلی':'قرض ما'}</div><b class="${b>0.5?(kind==='c'?'warn':'neg'):'pos'}">${money(b)}</b></div></div>`; return; }
 el.innerHTML=`<div class="pdrop"><div class="sbox">${I('search')}<input id="pq" placeholder="${kind==='c'?'جستجوی نام دکان، صاحب یا ساحه…':'جستجوی عمده‌فروش…'}" oninput="drawPL()" autocomplete="off"></div><div class="plist" id="plst"></div></div>`;
 drawPL(); if(window.innerWidth>860) setTimeout(()=>{ const q=$('#pq'); q&&q.focus(); },60); }
function drawPL(){ const el=$('#plst'); if(!el) return; const q=($('#pq').value||'').trim().toLowerCase(), kind=F.pk;
 const last=x=>((kind==='c'?C().CU:C().SU)[x.id]||{}).last||'';
 const a=(kind==='c'?DB.customers:DB.suppliers).filter(x=>!x.deleted&&(!q||[x.name,x.owner,x.area,x.phone,x.code].join(' ').toLowerCase().includes(q))).sort((x,y)=>last(y).localeCompare(last(x))||x.name.localeCompare(y.name,'fa'));
 el.innerHTML=(F.pnew?`<div class="pi new" onclick="pickParty('__new')"><div class="av">${I('plus')}</div><div class="m"><b>${kind==='c'?'دکان جدید':'عمده‌فروش جدید'}</b>${q?`<div class="mu">«${esc(q)}»</div>`:''}</div></div>`:'')+
 a.slice(0,40).map(x=>{ const b=pBal(x.id); return `<div class="pi" onclick="pickParty('${x.id}')"><div class="av" style="--c:${pCol(x)}">${esc(x.name[0]||'؟')}</div><div class="m"><b>${esc(x.name)}</b><div class="mu">${esc([x.owner,x.area].filter(Boolean).join(' · '))}</div></div>${b>0.5?`<b class="${kind==='c'?'warn':'neg'}">${money(b)}</b>`:''}</div>`; }).join('')+(a.length?'':`<div class="empty">در لیست پیدا نشد${F.pnew&&q?' — از دکمهٔ بالا آن را اضافه کنید':''}</div>`); }
function pickParty(id){ const q=(($('#pq')||{}).value||'').trim(); $('#f_party').value=id; drawParty(); partyChanged();
 if(id==='__new'){ const n=$('#f_nc_name'); if(n){ n.value=q; n.focus(); } } }
function partyChanged(){ const v=fv('party'); const nb=$('#newParty'); if(nb) nb.style.display=v==='__new'?'block':'none';
 const gi=$('#gpsInfo'); if(gi&&!F.gps){ const c=cust(v); gi.innerHTML=v==='__new'?'اگر در همین دکان هستید، لوکیشن را بگیرید':c&&!c.lat?'<b class="warn">این دکان هنوز لوکیشن ندارد</b> — اگر آنجا هستید بزنید':c&&c.lat?'لوکیشن این دکان ثبت است ✓':'وقتی در دکان هستید بزنید'; }
 if(F.cart) drawGrid(); calcForm(); }

/* ---------- point-of-sale cart ---------- */
function cartBox(){ return sec('box','اجناس',`<div class="sbox">${I('search')}<input id="gq" placeholder="جستجوی جنس یا کد…" oninput="drawGrid()" autocomplete="off"></div><div class="pgrid" id="pgrid"></div><div id="cart" class="cart"></div>`,`<span class="mu" id="cartCnt"></span>`); }
function lastPrice(cid,pid){ if(!cid||cid==='__new') return 0; const t=DB.txns.filter(t=>!t.void&&t.type==='sale'&&t.party===cid&&(t.items||[]).some(i=>i.pid===pid)).sort((a,b)=>(b.date+b.createdAt).localeCompare(a.date+a.createdAt))[0]; return t?num(t.items.find(i=>i.pid===pid).price):0; }
function defPrice(pid){ const p=prod(pid)||{}; if(F.type==='sale'||F.type==='sreturn') return lastPrice(fv('party'),pid)||num(p.price); if(F.type==='adjust') return 0; return Math.round((C().P[pid]||{}).lastBuy||num(p.openCost)); }
function popularity(){ if(F._pop) return F._pop; const m={}; DB.txns.forEach(t=>{ if(!t.void)(t.items||[]).forEach(i=>m[i.pid]=(m[i.pid]||0)+1); }); return F._pop=m; }
function drawGrid(){ const el=$('#pgrid'); if(!el) return; const q=(($('#gq')||{}).value||'').trim().toLowerCase(), pop=popularity();
 if(!DB.products.some(p=>!p.deleted)){ el.innerHTML=`<div class="empty">هنوز جنسی ثبت نشده — <a href="#" onclick="closeModal();productForm();return false">جنس جدید</a></div>`; return; }
 const a=DB.products.filter(p=>!p.deleted&&(!q||[p.name,p.code,p.cat].join(' ').toLowerCase().includes(q))).sort((x,y)=>(pop[y.id]||0)-(pop[x.id]||0)||x.name.localeCompare(y.name,'fa'));
 el.innerHTML=a.slice(0,q?40:18).map(p=>{ const s=(C().P[p.id]||{qty:0}).qty, inC=F.cart.find(i=>i.pid===p.id);
  return `<button type="button" class="pc ${inC?'on':''}" onclick="addCart('${p.id}')"><b>${esc(p.name)}</b>${F.type==='adjust'?'':`<span>${fm(defPrice(p.id))} ؋</span>`}<i class="${s<=0?'neg':num(p.minQty)&&s<=num(p.minQty)?'warn':''}">موجود ${fm(s)} ${esc(p.unit||'')}</i>${inC?`<em>${fm(inC.qty)}</em>`:''}</button>`; }).join('')||'<div class="empty">پیدا نشد</div>'; }
function addCart(pid){ const it=F.cart.find(i=>i.pid===pid); if(it) it.qty=r2(it.qty+(F.type==='adjust'&&it.qty<0?-1:1)); else F.cart.push({pid,qty:F.type==='adjust'?-1:1,price:defPrice(pid)}); drawCart(); drawGrid(); calcForm(); }
function drawCart(){ const el=$('#cart'); if(!el) return; const adj=F.type==='adjust';
 el.innerHTML=F.cart.map((it,i)=>{ const p=prod(it.pid)||{}, st=(C().P[it.pid]||{qty:0}).qty, over=F.type==='sale'&&it.qty>st;
  return `<div class="cl"><div class="cn"><b>${esc(p.name)}</b><div class="mu ${over?'neg':''}" id="cs${i}">موجود ${fm(st)} ${esc(p.unit||'')}${over?' — کافی نیست':''}</div></div>
  <div class="stp"><button type="button" onclick="stepQ(${i},1)">+</button><input inputmode="decimal" value="${it.qty}" oninput="setQ(${i},this.value)" onfocus="this.select()"><button type="button" onclick="stepQ(${i},-1)">−</button></div>
  ${adj?'':`<label class="cp"><span class="mu">فی</span><input inputmode="decimal" value="${it.price}" oninput="setP(${i},this.value)" onfocus="this.select()"></label><div class="ct" id="ct${i}">${fm(it.qty*it.price)}</div>`}
  <button type="button" class="x" onclick="F.cart.splice(${i},1);drawCart();drawGrid();calcForm()">✕</button></div>`; }).join('')||`<div class="hint" style="text-align:center;padding:6px">روی جنس بزنید تا به ${F.type==='adjust'?'لیست':'بل'} اضافه شود</div>`;
 const c=$('#cartCnt'); if(c) c.textContent=F.cart.length?fm(F.cart.length)+' قلم':''; }
function stepQ(i,d){ const it=F.cart[i]; it.qty=r2(it.qty+d); if(F.type!=='adjust'&&it.qty<=0) F.cart.splice(i,1); drawCart(); drawGrid(); calcForm(); }
function setQ(i,v){ F.cart[i].qty=num(v); const ct=$('#ct'+i); if(ct) ct.textContent=fm(F.cart[i].qty*F.cart[i].price); calcForm(); }
function setP(i,v){ F.cart[i].price=num(v); const ct=$('#ct'+i); if(ct) ct.textContent=fm(F.cart[i].qty*F.cart[i].price); calcForm(); }
const cartGross=()=>(F.cart||[]).reduce((s,i)=>s+num(i.qty)*num(i.price),0);
function readItems(){ return (F.cart||[]).filter(i=>i.pid&&num(i.qty)).map(i=>({pid:i.pid,qty:num(i.qty),price:F.type==='adjust'?0:num(i.price)})); }
function payPct(f){ const net=cartGross()-num(fv('discount')); $('#f_paid').value=f?r2(net*f):''; calcForm(); }

function calcForm(){
 const d=$('#f_date'), df=$('#dateFa'); if(d&&df) df.textContent=fd(d.value);
 if(!F.type) return; const box=$('#sum'), ft=$('#ftot'), fl2=$('#flab');
 const gross=cartGross(), disc=num(fv('discount')), paid=num(fv('paid')), extra=num(fv('extra')), amt=num(fv('amount')), pid=fv('party'), c=C(); let tot=0, lab='مجموع', html='';
 if(F.type==='sale'){ const net=gross-disc, prev=(c.CU[pid]||{bal:0}).bal, rem=net-paid, lim=num((cust(pid)||{}).limit); tot=net; lab='خالص بل';
  html=`<div><span>جمع اجناس</span><b>${money(gross)}</b></div>${disc?`<div><span>تخفیف</span><b>− ${money(disc)}</b></div>`:''}<div><span>نقد گرفته شد</span><b class="pos">${money(paid)}</b></div><div><span>به حساب (قرض)</span><b class="${rem>0.5?'warn':''}">${money(rem)}</b></div>
  ${pid&&pid!=='__new'?`<div class="big"><span>بدهی دکان: ${money(prev)} ←</span><b class="${prev+rem>0.5?'neg':'pos'}">${money(prev+rem)}</b></div>${lim&&prev+rem>lim?`<div class="neg">⚠️ از سقف اعتبار (${money(lim)}) بیشتر می‌شود</div>`:''}`:''}`; }
 else if(F.type==='purchase'){ const owed=gross-disc, rem=owed-paid, prev=(c.SU[pid]||{bal:0}).bal; tot=owed+extra; lab='مجموع خرید';
  html=`<div><span>جمع اجناس</span><b>${money(gross)}</b></div>${disc?`<div><span>تخفیف</span><b>− ${money(disc)}</b></div>`:''}${extra?`<div><span>کرایه/حمالی (روی قیمت جنس)</span><b>${money(extra)}</b></div>`:''}<div><span>پرداخت شد</span><b>${money(paid)}</b></div><div><span>قرض ماند</span><b class="${rem>0.5?'neg':''}">${money(rem)}</b></div>${pid&&pid!=='__new'?`<div class="big"><span>قرض ما: ${money(prev)} ←</span><b class="neg">${money(prev+rem)}</b></div>`:''}`; }
 else if(F.type==='sreturn'||F.type==='preturn'){ tot=gross; lab='ارزش مرجوعی'; html=paid?`<div><span>پول نقد ${F.type==='sreturn'?'پس داده شد':'پس گرفته شد'}</span><b>${money(paid)}</b></div>`:''; }
 else if(F.type==='receipt'){ const prev=(c.CU[pid]||{bal:0}).bal; tot=amt; lab='مبلغ دریافت'; html=pid&&pid!=='__new'?`<div><span>بدهی فعلی</span><b>${money(prev)}</b></div><div><span>دریافت${disc?' + تخفیف':''}</span><b class="pos">− ${money(amt+disc)}</b></div><div class="big"><span>باقی‌مانده</span><b class="${prev-amt-disc>0.5?'warn':'pos'}">${money(prev-amt-disc)}</b></div>`:''; }
 else if(F.type==='payment'){ const prev=(c.SU[pid]||{bal:0}).bal; tot=amt; lab='مبلغ پرداخت'; html=pid&&pid!=='__new'?`<div><span>قرض فعلی ما</span><b>${money(prev)}</b></div><div><span>پرداخت${disc?' + تخفیف':''}</span><b>− ${money(amt+disc)}</b></div><div class="big"><span>باقی قرض</span><b>${money(prev-amt-disc)}</b></div>`:''; }
 else if(F.type==='adjust'){ tot=(F.cart||[]).reduce((s,i)=>s+num(i.qty)*((c.P[i.pid]||{avg:0}).avg),0); lab='اثر مالی'; }
 else { tot=amt; lab='مبلغ'; }
 if(box){ box.innerHTML=html; box.style.display=html?'':'none'; }
 if(ft) ft.textContent=money(tot); if(fl2) fl2.textContent=lab; }

function printTxn(id){ const t=DB.txns.find(x=>x.id===id); if(!t) return; const s=DB.settings, isC=['sale','sreturn','receipt'].includes(t.type), party=isC?cust(t.party):supp(t.party), items=t.items||[];
 let rows=''; const tr=(l,v,b)=>`<tr class="${b?'b':''}"><td>${l}</td><td>${money(v)}</td></tr>`;
 const g=items.reduce((a,i)=>a+num(i.qty)*num(i.price),0);
 if(t.type==='sale'||t.type==='receipt'||t.type==='sreturn'){ const st=stmtRows(t.party), mine=st.filter(r=>r.id===t.id);
  const before=mine.length?mine[0].bal-mine[0].dr+mine[0].cr:0, after=mine.length?mine[mine.length-1].bal:0;
  if(t.type==='sale') rows=tr('جمع اجناس',g)+(t.discount?tr('تخفیف',-num(t.discount)):'')+tr('خالص بل',txnTotal(t),1)+tr('نقد دریافت شد',num(t.paid))+tr('باقی این بل',txnTotal(t)-num(t.paid))+tr('بدهی قبلی',before)+tr('مجموع بدهی شما',after,1);
  else if(t.type==='receipt') rows=tr('بدهی قبلی',before)+tr('مبلغ دریافت شده',num(t.amount),1)+(t.discount?tr('تخفیف',num(t.discount)):'')+tr('باقی‌مانده',after,1);
  else rows=tr('ارزش مرجوعی',g,1)+tr('بدهی بعد از مرجوعی',after,1);
 } else rows=tr('مجموع',txnTotal(t),1)+(t.paid?tr('پرداخت شد',num(t.paid)):'');
 $('#printArea').innerHTML=`<div class="inv"><div class="ih"><div><div class="ib">${esc(s.biz||'ابراهیمی اکانتینگ')}</div><div>${esc(s.addr||'')}</div><div dir="ltr" style="text-align:right">${esc(s.phone||'')}</div></div><div class="ihr"><div class="itl">${TT[t.type][0]}</div><div>نمبر: <b>${esc(t.no)}</b></div><div>تاریخ: ${fd(t.date)}</div></div></div>

function saveTxn(type){

 if(['sale','sreturn','purchase','preturn','adjust'].includes(type)){ t.items=readItems(); if(!t.items.length) return toast('حد اقل یک جنس با تعداد بنویسید'); }
 if(['sale','sreturn','receipt'].includes(type)){ let cid=fv('party');
  if(cid==='__new'){ const nm=fv('nc_name').trim(); if(!nm) return toast('نام دکان جدید را بنویسید'); cid=save('customer',{code:nextNo('C'),name:nm,owner:fv('nc_owner').trim(),phone:fv('nc_phone').trim(),area:fv('nc_area').trim(),openBal:num(fv('nc_open'))}).id; }
  if(!cid){ const q=(($('#pq')||{}).value||'').trim(); return toast(q?'«'+q+'» در لیست نیست — روی «＋ دکان جدید» بزنید':'دکان را انتخاب کنید'); } t.party=cid;
  if(F.gps){ const c=cust(cid); save('customer',Object.assign({},c,{lat:F.gps.lat,lng:F.gps.lng,gpsAcc:F.gps.acc,gpsAt:nowIso()})); } }
 if(['purchase','preturn','payment'].includes(type)){ let sid=fv('party');
  if(sid==='__new'){ const nm=fv('nc_name').trim(); if(!nm) return toast('نام عمده‌فروش را بنویسید'); sid=save('supplier',{code:nextNo('S'),name:nm,area:fv('nc_area').trim()}).id; }
  if(!sid){ const q=(($('#pq')||{}).value||'').trim(); return toast(q?'«'+q+'» در لیست نیست — روی «＋ عمده‌فروش جدید» بزنید':'عمده‌فروش را انتخاب کنید'); } t.party=sid; }
 ['discount','paid','extra','amount'].forEach(k=>{ const v=num(fv(k)); if(v) t[k]=v; });
 if(['discount','paid','extra','amount'].some(k=>t[k]<0)) return toast('مبلغ منفی مجاز نیست');
 if(['receipt','payment','expense','capital','drawing','transfer'].includes(type)&&!t.amount) return toast('مبلغ را بنویسید');
 if(type==='expense') t.acc=fv('acc'); if(type==='transfer'){ t.to=fv('to'); if(t.to===t.method) return toast('مبدأ و مقصد یکی است'); }
 if(type==='sale'){ const net=txnTotal(t); if((t.paid||0)>net+0.01) return toast('نقد گرفته‌شده از خالص بل بیشتر است — اضافه را جدا «دریافت پول» ثبت کنید');
  const short=t.items.filter(i=>num(i.qty)>(C().P[i.pid]||{qty:0}).qty); if(short.length) toast('⚠️ موجودی '+short.map(i=>pname(i.pid)).join('، ')+' کافی نیست — ثبت شد، موجودی را بررسی کنید'); }
 t.no=nextNo(TT[type][1]);
 const r=save('txn',t); closeModal(); if(type!=='sale') toast('✓ ثبت شد — '+r.no); render();
 if(type==='sale') showTxn(r.id,true);
}

function monthStart(){ const t=today(); try{ const p=new Intl.DateTimeFormat('en-u-ca-persian',{day:'numeric'}).format(new Date(t+'T12:00:00')); const d=parseInt(p,10); if(d>0&&d<32) return addDays(t,-(d-1)); }catch(e){} return t.slice(0,8)+'01'; }
let RP={from:'',to:''};
function viewReports(){ const tab=R.tab||'pnl'; if(!RP.from){ RP.from=monthStart(); RP.to=today(); }
 const tabs=[['pnl','سود و زیان'],['bs','بیلانس‌شیت'],['daily','گزارش روزانه / شبانه'],['aging','طلب‌ها و کهنگی'],['sales','فروش اجناس'],['custs','بهترین مشتری‌ها'],['tb','میزان (تراز آزمایشی)'],['gl','دفتر روزنامه'],['coa','کدینگ حساب‌ها']];

const trow=(l,v,cls='',b)=>`<tr><td>${b?'<b>'+l+'</b>':l}</td><td class="n ${cls}">${b?'<b>'+money(v)+'</b>':money(v)}</td></tr>`;

 <tr><td colspan="2" class="mu" style="padding-top:14px">مصارف عملیاتی</td></tr>${p.exp.map(e=>trow(e.code+' — '+e.name,-e.amt,'neg')).join('')||'<tr><td colspan="2" class="mu">—</td></tr>'}${trow('مجموع مصارف',-p.totalExp,'neg',1)}
 <tfoot><tr><td>سود (زیان) خالص</td><td class="n ${p.net>=0?'pos':'neg'}">${money(p.net)}</td></tr></tfoot></table>`; }
function repBS(){ const to=RP.to||today(), b=balanceSheet(to);
 return `<div class="row noprint" style="margin-bottom:10px"><span class="mu">تا تاریخ</span><input class="in" type="date" style="width:auto" value="${to}" onchange="RP.to=this.value;render()"></div>

 <table class="tbl"><tr><th colspan="2">بدهی‌ها</th></tr>${b.liab.map(a=>trow(a.code+' '+a.name,a.amt)).join('')}${trow('جمع بدهی‌ها',b.tL,'',1)}<tr><th colspan="2">سرمایه</th></tr>${b.eq.map(a=>trow(a.code+' '+a.name,a.amt)).join('')}<tfoot><tr><td>جمع بدهی + سرمایه</td><td class="n">${money(b.tL+b.tE)}</td></tr></tfoot></table></div>

function repDaily(){ const d=RP.dd||today(); const tx=DB.txns.filter(t=>!t.void&&t.date===d); const users=[...new Set([...(DB.settings.users||[]),...tx.map(t=>t.by)])];
 const calc=list=>{ const o={sales:0,cashSale:0,recv:0,buy:0,pay:0,exp:0,draw:0,cap:0,ret:0,cin:0,cout:0,cnt:list.length};
  for(const t of list){ const tot=txnTotal(t), cash=t.method!=='bank';
   if(t.type==='sale'){ o.sales+=tot; o.cashSale+=num(t.paid); if(cash) o.cin+=num(t.paid); }
   if(t.type==='receipt'){ o.recv+=num(t.amount); if(cash) o.cin+=num(t.amount); }
   if(t.type==='purchase'){ o.buy+=tot; if(cash) o.cout+=num(t.paid)+num(t.extra); }
   if(t.type==='payment'){ o.pay+=num(t.amount); if(cash) o.cout+=num(t.amount); }
   if(t.type==='expense'){ o.exp+=num(t.amount); if(cash) o.cout+=num(t.amount); }
   if(t.type==='drawing'){ o.draw+=num(t.amount); if(cash) o.cout+=num(t.amount); }
   if(t.type==='capital'){ o.cap+=num(t.amount); if(cash) o.cin+=num(t.amount); }
   if(t.type==='sreturn'){ o.ret+=tot; if(cash) o.cout+=num(t.paid); }
   if(t.type==='preturn'&&cash) o.cin+=num(t.paid);
   if(t.type==='transfer'){ if(t.method==='cash') o.cout+=num(t.amount); if(t.to==='cash') o.cin+=num(t.amount); } } return o; };
 const all=calc(tx), open=balOf('1010',addDays(d,-1)), close=balOf('1010',d);
 const col=(o)=>`<table class="tbl">${trow('فروش (بل‌ها)',o.sales)}${trow('نقد گرفته‌شده هنگام فروش',o.cashSale,'pos')}${trow('دریافت طلب از دکان‌ها',o.recv,'pos')}${trow('خرید از عمده‌فروش',o.buy)}${trow('پرداخت به عمده‌فروش',o.pay,'neg')}${trow('مصارف',o.exp,'neg')}${o.draw?trow('برداشت مالک',o.draw,'neg'):''}${o.ret?trow('مرجوعی فروش',o.ret,'warn'):''}<tfoot><tr><td>خالص نقد (ورود − خروج)</td><td class="n ${o.cin-o.cout>=0?'pos':'neg'}">${money(o.cin-o.cout)}</td></tr></tfoot></table>`;
 return `<div class="row noprint" style="margin-bottom:10px"><span class="mu">روز</span><input class="in" type="date" style="width:auto" value="${d}" onchange="RP.dd=this.value;render()"><b>${fd(d)}</b></div>
 <h3>🌙 گزارش شبانه — جمع‌بندی صندوق</h3><div class="grid k3"><div class="kpi card"><div class="l">صندوق اول روز</div><div class="v">${money(open)}</div></div><div class="kpi card"><div class="l">صندوق آخر روز (باید در دست باشد)</div><div class="v pos">${money(close)}</div></div><div class="kpi card"><div class="l">تعداد ثبت‌ها</div><div class="v">${fm(all.cnt)}</div></div></div>
 <div class="grid k${Math.min(3,users.length+1)}" style="margin-top:12px"><div><h3>همه</h3>${col(all)}</div>${users.map(u=>`<div><h3>👤 ${esc(u)}</h3>${col(calc(tx.filter(t=>t.by===u)))}</div>`).join('')}</div>
 <div class="hint" style="margin-top:8px">💡 هر شب پول دست هر نفر را بشمارید و با «خالص نقد» همان نفر مقایسه کنید. تفاوت = اشتباه یا ثبت‌نشده.</div>`; }
function repAging(){ const c=C(); const a=DB.customers.filter(x=>!x.deleted&&(c.CU[x.id]||{}).bal>0.5).sort((x,y)=>c.CU[y.id].bal-c.CU[x.id].bal); const T=[0,0,0,0];
 const rows=a.map(x=>{ const b=c.CU[x.id].b; b.forEach((v,i)=>T[i]+=v); return `<tr class="click" onclick="go('customer','${x.id}')"><td>${esc(x.name)}<div class="mu" style="font-size:12px">${esc(x.area||'')}</div></td>${b.map((v,i)=>`<td class="n ${i>=2&&v?'neg':''}">${v?fm(v):'—'}</td>`).join('')}<td class="n"><b>${fm(c.CU[x.id].bal)}</b></td><td class="n">${fm(c.CU[x.id].oldest)}</td></tr>`; }).join('');

 return `<h3>⏳ گزارش کهنگی طلب‌ها (Aging)</h3><div class="grid k4" style="margin-bottom:10px">${['۰–۳۰ روز','۳۱–۶۰ روز','۶۱–۹۰ روز','بیش از ۹۰ روز'].map((l,i)=>`<div class="card kpi"><div class="l">${l}</div><div class="v ${i>=2?'neg':''}">${money(T[i])}</div><div class="s">${fm(tot?T[i]/tot*100:0)}٪</div></div>`).join('')}</div>
 <div class="tw"><table class="tbl"><tr><th>دکان</th><th class="n">۰–۳۰</th><th class="n">۳۱–۶۰</th><th class="n">۶۱–۹۰</th><th class="n">+۹۰</th><th class="n">جمع</th><th class="n">روز</th></tr>${rows||'<tr><td colspan="7" class="empty">طلبی نیست</td></tr>'}<tfoot><tr><td>جمع</td>${T.map(v=>`<td class="n">${fm(v)}</td>`).join('')}<td class="n">${fm(tot)}</td><td></td></tr></tfoot></table></div>`; }
function repSales(){ const m={}; for(const t of DB.txns){ if(t.void||t.date<RP.from||t.date>RP.to) continue; if(t.type!=='sale'&&t.type!=='sreturn') continue; const sg=t.type==='sale'?1:-1;
  for(const i of t.items||[]){ const o=m[i.pid]||(m[i.pid]={q:0,v:0}); o.q+=sg*num(i.qty); o.v+=sg*num(i.qty)*num(i.price); } }
 const a=Object.entries(m).sort((x,y)=>y[1].v-x[1].v); const tv=a.reduce((s,x)=>s+x[1].v,0);
 return `<h3>📦 فروش به تفکیک جنس</h3><div class="tw"><table class="tbl"><tr><th>جنس</th><th class="n">تعداد</th><th class="n">مبلغ</th><th class="n">سهم</th><th class="n">میانگین فی</th></tr>${a.map(([p,o])=>`<tr><td>${esc(pname(p))}</td><td class="n">${fm(o.q)} ${esc((prod(p)||{}).unit||'')}</td><td class="n">${money(o.v)}</td><td class="n">${fm(tv?o.v/tv*100:0)}٪</td><td class="n">${fm(o.q?o.v/o.q:0)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">فروشی نیست</td></tr>'}<tfoot><tr><td>جمع</td><td></td><td class="n">${money(tv)}</td><td></td><td></td></tr></tfoot></table></div>`; }
function repCusts(){ const m={}; for(const t of DB.txns){ if(t.void||t.date<RP.from||t.date>RP.to) continue; const o=m[t.party]||(m[t.party]={s:0,r:0,n:0,p:0});
  if(t.type==='sale'){ o.s+=txnTotal(t); o.r+=num(t.paid); o.n++; o.p+=txnTotal(t)-(C().costs[t.id]||0); } if(t.type==='receipt') o.r+=num(t.amount); if(t.type==='sreturn'){ o.s-=txnTotal(t); o.p-=txnTotal(t)+(C().costs[t.id]||0); } }
 const a=Object.entries(m).filter(([id])=>cust(id)).sort((x,y)=>y[1].s-x[1].s);
 return `<h3>🏆 مشتری‌ها به ترتیب خرید</h3><div class="tw"><table class="tbl"><tr><th>دکان</th><th class="n">بل‌ها</th><th class="n">خرید</th><th class="n">سود ناخالص</th><th class="n">پول داده</th><th class="n">بدهی فعلی</th></tr>${a.map(([id,o])=>`<tr class="click" onclick="go('customer','${id}')"><td>${esc(cust(id).name)}</td><td class="n">${fm(o.n)}</td><td class="n">${money(o.s)}</td><td class="n pos">${money(o.p)}</td><td class="n">${money(o.r)}</td><td class="n">${money((C().CU[id]||{bal:0}).bal)}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">—</td></tr>'}</table></div>`; }
function repTB(){ const S={}; for(const j of C().J){ if(j.d<RP.from&&!'123'.includes(j.acc[0])) continue; if(j.d>RP.to) continue; const o=S[j.acc]||(S[j.acc]={dr:0,cr:0}); o.dr+=j.dr; o.cr+=j.cr; }
 let td=0,tc=0; const rows=ACCOUNTS.filter(a=>S[a[0]]).map(a=>{ const o=S[a[0]], b=o.dr-o.cr; td+=b>0?b:0; tc+=b<0?-b:0; return `<tr><td>${a[0]}</td><td>${a[1]}</td><td class="n">${fm(o.dr)}</td><td class="n">${fm(o.cr)}</td><td class="n">${b>0?fm(b):''}</td><td class="n">${b<0?fm(-b):''}</td></tr>`; }).join('');
 return `<h3>⚖️ میزان (تراز آزمایشی)</h3><div class="hint">حساب‌های دائمی (دارایی/بدهی/سرمایه) از ابتدا؛ حساب‌های موقت (فروش/مصرف) در بازهٔ انتخاب‌شده.</div><div class="tw"><table class="tbl"><tr><th>کد</th><th>حساب</th><th class="n">گردش بدهکار</th><th class="n">گردش بستانکار</th><th class="n">ماندهٔ بدهکار</th><th class="n">ماندهٔ بستانکار</th></tr>${rows}<tfoot><tr><td></td><td>جمع</td><td></td><td></td><td class="n">${fm(td)}</td><td class="n">${fm(tc)}</td></tr></tfoot></table></div><div class="hint">${Math.abs(td-tc)<1?'':'ℹ️ تفاوت جمع‌ها برابر سود/زیان دوره‌های قبل از بازه است.'}</div>`; }
function repGL(){ const js=C().J.filter(j=>j.d>=RP.from&&j.d<=RP.to); const g={}; js.forEach(j=>(g[j.tx]=g[j.tx]||[]).push(j)); const keys=Object.keys(g).slice(-200).reverse();
 return `<h3>📘 دفتر روزنامه (اسناد دوبل‌انتری)</h3><div class="tw"><table class="tbl"><tr><th>تاریخ</th><th>سند</th><th>حساب</th><th class="n">بدهکار</th><th class="n">بستانکار</th></tr>${keys.map(k=>g[k].map((j,i)=>`<tr ${k!=='opening'?`class="click" onclick="showTxn('${k}')"`:''}><td>${i?'':fd(j.d)}</td><td class="mu">${i?'':esc(j.no)}</td><td>${j.cr?'&nbsp;&nbsp;&nbsp;&nbsp;':''}${j.acc} ${esc(ACC[j.acc].name)}<div class="mu" style="font-size:12px">${esc(j.memo)}</div></td><td class="n">${j.dr?fm(j.dr):''}</td><td class="n">${j.cr?fm(j.cr):''}</td></tr>`).join('')).join('')||'<tr><td colspan="5" class="empty">—</td></tr>'}</table></div>`; }
function repCOA(){ const S=sums(null,null); const nat={A:'دارایی',L:'بدهی',E:'سرمایه','E-':'کاهندهٔ سرمایه',R:'درآمد','R-':'کاهندهٔ درآمد',X:'هزینه'};
 return `<h3>🗂️ کدینگ حساب‌ها (Chart of Accounts)</h3><div class="hint">کدینگ استاندارد ۴ رقمی: ۱ دارایی، ۲ بدهی، ۳ سرمایه، ۴ درآمد، ۵ قیمت تمام‌شده، ۶ مصارف.</div><table class="tbl"><tr><th>کد</th><th>نام حساب</th><th>ماهیت</th><th class="n">مانده</th></tr>${ACCOUNTS.map(a=>`<tr><td><b>${a[0]}</b></td><td>${a[1]}</td><td class="mu">${nat[a[2]]}</td><td class="n">${fm(Math.abs(S[a[0]]||0))}</td></tr>`).join('')}</table>`; }

/* ---------- settings ---------- */
function viewSettings(){ const s=DB.settings, sc=META.sync;
 return `<div class="grid k2">
 <div class="card"><h3>🏢 کسب‌وکار</h3>${fl('نام',`<input class="in" id="s_biz" value="${esc(s.biz)}">`)}${fl('کاربران (با ویرگول جدا کنید)',`<input class="in" id="s_users" value="${esc((s.users||[]).join('، '))}">`)}<div class="f2">${fl('شماره تماس (روی بل چاپی)',`<input class="in" id="s_phone" dir="ltr" value="${esc(s.phone||'')}">`)}${fl('آدرس (روی بل چاپی)',`<input class="in" id="s_addr" value="${esc(s.addr||'')}">`)}</div>${fl('تاریخ شروع حساب‌ها (اول دوره)',`<input class="in" type="date" id="s_start" value="${s.startDate}">`)}
 <button class="btn" onclick="saveSettings()">💾 ذخیره</button><div class="hint" style="margin-top:8px">کد این دستگاه: <b>${META.device}</b> (در نمبر بل‌ها می‌آید تا بل‌های گوشی و کامپیوتر قاطی نشوند)</div></div>
 <div class="card"><h3>💾 پشتیبان (بکاپ)</h3><div class="hint">همه اطلاعات در همین مرورگر ذخیره است. هر هفته یک بکاپ بگیرید و در گوگل‌درایو/تلگرام نگه دارید.</div>
 <div class="row" style="margin-top:10px"><button class="btn" onclick="exportJSON()">⬇️ دانلود بکاپ کامل</button><label class="btn alt">⬆️ بازیابی از بکاپ<input type="file" accept=".json,application/json" style="display:none" onchange="importJSON(this.files[0])"></label></div>
 <div class="row" style="margin-top:8px"><button class="btn alt sm" onclick="exportCSV('cust')">CSV طلب‌ها</button><button class="btn alt sm" onclick="exportCSV('tx')">CSV معاملات</button><button class="btn alt sm" onclick="exportCSV('stock')">CSV موجودی</button><button class="btn alt sm" onclick="window.print()">🖨️ چاپ صفحه</button></div>
 <div class="row" style="margin-top:14px"><button class="btn or sm" onclick="confirmBtn(this,loadDemo)">🧪 بارگذاری دادهٔ آزمایشی</button><button class="btn red sm" onclick="confirmBtn(this,wipeAll)">🗑️ پاک کردن همه</button></div></div>
 <div class="card" style="grid-column:1/-1"><h3>☁️ همگام‌سازی گوشی ⇄ کامپیوتر (Supabase — رایگان)</h3>
 <div class="hint">با این بخش، هر چیزی که با گوشی در دکان ثبت می‌شود، شب روی کامپیوتر هم دیده می‌شود (و برعکس). بدون انترنت هم کار می‌کند و وقتی انترنت آمد خودش همگام می‌کند.<br>
 ۱) در supabase.com یک پروژهٔ رایگان بسازید. ۲) یک «رمز همگام‌سازی» دلخواه پایین بنویسید. ۳) کد SQL زیر را کاپی کرده در SQL Editor اجرا کنید. ۴) Project URL و anon key را از Settings › API اینجا بگذارید. ۵) روی همهٔ دستگاه‌ها همین سه مقدار را وارد کنید.</div>
 <div class="grid k3" style="margin-top:10px">${fl('Project URL',`<input class="in" id="s_url" dir="ltr" value="${esc(sc.url||'')}" placeholder="https://xxxx.supabase.co">`)}${fl('anon / publishable key',`<input class="in" id="s_key" dir="ltr" value="${esc(sc.key||'')}">`)}${fl('رمز همگام‌سازی (طولانی و مخفی)',`<input class="in" id="s_secret" dir="ltr" value="${esc(sc.secret||'')}" oninput="$('#sqlBox').textContent=syncSQL(this.value)">`)}</div>
 <div class="row"><button class="btn" onclick="saveSync()">💾 ذخیره و همگام‌سازی</button><button class="btn alt" onclick="doSync(true)">🔄 همین حالا همگام کن</button><button class="btn alt sm" onclick="navigator.clipboard.writeText($('#sqlBox').textContent).then(()=>toast('SQL کاپی شد'))">📋 کاپی SQL</button></div>
 <div class="hint" style="margin-top:6px">وضعیت: ${syncState==='ok'?'✅ همگام':syncState==='err'?'❌ '+esc(META.lastSyncErr||''):syncState==='off'?'خاموش':'…'} ${META.lastSyncAt?' · آخرین همگام‌سازی: '+new Date(META.lastSyncAt).toLocaleString('fa-AF'):''} · ${fm(META.dirty.length)} ثبت ارسال‌نشده</div>
 <details style="margin-top:8px"><summary class="mu">نمایش کد SQL</summary><pre class="code" id="sqlBox">${esc(syncSQL(sc.secret))}</pre></details></div>
 </div><div class="hint" style="margin-top:10px;text-align:center">ابراهیمی اکانتینگ نسخهٔ ${VERSION}</div>`; }
function saveSettings(){ const users=$('#s_users').value.split(/[،,]/).map(s=>s.trim()).filter(Boolean); if(!users.length) return toast('حد اقل یک کاربر لازم است');
 save('settings',Object.assign({},DB.settings,{biz:$('#s_biz').value.trim()||'ابراهیمی اکانتینگ',users,phone:$('#s_phone').value.trim(),addr:$('#s_addr').value.trim(),startDate:$('#s_start').value||today()})); if(!users.includes(META.user)){ META.user=users[0]; persist(); } toast('ذخیره شد ✓'); render(); }
function saveSync(){ META.sync={url:$('#s_url').value.trim(),key:$('#s_key').value.trim(),secret:$('#s_secret').value.trim()};
 if(META.sync.url&&!META.dirty.length){ META.dirty=allRecords().map(r=>r.id); } persist(); doSync(true); }
async function doSync(manual){ const r=await syncNow(); drawTop(); if(r==='changed') render(); else if(manual&&R.v==='settings') render();
 if(manual) toast(r==='err'?'❌ همگام‌سازی نشد: '+(META.lastSyncErr||''):r==='off'?'همگام‌سازی تنظیم نشده':'✅ همگام شد'); }
function dl(name,content,type){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([content],{type})); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500); }
function exportJSON(){ dl('ebrahimi-backup-'+today()+'.json',JSON.stringify({app:'ebrahimi-accounting',version:VERSION,exportedAt:nowIso(),db:DB},null,1),'application/json'); toast('بکاپ دانلود شد'); }
function importJSON(file){ if(!file) return; const rd=new FileReader(); rd.onload=()=>{ try{ const o=JSON.parse(rd.result); const d=o.db||o; if(!Array.isArray(d.txns)) throw new Error('فایل معتبر نیست');
  DB=Object.assign(defaultDB(),d); META.dirty=allRecords().map(r=>r.id); persist(); invalidate(); toast('✅ بازیابی شد: '+fm(DB.txns.length)+' سند'); render(); }catch(e){ toast('❌ '+e.message); } }; rd.readAsText(file); }
function csv(rows){ return '﻿'+rows.map(r=>r.map(v=>{ const s=String(v??''); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }).join(',')).join('\n'); }
function exportCSV(k){ const c=C();
 if(k==='cust') dl('receivables-'+today()+'.csv',csv([['کد','دکان','صاحب','شماره','ساحه','بدهی','قدیمی‌ترین (روز)','0-30','31-60','61-90','90+','lat','lng'],...DB.customers.filter(x=>!x.deleted).map(x=>{ const u=c.CU[x.id]||{bal:0,oldest:0,b:[0,0,0,0]}; return [x.code,x.name,x.owner,x.phone,x.area,r2(u.bal),u.oldest,...(u.b||[0,0,0,0]).map(r2),x.lat||'',x.lng||'']; })]),'text/csv');
 if(k==='tx') dl('transactions-'+today()+'.csv',csv([['نمبر','تاریخ','نوع','طرف','مبلغ','نقد/پرداخت','تخفیف','روش','ثبت‌کننده','یادداشت','باطل'],...DB.txns.map(t=>[t.no,t.date,TT[t.type][0],partyName(t),r2(txnTotal(t)),t.paid||t.amount||'',t.discount||'',t.method,t.by,t.note,t.void?'بله':''])]),'text/csv');
 if(k==='stock') dl('stock-'+today()+'.csv',csv([['کد','جنس','واحد','موجودی','قیمت تمام‌شده','قیمت فروش','ارزش'],...DB.products.filter(p=>!p.deleted).map(p=>{ const s=c.P[p.id]||{qty:0,avg:0}; return [p.code,p.name,p.unit,r2(s.qty),r2(s.avg),p.price,r2(s.qty*s.avg)]; })]),'text/csv'); }
function wipeAll(){ DB=defaultDB(); META.dirty=[]; META.lastPull=''; persist(); invalidate(); toast('همه پاک شد'); go('dash'); }
function loadDemo(){
 DB=defaultDB(); const sd=addDays(today(),-75); DB.settings.startDate=sd; persist(); invalidate();
 const P=[['روغن آفتاب ۵ لیتره','روغن','قطی',780,690,40],['برنج سیلا ۲۵ کیلو','برنج و آرد','بوجی',2650,2380,15],['آرد ۵۰ کیلو','برنج و آرد','بوجی',1900,1720,20],['بوره ۵۰ کیلو','مواد خوراکی','بوجی',3400,3150,10],['چای سبز ۱ کیلو','مواد خوراکی','بسته',420,360,30],['صابون لباس','شوینده','کارتن',950,820,12],['پودر لباس ۳ کیلو','شوینده','دانه',310,260,24],['نوشابه ۲۵۰ میلی (کارتن)','نوشیدنی','کارتن',540,470,25]]
  .map(a=>save('product',{code:nextNo('P'),name:a[0],cat:a[1],unit:a[2],price:a[3],openCost:a[4],openQty:a[5]*5,minQty:Math.round(a[5]/2)}));
 const S=[['تجارتخانه حاجی رحیم','مندوی، سرای عشقری'],['شرکت پخش نوشابه','شهرنو']].map(a=>save('supplier',{code:nextNo('S'),name:a[0],area:a[1]}));
 const CU=[['سوپرمارکت برادران','حاجی نادر','کارته‌سه',34.5097,69.1330],['دکان امید','احمد','دشت برچی',34.5040,69.0920],['فروشگاه نور','محمود','خیرخانه',34.5895,69.1475],['دکان رحمت','رحمت‌الله','کوته‌سنگی',34.5205,69.1240],['مارکیت الفتح','سید جواد','قلعه‌فتح‌الله',34.5370,69.1770],['دکان هزاره','علی','دشت برچی، سرک ۴',34.4985,69.0855],['سوپرمارکت کابل','فرید','شهرنو',34.5340,69.1680],['دکان صادق','صادق','پل‌سوخته',34.5130,69.1095]]
  .map((a,i)=>save('customer',{code:nextNo('C'),name:a[0],owner:a[1],area:a[2],lat:a[3],lng:a[4],phone:'07'+(90000000+i*1234567),limit:i%3===0?60000:0,openBal:i%4===1?8500:0}));
 const users=DB.settings.users; let rnd=7; const rand=()=>{ rnd=(rnd*9301+49297)%233280; return rnd/233280; };
 for(let d=70; d>=0; d--){ const date=addDays(today(),-d); META.user=users[d%2];
  if(d%6===0){ const s=S[d%12===0?1:0]; const it=(s===S[1]?[P[7]]:P.slice(0,7).filter(()=>rand()>0.4)).map(p=>({pid:p.id,qty:20+Math.floor(rand()*25),price:p.openCost*(0.98+rand()*0.06)}));
   if(it.length){ const g=it.reduce((x,i)=>x+i.qty*i.price,0); save('txn',{type:'purchase',no:nextNo('PUR'),date,party:s.id,items:it,extra:Math.round(g*0.01),paid:Math.round(g*(0.5+rand()*0.5)),method:'cash'}); } }
  const n=1+Math.floor(rand()*3);
  for(let k=0;k<n;k++){ const c=CU[Math.floor(rand()*CU.length)]; const it=P.filter(()=>rand()>0.65).slice(0,3).map(p=>({pid:p.id,qty:1+Math.floor(rand()*4),price:p.price}));
   if(!it.length) continue; const g=it.reduce((x,i)=>x+i.qty*i.price,0); const r=rand(); save('txn',{type:'sale',no:nextNo('INV'),date,party:c.id,items:it,paid:r<0.35?g:r<0.7?Math.round(g*0.5/100)*100:0,method:'cash'}); }
  if(d%4===0){ const c=CU[Math.floor(rand()*CU.length)]; const b=(C().CU[c.id]||{bal:0}).bal; if(b>1000) save('txn',{type:'receipt',no:nextNo('RCV'),date,party:c.id,amount:Math.round(b*0.6/100)*100,method:'cash'}); }
  if(d%3===0) save('txn',{type:'expense',no:nextNo('EXP'),date,acc:'6100',amount:800+Math.round(rand()*400),note:'دیزل موتر',method:'cash'});
  if(d%30===0) save('txn',{type:'expense',no:nextNo('EXP'),date,acc:'6300',amount:12000,note:'کرایه هنگر',method:'cash'});
  if(d%10===0) save('txn',{type:'payment',no:nextNo('PAY'),date,party:S[0].id,amount:Math.max(0,Math.round(((C().SU[S[0].id]||{bal:0}).bal)*0.5/100)*100)||1000,method:'cash'});
 }
 save('txn',{type:'capital',no:nextNo('CAP'),date:sd,amount:450000,method:'cash',note:'سرمایهٔ اولیه'});
 META.user=users[0]; persist(); invalidate(); toast('دادهٔ آزمایشی بارگذاری شد'); go('dash'); }

/* ---------- boot ---------- */
load();
document.documentElement.dataset.theme=META.theme||'light';
onSaved=()=>{ clearTimeout(syncTimer); syncTimer=setTimeout(()=>doSync(false),1500); };
window.addEventListener('hashchange',()=>{ const h=location.hash.slice(1); if(h&&h!==R.v&&NAV.concat([['more']]).some(n=>n[0]===h)){ R={v:h,id:null,tab:null}; render(); } });
document.addEventListener('keydown',e=>{ const open=!$('#modal').classList.contains('hide'); if(e.key==='Escape'&&open) return closeModal(); if(open||e.target.matches('input,select,textarea')) return;
 const k={F2:saleForm,F3:receiptForm,F4:purchaseForm,F8:expenseForm}[e.key]; if(k){ e.preventDefault(); k(); } });
window.addEventListener('online',()=>doSync(false));
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) doSync(false); });
setInterval(()=>doSync(false),60000);
{ const h=location.hash.slice(1); if(NAV.some(n=>n[0]===h)||h==='more') R.v=h; }
render(); doSync(false);
</script>
