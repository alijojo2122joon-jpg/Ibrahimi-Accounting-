 out.push([Math.abs(d-cr)<1,'دفتر روزنامه متوازن است (جمع بدهکار = جمع بستانکار)',money(d)+' / '+money(cr)]);
 const bs=balanceSheet(today()); out.push([bs.ok,'بیلانس‌شیت برابر است (دارایی = بدهی + سرمایه)','']);
 const ar=balOf('1100'), cu=Object.values(c.CU).reduce((s,x)=>s+x.bal,0); out.push([Math.abs(ar-cu)<1,'حساب طلب‌ها با مجموع حساب دکان‌ها برابر است',money(ar)]);
 const ap=-balOf('2100'), su=Object.values(c.SU).reduce((s,x)=>s+x.bal,0); out.push([Math.abs(ap-su)<1,'حساب قرض‌ها با مجموع حساب عمده‌فروش‌ها برابر است',money(ap)]);
 const neg=DB.products.filter(p=>!p.deleted&&(c.P[p.id]||{qty:0}).qty<0); out.push([!neg.length,neg.length?'موجودی منفی: '+neg.map(p=>p.name).join('، '):'هیچ جنسی موجودی منفی ندارد',neg.length?'این یعنی فروشی ثبت شده که خریدش ثبت نشده':'']);
 const cash=balOf('1010'); out.push([cash>=0,cash>=0?'صندوق نقدی منفی نیست':'صندوق نقدی منفی است',cash<0?'یک خرید/مصرف بیش از پول موجود ثبت شده یا سرمایه/نقد اول دوره ثبت نشده':money(cash)]);
 const noloc=DB.customers.filter(x=>!x.deleted&&!x.lat&&!x.walkin).length; out.push([!noloc,noloc?fm(noloc)+' دکان لوکیشن ندارد':'همه دکان‌ها لوکیشن دارند','']);
 const dup={}; DB.txns.forEach(t=>{ if(t.no) dup[t.no]=(dup[t.no]||0)+1; }); const dn=Object.values(dup).filter(v=>v>1).length; out.push([!dn,dn?fm(dn)+' نمبر سند تکراری':'نمبرهای سند یکتا هستند','']);
 const orph=orphanTxns(); out.push([!orph.length,orph.length?fm(orph.length)+' سند به دکانِ یکی‌شده/حذف‌شده وصل است':'همهٔ سندها به دکان درست وصل‌اند',orph.length?'دکمهٔ «درست کن» پایین را بزنید':'']);
 openModal('بررسی سلامت حساب‌ها',(orph.length&&can('delete')?`<button class="btn" style="width:100%;margin-bottom:12px" onclick="fixOrphans()">درست کن (${fm(orph.length)} سند)</button>`:'')+`<div class="list">${out.map(o=>`<div class="it" style="cursor:default"><div class="ic" style="--c:${o[0]?'#16a37a':'#e5484d'};width:38px;height:38px">${I(o[0]?'check':'alert')}</div><div class="m"><div class="t" style="font-weight:600">${esc(o[1])}</div>${o[2]?`<div class="d">${esc(o[2])}</div>`:''}</div></div>`).join('')}</div>`); }

/* ---------- invoice as an image (share to WhatsApp) ---------- */
async function txnImage(id){ const t=DB.txns.find(x=>x.id===id); if(!t) return; const s=DB.settings, isC=['sale','sreturn','receipt'].includes(t.type), party=isC?cust(t.party):supp(t.party), items=t.items||[];
 try{ await document.fonts.load('700 30px Vazirmatn'); await document.fonts.load('400 26px Vazirmatn'); }catch(e){}
 const W=1080, P=60, rowH=74, st=isC&&party?stmtRows(t.party).filter(r=>r.id===t.id):[], before=st.length?st[0].bal-st[0].dr+st[0].cr:0, after=st.length?st[st.length-1].bal:0;
 const tot=[]; const g=items.reduce((a,i)=>a+num(i.qty)*num(i.price),0);
 if(t.type==='sale'){ tot.push(['جمع اجناس',g]); if(t.discount) tot.push(['تخفیف',-num(t.discount)]); tot.push(['خالص بل',txnTotal(t),1],['نقد دریافت شد',num(t.paid)],['بدهی قبلی',before],['مجموع بدهی شما',after,1]); }
 else if(t.type==='receipt'){ tot.push(['بدهی قبلی',before],['مبلغ دریافت شده',num(t.amount),1]); if(t.discount) tot.push(['تخفیف',num(t.discount)]); tot.push(['باقی‌مانده',after,1]); }
 else tot.push(['مجموع',txnTotal(t),1]);
 const H=360+(party?110:0)+(items.length?90+items.length*rowH:0)+tot.length*62+220;
 const cv=document.createElement('canvas'); cv.width=W; cv.height=H; const x=cv.getContext('2d'); x.direction='rtl';
 const F=(w,sz)=>`${w} ${sz}px Vazirmatn, Tahoma, sans-serif`, txt=(t2,X,Y,f,col,al='right')=>{ x.font=f; x.fillStyle=col; x.textAlign=al; x.fillText(t2,X,Y); };
 x.fillStyle='#eef1f4'; x.fillRect(0,0,W,H);
 const gr=x.createLinearGradient(0,0,W,260); gr.addColorStop(0,'#1bc3a4'); gr.addColorStop(1,'#0f8f78'); x.fillStyle=gr; x.fillRect(0,0,W,250);
 x.strokeStyle='rgba(255,255,255,.35)'; x.lineWidth=10; x.beginPath(); x.arc(150,125,80,Math.PI*0.9,Math.PI*1.9); x.stroke();
 txt(s.biz||'ابراهیمی اکانتینگ',W-P,105,F(800,58),'#fff'); txt([s.phone,s.addr].filter(Boolean).join(' ،  ')||'حسابداری توزیع عمده',W-P,170,F(400,30),'rgba(255,255,255,.9)');
 let y=330; txt(TT[t.type][0],W-P,y,F(800,44),'#18211f'); txt(t.no,P,y-4,F(700,30),'#0f8f78','left'); y+=48; txt('تاریخ: '+fd(t.date),W-P,y,F(400,28),'#6b7a76'); if(t.by) txt((t.type==='sale'?'فروشنده: ':'ثبت: ')+t.by,P,y,F(400,26),'#6b7a76','left');
 if(party){ y+=40; x.fillStyle='#fff'; rr(x,P,y,W-2*P,86,22); x.fill(); txt((isC?'مشتری: ':'عمده‌فروش: ')+party.name,W-P-28,y+55,F(700,32),'#18211f'); if(party.area) txt(party.area,P+28,y+55,F(400,26),'#6b7a76','left'); y+=86; }
 if(items.length){ y+=50; txt('جنس',W-P,y,F(700,26),'#6b7a76'); txt('تعداد × فی',W/2,y,F(700,26),'#6b7a76','center'); txt('جمع',P,y,F(700,26),'#6b7a76','left'); y+=20;
  items.forEach((i,k)=>{ x.fillStyle=k%2?'#eef1f4':'#fff'; x.fillRect(P-10,y,W-2*P+20,rowH); const yy=y+48;
   txt(pname(i.pid),W-P,yy,F(700,30),'#18211f'); txt(iq(i)+' × '+fm(ip(i)),W/2,yy,F(400,28),'#18211f','center'); txt(fm(num(i.qty)*num(i.price)),P,yy,F(700,30),'#18211f','left'); y+=rowH; }); }
 y+=30; tot.forEach(([l,v,b])=>{ y+=62; if(b){ x.fillStyle='rgba(19,163,137,.12)'; rr(x,P-10,y-44,W-2*P+20,60,14); x.fill(); } txt(l,W-P,y,F(b?800:400,b?34:30),'#18211f'); txt(money(v),P,y,F(b?800:600,b?36:30),b?'#0f8f78':'#18211f','left'); });
 y+=90; txt('تشکر از اعتماد شما 🌹',W/2,y,F(700,32),'#0f8f78','center'); txt('ساخته‌شده با ابراهیمی اکانتینگ',W/2,y+46,F(400,22),'#9aa5a1','center');
 const blob=await new Promise(r=>cv.toBlob(r,'image/png')); const file=new File([blob],(t.no||'bill')+'.png',{type:'image/png'});
 if(APP){ APP.shareFile(file.name,await b64of(blob),'image/png'); return; }
 try{ if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:TT[t.type][0]+' '+t.no}); return; } }catch(e){ if(e&&e.name==='AbortError') return; }
 const u=URL.createObjectURL(blob); openModal('عکس بل',`<img src="${u}" style="width:100%;border-radius:16px;box-shadow:var(--up)"><div class="hint" style="margin-top:10px">روی عکس انگشت نگه دارید و «ذخیره» یا «اشتراک» را بزنید، یا دکمهٔ زیر را بزنید.</div><a class="btn" style="width:100%;margin-top:10px" href="${u}" download="${esc(file.name)}">${I('in')} ذخیرهٔ عکس</a>`); }
function rr(x,X,Y,w,h,r){ x.beginPath(); x.moveTo(X+r,Y); x.arcTo(X+w,Y,X+w,Y+h,r); x.arcTo(X+w,Y+h,X,Y+h,r); x.arcTo(X,Y+h,X,Y,r); x.arcTo(X,Y,X+w,Y,r); x.closePath(); }

/* ---------- undo snackbar ---------- */
let SNK=null;
function snack(msg,undo){ const el=$('#snack'); clearTimeout(SNK); el.innerHTML=`<span>${msg}</span>${undo?`<button onclick="snackUndo()">لغو</button>`:''}`; el.classList.add('on'); window._undo=undo; SNK=setTimeout(()=>el.classList.remove('on'),7000); }
function snackUndo(){ const f=window._undo; window._undo=null; $('#snack').classList.remove('on'); if(f) f(); }
function undoTxn(id){ const t=DB.txns.find(x=>x.id===id); if(!t||t.void) return; save('txn',Object.assign({},t,{void:true,voidBy:META.user,voidAt:nowIso(),voidReason:'لغو فوری بعد از ثبت'})); closeModal(); toast('لغو شد — سند باطل شد'); render(); }

/* ---------- price list for shops ---------- */
let PLF={stock:true};
function priceTrend(p){ const h=(p.priceHist||[]); if(!h.length) return 0; const last=h[h.length-1]; if(daysBetween(last.at.slice(0,10),today())>7) return 0; return num(p.price)>num(last.price)?1:num(p.price)<num(last.price)?-1:0; }
function priceItems(){ const c=C(); return DB.products.filter(p=>!p.deleted&&num(p.price)>0&&(!PLF.stock||(c.P[p.id]||{qty:0}).qty>0)).sort((a,b)=>(a.cat||'').localeCompare(b.cat||'','fa')||a.name.localeCompare(b.name,'fa')); }
function priceText(){ const g={}; priceItems().forEach(p=>(g[p.cat||'سایر']=g[p.cat||'سایر']||[]).push(p));
 return `📋 لیست قیمت ${DB.settings.biz||'ابراهیمی'} — ${fd(today())}\n`+Object.entries(g).map(([k,ps])=>`\n▫️ ${k}\n`+ps.map(p=>`• ${p.name}: ${fm(p.price)} افغانی${p.unit?' / '+p.unit:''}${priceTrend(p)>0?' 🔺':priceTrend(p)<0?' 🔻':''}`).join('\n')).join('\n')+`\n\nبرای فرمایش پیام بدهید${DB.settings.phone?' — '+DB.settings.phone:''} 🌹`; }
function priceList(){ const a=priceItems();
 openModal('لیست قیمت برای دکان‌ها',`<div class="hint" style="margin-bottom:10px">این لیست را در گروه واتس‌اپ دکان‌داران بفرستید. 🔺/🔻 یعنی قیمت در هفتهٔ اخیر تغییر کرده.</div>
 <div class="seg" style="margin-bottom:14px"><button type="button" class="${PLF.stock?'on':''}" onclick="PLF.stock=true;priceList()">فقط اجناس موجود</button><button type="button" class="${PLF.stock?'':'on'}" onclick="PLF.stock=false;priceList()">همه اجناس</button></div>
 <div class="list">${a.map(p=>`<div class="it" style="cursor:default"><div class="m"><div class="t">${esc(p.name)}</div><div class="d">${esc(p.cat||'')}</div></div><div class="a">${money(p.price)} ${priceTrend(p)>0?'<span class="neg">▲</span>':priceTrend(p)<0?'<span class="pos">▼</span>':''}<div class="mu" style="font-size:11px;font-weight:500">${esc(p.unit||'')}</div></div></div>`).join('')||'<div class="empty">جنسی با قیمت فروش نیست</div>'}</div>
 <div class="stick"><div class="ft"><span class="mu">اجناس</span><b>${fm(a.length)}</b></div><button class="btn alt" onclick="navigator.clipboard.writeText(priceText()).then(()=>toast('کاپی شد'))">کاپی</button><a class="btn" style="--c:#25b05a" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(priceText())}">${I('wa')} واتس‌اپ</a></div>`); }

function compressImg(file,max=720,q=0.72){ return new Promise((res,rej)=>{ const fr=new FileReader(); fr.onerror=rej; fr.onload=()=>{ const im=new Image(); im.onerror=rej; im.onload=()=>{ const r=Math.min(1,max/Math.max(im.width,im.height)); const c=document.createElement('canvas'); c.width=Math.round(im.width*r); c.height=Math.round(im.height*r); c.getContext('2d').drawImage(im,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',q)); }; im.src=fr.result; }; fr.readAsDataURL(file); }); }

const canScan=()=>'BarcodeDetector' in window&&navigator.mediaDevices&&navigator.mediaDevices.getUserMedia;
let SCAN=null;
async function scanBarcode(onCode){ if(!canScan()) return toast('اسکن بارکد در این مرورگر نیست — از Chrome در Android استفاده کنید');
 const ov=document.createElement('div'); ov.className='scanov'; ov.innerHTML=`<video playsinline muted></video><div class="sframe"></div><div class="shint">بارکد را جلوی کمره بگیرید</div><button class="btn red">بستن</button>`; document.body.appendChild(ov);

 }catch(e){ stop(); toast('کمره باز نشد — اجازهٔ کمره را بدهید'); } }

/* ---------- expiry tracking (per purchase line) ---------- */
function expiringBatches(days=60){ const lim=addDays(today(),days), out=[], c=C();
 if(!c.anyExp){ c.anyExp=DB.txns.some(t=>t.type==='purchase'&&(t.items||[]).some(i=>i.exp))?1:2; } if(c.anyExp===2) return out;
 if(!c.buysP){ c.buysP={}; for(let k=c.sorted.length-1;k>=0;k--){ const t=c.sorted[k]; if(t.type!=='purchase') continue; for(const i of t.items||[]) (c.buysP[i.pid]||(c.buysP[i.pid]=[])).includes(t)||c.buysP[i.pid].push(t); } }
 for(const p of DB.products.filter(p=>!p.deleted)){ let left=(c.P[p.id]||{qty:0}).qty; if(left<=0) continue;
  const buys=c.buysP[p.id]||[];
  for(const t of buys){ if(left<=0) break; for(const i of t.items.filter(i=>i.pid===p.id)){ if(left<=0) break; const q=Math.min(left,num(i.qty)); left-=q; if(i.exp&&i.exp<=lim) out.push({p,q,exp:i.exp,days:daysBetween(today(),i.exp),no:t.no}); } } }
 return out.sort((a,b)=>a.exp.localeCompare(b.exp)); }
function expiryCard(){ const a=expiringBatches(60); if(!a.length) return '';
 return `<div class="card" style="margin-top:18px"><h3>${I('alert')} نزدیک به تاریخ انقضا — اول این‌ها را بفروشید</h3><div class="list">${a.slice(0,6).map(o=>`<div class="it" onclick="go('product','${o.p.id}')"><div class="ic" style="--c:${o.days<0?'#e5484d':o.days<=30?'#f08c2e':'#f0b429'};width:40px;height:40px">${I('clock')}</div><div class="m"><div class="t">${esc(o.p.name)}</div><div class="d">${qtyTxt(o.p,o.q)}، خرید ${esc(o.no)}</div></div><div class="a ${o.days<0?'neg':o.days<=30?'warn':''}">${o.days<0?'گذشته!':fm(o.days)+' روز'}<div class="mu" style="font-size:11px;font-weight:500">${fd(o.exp)}</div></div></div>`).join('')}</div></div>`; }

function persianMonths(n){ let pf; try{ pf=new Intl.DateTimeFormat('en-u-ca-persian',{year:'numeric',month:'numeric',day:'numeric'}); }catch(e){ return []; }

 const out=[]; let d=today(), guard=0;
 while(out.length<n&&guard++<400){ const parts=pf.formatToParts(new Date(d+'T12:00:00')); const day=+parts.find(p=>p.type==='day').value.replace(/\D/g,''); const from=addDays(d,-(day-1));

 // fix "to" values (each month ends the day before the next one starts)
 for(let i=0;i<out.length;i++) out[i].to=i<out.length-1?addDays(out[i+1].from,-1):today();
 return out; }

  if(d%30===0) save('txn',{type:'expense',no:nextNo('EXP'),date,acc:'6300',amount:12000,note:'کرایه هنگر',method:'cash'});

 }
 save('txn',{type:'capital',no:nextNo('CAP'),date:sd,amount:450000,method:'cash',note:'سرمایهٔ اولیه'});
 META.user=users[0]; persist(); invalidate(); toast('دادهٔ آزمایشی بارگذاری شد'); go('dash'); }

 const atEnd=el.selectionStart===el.value.length; let raw=String(el.value).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/٫/g,'.');
 const neg=/^\s*[-−]/.test(raw); raw=raw.replace(/[^\d.]/g,''); if(raw===''){ if(!neg) el.value=''; return; }
 const parts=raw.split('.'), i=(parts[0]||'0').replace(/^0+(?=\d)/,'').replace(/\B(?=(\d{3})+(?!\d))/g,','), nv=(neg?'-':'')+(parts.length>1?i+'.'+parts.slice(1).join('').slice(0,2):i);
 if(nv!==el.value){ el.value=nv; if(atEnd) try{ el.setSelectionRange(nv.length,nv.length); }catch(_){} } },true);
